<style>
:root {
  --bg: #f8fafc; --surface: #fff; --surface2: #f1f5f9; --border: #e2e8f0;
  --text: #0f172a; --text2: #475569; --text3: #94a3b8;
  --accent: #2563eb; --accent-text: #fff;
  --shadow: 0 1px 3px rgba(15,23,42,.08);
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1220; --surface: #111827; --surface2: #1e293b; --border: #334155;
    --text: #f1f5f9; --text2: #94a3b8; --text3: #64748b;
    --accent: #3b82f6; --shadow: 0 1px 3px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #111827; --surface2: #1e293b; --border: #334155;
  --text: #f1f5f9; --text2: #94a3b8; --text3: #64748b;
  --accent: #3b82f6; --shadow: 0 1px 3px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.55;
}
button { font: inherit; }
a { color: var(--accent); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 56px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.55rem; font-weight: 700; }
h2 { margin: 0 0 10px; font-size: 1.12rem; font-weight: 700; }
h3 { margin: 0 0 8px; font-size: .95rem; font-weight: 700; }
.muted { color: var(--text2); font-size: .875rem; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px;
}
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { background: var(--surface2); border-radius: 8px; padding: 10px 12px; }
.stat .label { font-size: .75rem; color: var(--text3); }
.stat .value { font-size: 1.1rem; font-weight: 700; }
.theme-toggle {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text);
  border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-nav button {
  border: none; background: var(--surface2); color: var(--text); width: 32px; height: 32px;
  border-radius: 8px; cursor: pointer;
}
.cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-weekdays span { font-size: .75rem; color: var(--text3); padding: 4px 0; }
.cal-day {
  width: 100%; aspect-ratio: 1; max-width: 40px; margin: 0 auto;
  border: none; border-radius: 8px; cursor: default; font-size: .85rem;
  background: var(--surface2); color: var(--text3); opacity: .45;
}
.cal-day.has-data { opacity: 1; color: var(--text); cursor: pointer; }
.cal-day.has-data:hover { background: var(--border); }
.cal-day.selected { background: var(--accent) !important; color: var(--accent-text) !important; opacity: 1; }
.pill {
  display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px;
  font-size: .72rem; font-weight: 600; border: 1px solid var(--border); background: var(--surface2);
  margin: 0 4px 4px 0;
}
.pill.j-success { background: #dcfce7; color: #15803d; border-color: #86efac; }
.pill.j-warning { background: #fef9c3; color: #a16207; border-color: #fde047; }
.pill.j-info { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.pill.j-danger { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }
.ticker-pill {
  display: inline-flex; padding: 2px 7px; border-radius: 999px; font-size: .72rem;
  font-weight: 600; border: 1px solid currentColor; margin: 2px 4px 2px 0;
}
.tweet-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; background: var(--surface); }
.tweet-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; font-size: .8rem; color: var(--text2); }
.bilingual { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 820px) { .bilingual { grid-template-columns: 1fr; } }
.col-label { font-size: .72rem; font-weight: 700; color: var(--text3); margin-bottom: 4px; letter-spacing: .04em; }
.col-body { white-space: pre-wrap; font-size: .88rem; color: var(--text); background: var(--surface2); border-radius: 8px; padding: 10px 12px; }
.col-en .col-body { color: var(--text2); }
.theme-block { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
.theme-head {
  width: 100%; text-align: left; border: none; background: var(--surface2); color: var(--text);
  padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; align-items: center;
}
.theme-body { padding: 10px 14px 14px; display: none; }
.theme-block.open .theme-body { display: block; }
.entry {
  border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-top: 8px; background: var(--surface);
}
.entry-summary {
  font-size: .88rem; color: var(--text); line-height: 1.55; margin-top: 6px;
}
.layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
.day-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.day-head h2 { margin: 0; }
.filter-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-tab {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: .82rem; font-weight: 600;
}
.filter-tab:hover { background: var(--border); }
.filter-tab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.filter-tab .count { opacity: .85; font-weight: 500; margin-left: 4px; }
.gloss-term {
  border-bottom: 1px dashed var(--accent); cursor: help; position: relative;
}
.gloss-term:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.gloss-tip {
  display: none; position: fixed; z-index: 9999; max-width: 300px;
  background: #1e293b; color: #f8fafc; font-size: .78rem; line-height: 1.45;
  padding: 8px 10px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.25);
  pointer-events: none;
}
.gloss-tip.visible { display: block; }
</style>

    <div id="themeWall"></div>

 will be more widespread then cars. People see the \"50k-100k+\" BOM cost now and think humans can do better. \n\nBut it's about the future: I think both ubiquity/cost will end up like computers. \n\nAnd technologically, we'll see humanoids outperform humans in most physical tasks from basketball to surgery, similar to how AI was able evolve to beat humans in almost everything academic. \n\nSo down the line, I think costs to make a humanoid at scale will keep getting compressed, optimized, and compressed down to <$5k over time. \n\nWhile underlying technology improves to displace work over a longer term horizon.", "text_zh": "我猜人形机器人未来会比汽车更普及。人们看到现在「5–10 万+」BOM 就觉得人还能干得更好。\n\n但关键是未来：我认为普及度与成本最终会像电脑一样。\n技术上，人形会在从篮球到手术的大多数体力任务上超越人类——就像 AI 几乎在所有学术任务上击败人类一样。\n\n长期看，规模化制造成本会不断压缩、优化，压到 <5000 美元。\n底层技术则会在更长周期里替代劳动。", "media": []}, {"id": "2075557588159058076", "url": "https://x.com/aleabitoreddit/status/2075557588159058076", "created_at": "Fri Jul 10 12:27:45 +0000 2026", "created_at_cst": "2026-07-10 20:27", "is_reply": false, "metrics": {"likes": 784, "retweets": 53, "replies": 162, "quotes": 5, "views": 265869, "bookmarks": 210}, "tickers": [{"symbol": "CCXI", "sentiment": "中性偏好"}, {"symbol": "JBL", "sentiment": "中性偏好"}, {"symbol": "TSLA", "sentiment": "中性偏好"}, {"symbol": "XPEV", "sentiment": "一般"}, {"symbol": "7211.T", "sentiment": "中性偏好"}, {"symbol": "7203.T", "sentiment": "一般"}, {"symbol": "2317.TW", "sentiment": "一般"}, {"symbol": "BMW.DE", "sentiment": "一般"}, {"symbol": "MBG.DE", "sentiment": "一般"}, {"symbol": "005380.KS", "sentiment": "中性偏好"}, {"symbol": "005930.KS", "sentiment": "一般"}, {"symbol": "9880.HK", "sentiment": "一般"}], "themes": ["humanoid", "memory"], "text_en": "Mitsubishi Motors joins robotics race to deploy humanoid workers by 2027. \n\nPairing with Highlanders, a Japanese robotics company.\n\n- Agility $CCXI x Foxconn, Toyota\n- Apptronik x $JBL, Mercedes\n- Highlanders x Mitsubishi\n- Figure × BMW\n- Boston Dynamics x Hyundai (subsidiaries)\n- Optim \nDon't see a reason to exit my position since I'm trying to own as much as possible before 1.6T pluggables and CPO architectural inflections hit.\n\nBetter not to give malicious accounts additional views.", "text_zh": "我拉黑了他们，因为他们以传播假信息著称。\n\n尤其是在空头活动被曝光之后——有营销号叫人卖出，而这些账号过去还推过同类亚洲加密项目。\n\n- 他们造谣说我用 AI 捏造 $AMD 的 CW 激光 LTA 报告，尽管报告直接来自 Trendforce。\n被打脸后又试图抹掉真实来源引用。\n\n- 我并没有卖掉大块 $SIVE 仓位；我持有 100 万+ 股（不是美元名义），是最大个人股东之一。\n在 1.6T 可插拔与 CPO 架构拐点到来前，我想尽量多持有，没理由退出。\n\n最好别再给恶意账号额外曝光。", "media": []}, {"id": "2075542529467154838", "url": "https://x.com/aleabitoreddit/status/2075542529467154838", "created_at": "Fri Jul 10 11:27:55 +0000 2026", "created_at_cst": "2026-07-10 19:27", "is_reply": true, "metrics": {"likes": 500, "retweets": 15, "replies": 50, "quotes": 3, "views": 39020, "bookmarks": 33}, "tickers": [{"symbol": "AAOI", "sentiment": "中性偏好"}], "themes": ["cpo_optics"], "text_en": "@UNICONTSLA On the $AAOI chart, we're able to see the \"Sleeping King\" indicator. \n\nYou can see the crown form from the chopping patterns. \n\nBut once the king wakes up from their nap... chart fundamentals expect a royal decree. https://t.co/YQTSgpPMnR", "text_zh": "@UNICONTSLA 在 $AAOI 图表上，我们能看到「沉睡之王」指标。\n\n你可以从震荡形态里看出王冠成形。\n但一旦国王从午睡中醒来……按图表基本面，就该有王室诏令了。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HM3OkqMbUAAONda.jpg", "width": 2611, "height": 1889}]}, {"id": "2075539824589860866", "url": "https://x.com/aleabitoreddit/status/2075539824589860866", "created_at": "Fri Jul 10 11:17:10 +0000 2026", "created_at_cst": "2026-07-10 19:17", "is_reply": false, "metrics": {"likes": 1789, "retweets": 72, "replies": 232, "quotes": 16, "views": 591591, "bookmarks": 142}, "tickers": [{"symbol": "SIVE.ST", "sentiment": "看好"}], "themes": ["cpo_optics"], "text_en": "The \"Mythical Golden Egg Dragon Candle\" predicted the $SIVE rally today. \n\nIf you look at the Golden Egg hatching indicator I drew, you can tell it predicts Sivers CEO buying on the open market a day later. \n\nDo you guys think it's time I should sell courses on TA? https://t.co/LweBzWStuk", "text_zh": "「神话金蛋龙烛」今天预言了 $SIVE 反弹。\n\n如果你看我画的金蛋孵化指标，就能看出它预言了 Sivers CEO 次日在公开市场买入。\n\n你们觉得我是不是该出技术分析课了？", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HM3MdqGbwAA1N21.jpg", "width": 1200, "height": 1146}, {"type": "photo", "url": "https://pbs.twimg.com/media/HM3MdrPbsAAZZeg.jpg", "width": 997, "height": 1200}]}, {"id": "2075496116481884524", "url": "https://x.com/aleabitoreddit/status/2075496116481884524", "created_at": "Fri Jul 10 08:23:29 +0000 2026", "created_at_cst": "2026-07-10 16:23", "is_reply": false, "metrics": {"likes": 1705, "retweets": 139, "replies": 133, "quotes": 13, "views": 587796, "bookmarks": 626}, "tickers": [{"symbol": "LITE", "sentiment": "看好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "GFS", "sentiment": "中性偏好"}, {"symbol": "JBL", "sentiment": "中性偏好"}, {"symbol": "POET", "sentiment": "中性偏好"}, {"symbol": "TSM", "sentiment": "看好"}, {"symbol": "8091.TW", "sentiment": "中性偏好"}, {"symbol": "AAOI", "sentiment": "中性偏好"}, {"symbol": "IQE", "sentiment": "中性偏好"}, {"symbol": "MTSI", "sentiment": "中性偏好"}, {"symbol": "TSEM", "sentiment": "中性偏好"}, {"symbol": "AXTI", "sentiment": "中性偏好"}, {"symbol": "META", "sentiment": "一般"}, {"symbol": "NVDA", "sentiment": "看好"}, {"symbol": "RKLB", "sentiment": "一般"}, {"symbol": "NBIS", "sentiment": "一般"}, {"symbol": "005930.KS", "sentiment": "一般"}, {"symbol": "000660.KS", "sentiment": "一般"}], "themes": ["cpo_optics", "ai_compute", "memory", "macro_noise"], "text_en": "Yep, it’s interesting to witness retail capitulation.\n\nAfter we got Bloomberg Meta compute article cleared up by their internal memo. \n\nAnd the 2 reports on delays were denied by Nvidia. \n\nBoth of which caused the selloff in the first place...\n\nSo Photonics / Nvidia’s roadmap hasn’t fundamentally changed:\n\n$LITE is still completely sold out for the next 2 years and likely into 2029.\n\n$SIVE is about to volume ramp with  GlobalFoundries, Jabil, Poet, Ayar, and other hyperscaler suppliers.\n\n$TSM COUPE and their TW suppliers from Shunsin to Foci aren’t randomly disappearing into the void.\n\n$AAOI and their $471m/month h2 2027 revenue projections haven’t changed.\n\n$IQE and their epiwafer contracts with Macom and Tower Semi haven’t disappeared.\n\n$AXTI ownership of 40% of the InP substrate supply chains haven’t suddenly disappeared.\n\nAs with any theme from Rocketlab + Space sector 50% drop back in 2025. \n\nOr Nebius + Neocloud 50% drop entering 2026.\n\nOr the Samsung/SK Hynix crash from Iran War LNG/Helium/Oil fears few months ago.\n\nVolatility from indiscriminate thematic selloffs isn’t typically representative of individual company fundamentals.\n\nRetail tends to build conviction over price movements and imaginary charts, then lose that when a stock drops.\n\nAnd institutions are probably placing limit orders to capitalize on that.\n\nConviction shouldn’t be tied to the quote of a stock on a certain day, but long term revenue or operating income growth.", "text_zh": "是的，旁观散户投降很有意思。\n\n彭博那篇 Meta 算力文章已被内部备忘录澄清。\n两篇延期报道也被英伟达否认。\n而这两者本来就是这轮抛售的导火索……\n\n所以光子学 / 英伟达路线图本质上并没有变：\n\n$LITE 未来两年（甚至可能到 2029）仍然完全售罄。\n$SIVE 即将与 GlobalFoundries、Jabil、Poet、Ayar 以及其他超大规模客户供应商一起放量。\n$TSM 的 COUPE 及其台湾供应链（从舜宇到联钧等）不会凭空消失。\n$AAOI 及其 2027 年下半年约 4.71 亿美元/月的收入预期也没有变。\n$IQE 与 Macom、Tower Semi 的外延片合同没有消失。\n$AXTI 对约 40% InP 衬底供应链的掌控也没有突然消失。\n\n就像任何主题都会经历：2025 年 Rocket Lab + 航天板块腰斩；\n2026 年初 Nebius + Neocloud 腰斩；\n几个月前因伊朗战争 LNG/氦气/石油恐慌导致的三星/SK 海力士暴跌。\n\n主题性无差别抛售带来的波动，通常并不代表个股基本面。\n散户往往按价格波动和想象中的图表建立信念，股价一跌就丢掉信念。\n而机构大概正在挂限价单吃这波。\n\n信念不应绑在某一天的报价上，而应绑在长期收入或营业利润增长上。", "media": []}, {"id": "2075302956581449892", "url": "https://x.com/aleabitoreddit/status/2075302956581449892", "created_at": "Thu Jul 09 19:35:56 +0000 2026", "created_at_cst": "2026-07-10 03:35", "is_reply": false, "metrics": {"likes": 1828, "retweets": 141, "replies": 230, "quotes": 18, "views": 757921, "bookmarks": 391}, "tickers": [{"symbol": "TSLA", "sentiment": "看好"}, {"symbol": "CCXI", "sentiment": "看好"}], "themes": ["humanoid"], "text_en": "\"China is shipping ~90% of the world's humanoid robots. We cannot keep taking them lightly.\"\n\nElon's comment: \"For now\"\n\nMeanwhile, 1X today posts a video of the most advanced humanoid hand.\n\nLooks like the inflection point for American humanoid programs is here?\n\nBoth technologically with players like 1X and with mass production with $TSLA? \n\nI'm am personally long on Agility through $CCXI targeting commercialization with Amazon and others. \n\nBut I'm proud to see American robotics as a whole go brrrr.", "text_zh": "「中国出货了全球约 90% 的人形机器人。我们不能再轻视。」\n\n马斯克回应：「眼下如此。」\n\n与此同时，1X 今天放出目前最先进人形手部视频。\n\n美国人形项目的拐点要来了？技术侧有 1X 这类玩家，量产侧有 $TSLA？\n\n我个人通过 $CCXI 做多 Agility，押注其与亚马逊等的商业化落地。\n但也为整个美国机器人「开挂加速」感到兴奋。", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2075302057356234752/vid/avc1/1280x960/L73Aw27-yvVWGr_D.mp4?tag=28", "width": 1280, "height": 960}]}, {"id": "2075289915697553697", "url": "https://x.com/aleabitoreddit/status/2075289915697553697", "created_at": "Thu Jul 09 18:44:07 +0000 2026", "created_at_cst": "2026-07-10 02:44", "is_reply": false, "metrics": {"likes": 1889, "retweets": 150, "replies": 234, "quotes": 30, "views": 568018, "bookmarks": 320}, "tickers": [{"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "GFS", "sentiment": "中性偏好"}, {"symbol": "JBL", "sentiment": "中性偏好"}, {"symbol": "META", "sentiment": "一般"}], "themes": ["cpo_optics"], "text_en": "Three new $SIVE insider purchases today. \n\nMost notably: $SIVEF CEO Vikram bought 1,000,000 SEK worth of shares on the open market today. \n\nThis is following the massive drop on Sivers stock following 2 misleading CPO delay reports, Meta Compute headlines, and another insider sale report from another photonics director. \n\nTypically, insider sells for any number of reasons. But having the  CEO buy on the open-market is the clearest signal in management confidence. \n\nFollowing $GFS, $JBL, and other laser supplier partnerships, and his goal of NASDAQ listing in the near term. \n\nFeels like the CEO sees a clear potential for Sivers to become the next photonics giant (myself included).", "text_zh": "今天又有三笔 $SIVE 内部人买入。\n\n最醒目：Sivers CEO Vikram 今日在公开市场买入约 100 万瑞典克朗股票。\n\n背景是两篇误导性 CPO 延期报道、Meta Compute 标题，以及另一位光子学董事的减持消息，导致股价大跌之后。\n\n内部人减持原因很多，但 CEO 公开市场买入，通常是管理层信心最清晰的信号之一。\n\n叠加 $GFS、$JBL 等激光供应链合作，以及他近期赴纳斯达克上市的目标——\n感觉 CEO（包括我自己）都看见 Sivers 成为下一代光子学巨头的清晰潜力。", "media": []}]}, "20260711": {"date": "20260711", "date_label": "2026年7月11日", "tweet_count": 9, "tweets": [{"id": "2075908823521583440", "url": "https://x.com/aleabitoreddit/status/2075908823521583440", "created_at": "Sat Jul 11 11:43:26 +0000 2026", "created_at_cst": "2026-07-11 19:43", "is_reply": true, "metrics": {"likes": 119, "retweets": 2, "replies": 11, "quotes": 1, "views": 25562, "bookmarks": 3}, "tickers": [], "themes": ["misc"], "text_en": "@jaredisathome Strange everyone’s already taking allegations as a fact.\n\nLooks credible, but companies file lawsuits all the time to slow down competitors.", "text_zh": "@jaredisathome 奇怪，大家已经把指控当既成事实了。\n\n看起来可信，但公司天天打官司拖慢竞争对手也很常见。", "media": []}, {"id": "2075896028323254679", "url": "https://x.com/aleabitoreddit/status/2075896028323254679", "created_at": "Sat Jul 11 10:52:36 +0000 2026", "created_at_cst": "2026-07-11 18:52", "is_reply": false, "metrics": {"likes": 238, "retweets": 9, "replies": 20, "quotes": 4, "views": 41875, "bookmarks": 34}, "tickers": [{"symbol": "TSLA", "sentiment": "一般"}, {"symbol": "MSFT", "sentiment": "一般"}, {"symbol": "NVDA", "sentiment": "一般"}, {"symbol": "AAPL", "sentiment": "一般"}], "themes": ["ai_compute", "openai_ecosystem"], "text_en": "He wouldn't have build a $1T company without pulling off all those moves.\n\n- Gets funding from Elon -> Pisses off $TSLA going independent\n- Gets funding from $MSFT -> Pisses of Microsoft by diluting them with other hyperscaler funding\n- Gets funding from $NVDA -> Builds their competing chip and funds Cerebras competitors for inference\n- Works with $AAPL on Apple Intelligence? -> Create their competing devices. \n- Potential lack of funding? -> Sign a lot of LTAs so the entire industry lives or dies off OpenAI succeeding.\n\nWhatever he's doing is working lol.", "text_zh": "他若做不出万亿公司，也干不出那些操作。\n\n- 拿 Elon 的钱 → 独立后惹怒 $TSLA\n- 拿 $MSFT 的钱 → 又引入其他超大规模资金稀释微软，惹怒微软\n- 拿 $NVDA 的钱 → 自研竞品芯片，还给 Cerebras 等推理竞品输血\n- 跟 $AAPL 做 Apple Intelligence？→ 又做竞品设备\n- 怕缺钱？→ 签一大堆 LTA，让全行业成败绑在 OpenAI 上\n\n不管他在搞什么，反正管用 lol。", "media": []}, {"id": "2075894311741440041", "url": "https://x.com/aleabitoreddit/status/2075894311741440041", "created_at": "Sat Jul 11 10:45:46 +0000 2026", "created_at_cst": "2026-07-11 18:45", "is_reply": false, "metrics": {"likes": 1747, "retweets": 69, "replies": 216, "quotes": 22, "views": 499425, "bookmarks": 140}, "tickers": [{"symbol": "AAPL", "sentiment": "一般"}, {"symbol": "GOOGL", "sentiment": "一般"}, {"symbol": "MSFT", "sentiment": "一般"}], "themes": ["openai_ecosystem"], "text_en": "Contrarian take, but Sam Altman / OpenAI is doing something right if he's pissing off every Mag7 like $AAPL. \n\nBy building their own ecosystem instead of being sucked into another. \n\nIt's been awhile since $GOOGL, Apple, Microsoft, and others had some genuine disruptors.", "text_zh": "逆向看法：如果山姆·奥特曼 / OpenAI 把 Mag7（比如 $AAPL）全惹毛了，说明他做对了什么。\n他在自建生态，而不是被吸进别人的生态。\n$GOOGL、苹果、微软等好久没遇到真正的颠覆者了。", "media": []}, {"id": "2075670213169918070", "url": "https://x.com/aleabitoreddit/status/2075670213169918070", "created_at": "Fri Jul 10 19:55:17 +0000 2026", "created_at_cst": "2026-07-11 03:55", "is_reply": true, "metrics": {"likes": 138, "retweets": 3, "replies": 3, "quotes": 0, "views": 29125, "bookmarks": 11}, "tickers": [{"symbol": "SIVE.ST", "sentiment": "看好"}], "themes": ["cpo_optics", "memory"], "text_en": "@siflower It’s architecture neutral. UHP output can be achieved with a single cw laser or multi emitter cw dfb array which is what $SIVE is doing for CPO.\n\nSince the latter aggregate output is comparable.", "text_zh": "@siflower 这是架构中性的。UHP 输出既可用单颗 CW 激光实现，也可用多发射极 CW DFB 阵列——$SIVE 在 CPO 上走的就是后者。\n因为后者聚合输出相当。", "media": []}, {"id": "2075645547978084371", "url": "https://x.com/aleabitoreddit/status/2075645547978084371", "created_at": "Fri Jul 10 18:17:16 +0000 2026", "created_at_cst": "2026-07-11 02:17", "is_reply": false, "metrics": {"likes": 920, "retweets": 71, "replies": 260, "quotes": 6, "views": 387716, "bookmarks": 165}, "tickers": [{"symbol": "AMZN", "sentiment": "一般"}, {"symbol": "AAOI", "sentiment": "谨慎"}, {"symbol": "AVGO", "sentiment": "中性偏好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}], "themes": ["cpo_optics", "openai_ecosystem", "daily_sweep"], "text_en": "Regarding $AMZN RNG + OpenAI’s MRC and VCSELs. \n\nIn what appears to be an indirect response on B. Riley's $AAOI sell report regarding optimizations that \"flattens networks and cuts transceiver TAM 40-50%\".\n\nRosenblatt TLDR: They've already modeled for this, even though each XPU may use fewer transceivers.\n\nThe number of XPUs is growing so quickly that total optical demand should still rise. \n\nOn lasers architectures for CPO: VCSELs are useful as a credible bridge for NPO/short reach. \n\nIdeal architecture though for CPO is UHP CW over other lasers, and cites Broadcom for that statements. Which happens to supports my core $SIVE thesis. \n\nI feel like Rosenblatt and I share the same views on a lot of things, I like the way they roll.", "text_zh": "关于 $AMZN RNG + OpenAI 的 MRC 与 VCSEL。\n\n看起来像在间接回应 B. Riley 对 $AAOI 的卖出报告——该报告称网络优化会「压平网络、砍掉收发器 TAM 的 40–50%」。\n\nRosenblatt 摘要：他们已经把这建模进去了；即便每颗 XPU 用更少收发器，\nXPU 数量增长太快，光学总需求仍应上升。\n\nCPO 激光架构：VCSEL 可作为 NPO/短距的可信过渡。\n但理想 CPO 架构是 UHP CW，并引用博通说法——这正好支撑我的核心 $SIVE 论点。\n\n感觉我和 Rosenblatt 在很多事上看法一致，我喜欢他们的风格。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HM4os9Jb0AECclK.png", "width": 1701, "height": 455}]}, {"id": "2075634064518955297", "url": "https://x.com/aleabitoreddit/status/2075634064518955297", "created_at": "Fri Jul 10 17:31:39 +0000 2026", "created_at_cst": "2026-07-11 01:31", "is_reply": false, "metrics": {"likes": 1715, "retweets": 139, "replies": 160, "quotes": 21, "views": 467023, "bookmarks": 492}, "tickers": [{"symbol": "AAOI", "sentiment": "中性偏好"}, {"symbol": "LITE", "sentiment": "中性偏好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "COHR", "sentiment": "看好"}], "themes": ["cpo_optics", "memory", "macro_noise"], "text_en": "Rosenblatt on recent optical sector weakness from $AAOI to $LITE:\n\n\"Stocks in the Optical sector have traded poorly for the last 1-2 months\" due to CPO delay reports and China capacity scares.\n\n\"We think short sellers... do not actually strongly believe in the thesis.\"\n\nMultiple short sellers told them they will likely close their positions... late July and early August. Further, they say they plan to buy Optical stocks in 2027 for the scale up CPO opportunity.\n\nHilarious report on laser weakness, read is very positive for $SIVEF, $COHR, and others moving forward.\n\nI've been long on CPO sector, but seems like institutions want entry points, just a bit later on.", "text_zh": "Rosenblatt 谈近期光学板块从 $AAOI 到 $LITE 的疲软：\n\n「过去 1–2 个月光学板块表现很差」，原因是 CPO 延期报道与中国产能恐慌。\n\n「我们认为空头……其实并不真的很信这个空头逻辑。」\n\n多名空头告诉他们可能会在 7 月底到 8 月初平仓；并计划在 2027 年为 CPO 放量机会买入光学股。\n\n这篇关于激光疲软的报告挺好笑，读下来对 $SIVEF、$COHR 等其实非常正面。\n\n我一直做多 CPO，但机构似乎想要更好的入场点，只是稍晚一点。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HM4heWhbwAEOjmt.png", "width": 1963, "height": 707}]}, {"id": "2075613590955106581", "url": "https://x.com/aleabitoreddit/status/2075613590955106581", "created_at": "Fri Jul 10 16:10:17 +0000 2026", "created_at_cst": "2026-07-11 00:10", "is_reply": true, "metrics": {"likes": 60, "retweets": 1, "replies": 6, "quotes": 0, "views": 34559, "bookmarks": 2}, "tickers": [{"symbol": "TSM", "sentiment": "中性偏好"}, {"symbol": "SIVE.ST", "sentiment": "中性偏好"}], "themes": ["misc"], "text_en": "@yuntungshieh Hmm, maybe the influx of US buying pressure might have have a structural impact though? \n\nBut I'm sure that's probably the case with a premium as seen with $TSM.", "text_zh": "@yuntungshieh 嗯，美国买盘涌入或许会有结构性影响？\n不过我猜会像 $TSM 那样带溢价。", "media": []}, {"id": "2075613235756294559", "url": "https://x.com/aleabitoreddit/status/2075613235756294559", "created_at": "Fri Jul 10 16:08:53 +0000 2026", "created_at_cst": "2026-07-11 00:08", "is_reply": true, "metrics": {"likes": 221, "retweets": 7, "replies": 15, "quotes": 2, "views": 36276, "bookmarks": 11}, "tickers": [{"symbol": "SIVE.ST", "sentiment": "看好"}], "themes": ["cpo_optics"], "text_en": "@2147gp Yep I'm very excited for the $SIVE US listing. Majority of people can't access it on small Swedish exchanges.", "text_zh": "@2147gp 是的，我对 $SIVE 赴美上市非常兴奋。多数人没法在小瑞典交易所上交易它。", "media": []}, {"id": "2075611260771852590", "url": "https://x.com/aleabitoreddit/status/2075611260771852590", "created_at": "Fri Jul 10 16:01:02 +0000 2026", "created_at_cst": "2026-07-11 00:01", "is_reply": false, "metrics": {"likes": 1587, "retweets": 94, "replies": 230, "quotes": 14, "views": 777280, "bookmarks": 145}, "tickers": [{"symbol": "SKHYV", "sentiment": "看好"}, {"symbol": "000660.KS", "sentiment": "看好"}], "themes": ["memory"], "text_en": "Sk Hynix is now trading under $SKHYV!\n\nIt's now up an insane 16%.\n\nI wonder how Sk Hynix over in Korea is going to react on Monday. https://t.co/Mmqdu0poVY", "text_zh": "SK 海力士现在以 $SKHYV 交易了！\n已经暴涨离谱的 16%。\n好奇韩国本地的 SK 海力士周一会怎么反应。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HM4MNSFbYAES8t1.jpg", "width": 1432, "height": 1427}]}]}, "20260712": {"date": "20260712", "date_label": "2026年7月12日", "tweet_count": 9, "tweets": [{"id": "2076284746385240101", "url": "https://x.com/aleabitoreddit/status/2076284746385240101", "created_at": "Sun Jul 12 12:37:13 +0000 2026", "created_at_cst": "2026-07-12 20:37", "is_reply": true, "metrics": {"likes": 210, "retweets": 2, "replies": 19, "quotes": 1, "views": 34781, "bookmarks": 4}, "tickers": [{"symbol": "AMD", "sentiment": "一般"}], "themes": ["ai_compute"], "text_en": "@softmaxedx My friend at $AMD tripped on a rock and had to spend a few hours at home.\n\nSo we’ll likely see a major delay at AMD’s entire GPU program.", "text_zh": "@softmaxedx 我在 $AMD 的朋友被石头绊倒，在家躺了几小时。\n所以我们大概会看到 AMD 整个 GPU 项目重大延期。", "media": []}, {"id": "2076281362248769713", "url": "https://x.com/aleabitoreddit/status/2076281362248769713", "created_at": "Sun Jul 12 12:23:46 +0000 2026", "created_at_cst": "2026-07-12 20:23", "is_reply": false, "metrics": {"likes": 44, "retweets": 0, "replies": 5, "quotes": 0, "views": 17681, "bookmarks": 2}, "tickers": [{"symbol": "VPG", "sentiment": "一般"}], "themes": ["misc"], "text_en": "So this was cost of the final sale price, not BOM cost. They were also using $134K at ASP, not the volume ramped <$20k costs.\n\nAs seen with $VPG that $750/sensor goes down to $150 at mass production. \n\nSo lot of math changes, I didn’t find the cost structure particularly helpful here.", "text_zh": "所以那是最终售价成本，不是 BOM。他们还用了 13.4 万美元 ASP，而不是放量后 <2 万美元的成本。\n就像 $VPG，750 美元/传感器量产可到 150 美元。\n很多账会变，我觉得这份成本结构不太有用。", "media": []}, {"id": "2076266613675069628", "url": "https://x.com/aleabitoreddit/status/2076266613675069628", "created_at": "Sun Jul 12 11:25:10 +0000 2026", "created_at_cst": "2026-07-12 19:25", "is_reply": false, "metrics": {"likes": 1909, "retweets": 94, "replies": 235, "quotes": 24, "views": 990161, "bookmarks": 182}, "tickers": [{"symbol": "NVDA", "sentiment": "谨慎"}, {"symbol": "TSM", "sentiment": "谨慎"}], "themes": ["ai_compute", "macro_noise"], "text_en": "Apparently there’s a new popular trend to bearpost trillion dollar companies.\n\nLike $NVDA or $TSM.\n\nBy finding isolating technical details, then blowing it out of proportions by claiming their whole program is delayed.\n\n-> if the company doesn’t respond, stock prices/sentiment are damaged. \n\n-> if the company issues a response, they can’t go into detail since supply chains are confidential… but people still doubt them\n\n-> Poster gain more impressions, then does it again with more views the next time.\n\nDon’t quite think this is very healthy, with more folks copying that playbook. Especially around incentive structures.", "text_zh": "现在流行一种针对万亿市值公司发空帖的新趋势。\n比如 $NVDA 或 $TSM。\n\n做法是挑出孤立技术细节，再夸大成「整个项目延期」。\n→ 公司不回应：股价/情绪受损\n→ 公司回应：供应链机密又讲不细……人们仍怀疑\n→ 发帖人赚曝光，下次再用同样玩法\n\n我觉得这不太健康，尤其当更多人复制这套、且激励结构如此时。", "media": []}, {"id": "2076248337863639506", "url": "https://x.com/aleabitoreddit/status/2076248337863639506", "created_at": "Sun Jul 12 10:12:33 +0000 2026", "created_at_cst": "2026-07-12 18:12", "is_reply": false, "metrics": {"likes": 751, "retweets": 69, "replies": 113, "quotes": 8, "views": 331325, "bookmarks": 405}, "tickers": [{"symbol": "010690.KS", "sentiment": "中性偏好"}, {"symbol": "373220.KS", "sentiment": "中性偏好"}, {"symbol": "307950.KS", "sentiment": "中性偏好"}, {"symbol": "012330.KS", "sentiment": "看好"}, {"symbol": "005380.KS", "sentiment": "中性偏好"}, {"symbol": "TSLA", "sentiment": "中性偏好"}, {"symbol": "CCXI", "sentiment": "中性偏好"}, {"symbol": "XPEV", "sentiment": "一般"}, {"symbol": "005930.KS", "sentiment": "一般"}], "themes": ["humanoid", "memory"], "text_en": "So there's a IBK Research report on Boston Dynamics value chains from last month. \n\nJust a summary: \n\nIBK maps these companies to Atlas as suppliers:\n- Hwashin (010690) / body, arms, legs\n- LG Energy (373220) / battery \n- Hyundai Autoever (307950) / integration\n- Hyundai Mobis (012330) / actuators\n\nAs for humanoid volume ramps: \n\nThey're modeling for, 11.29K in 2028, 20k 2029, 30k in 2030... 40k in 2031, and 50k in 2032. \n\nNot quite sure why IBK and other institutions are a fan of linearly modeling S-curve volume ramps... \n\nLike adding +10K per year, don't quite think it's volume ramp is going to work like that... if I had to guess it would look more like: \n\n- 15-20k 2028\n- 40k-70k 2029\n- 90k-140k for 2030\n\nSince Boston Dynamics is projecting 30k capacity by 2028 (I'm sure they'd aim to get more online by 2029-2030), as China collectively is already doing 100k EOY in 2026.  \n\nIn terms of competitive landscape they name:\n\n- $TSLA, Figure, Apptronik, $CCXI (Agility), as US  players. Then Boston Dynamics (Korea parent owned now)\n- Unitree, Fourier, AGibot, UBtech, $XPEV as the Chinese leaders. \n- Neura, Pal Robotics, Wandercraft, Oversonic, as the EU leaders.  \n\nThey also did quite a lot of valuation modeling around Hyundai Mobis/Hyundai Autoever/Glovis. \n\nRegarding the BD economic ownership from 27.9% from Hyundai Motor, 11.3% from Mobis, and 11.3% from Glovis. So at least institution are valuing humanoid segments inside companies lot more now. \n\nThen from report assumptions:\n- 31 actuators per Atlas\n- $1K per actuator in 2028\n- $134K Atlas ASP,\n\nWhich implies actuator cost of final selling price is roughly 23–28%. \n\nProbably the more interesting statement was IBK stated that actuator capacity is biggest signal for volume ramp. eg. every 310,000 units of actuator capacity supports 10,000 more robots. \n\nSo tracking actuator outputs, yields, ASP is a cleaner read on 2028-2030 ramp.\n\nI didn't have much personal takeaways, but hopefully others find it interesting, maybe around Hwashin as a core supplier or around actuator capacity as an indicator.", "text_zh": "有一份 IBK Research 上月关于波士顿动力价值链的报告。\n\n摘要：\nIBK 把这些公司映射为 Atlas 供应商：\n- 和信 (010690) / 身体、手臂、腿\n- LG Energy (373220) / 电池\n- Hyundai Autoever (307950) / 集成\n- 现代摩比斯 (012330) / 执行器\n\n人形放量模型：2028 年 1.129 万，2029 年 2 万，2030 年 3 万……2031 年 4 万，2032 年 5 万。\n\n不太懂为什么 IBK 等机构爱用线性模型刻画 S 曲线放量……\n每年 +1 万，我不觉得放量会这样走。若让我猜更像：\n- 2028：1.5–2 万\n- 2029：4–7 万\n- 2030：9–14 万\n\n因为波士顿动力自称 2028 产能 3 万（肯定还想在 2029–2030 再上），而中国合计 2026 年底已冲 10 万。\n\n竞争格局他们点名：\n- 美国：$TSLA、Figure、Apptronik、$CCXI (Agility)；波士顿动力（现韩国母公司控股）\n- 中国：宇树、傅里叶、智元、优必选、$XPEV\n- 欧洲：Neura、Pal Robotics、Wandercraft、Oversonic\n\n还对现代摩比斯/Autoever/Glovis 做了不少估值建模。\nBD 经济权益：现代汽车 27.9%、摩比斯 11.3%、Glovis 11.3%——说明机构已更认真给公司内人形分部定价。\n\n报告假设：每台 Atlas 31 个执行器、2028 年单价 1000 美元、ASP 13.4 万美元 → 执行器约占最终售价 23–28%。\n\n更有意思的是：IBK 称执行器产能是放量最大信号——每 31 万个执行器产能支撑多 1 万台机器人。\n所以跟踪执行器产量、良率、ASP，比空谈放量更干净。\n\n我个人没太多新交易结论，但或许别人会对和信核心供应或执行器产能指标感兴趣。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNBI_zMaYAAUaCi.jpg", "width": 1709, "height": 1663}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNBJXpEacAA1zA3.jpg", "width": 1679, "height": 1117}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNBL79Ta0AAFlg3.jpg", "width": 1693, "height": 795}]}, {"id": "2076232450121118133", "url": "https://x.com/aleabitoreddit/status/2076232450121118133", "created_at": "Sun Jul 12 09:09:25 +0000 2026", "created_at_cst": "2026-07-12 17:09", "is_reply": true, "metrics": {"likes": 45, "retweets": 0, "replies": 3, "quotes": 0, "views": 16478, "bookmarks": 1}, "tickers": [], "themes": ["misc"], "text_en": "@BtMIV6TSQ572728 This is half satire. It's hard to understand nuances when Grok is translating it.", "text_zh": "@BtMIV6TSQ572728 这半是讽刺。Grok 一翻译，细微差别就很难体会了。", "media": []}, {"id": "2076035405338812805", "url": "https://x.com/aleabitoreddit/status/2076035405338812805", "created_at": "Sat Jul 11 20:06:26 +0000 2026", "created_at_cst": "2026-07-12 04:06", "is_reply": true, "metrics": {"likes": 103, "retweets": 1, "replies": 12, "quotes": 0, "views": 27467, "bookmarks": 14}, "tickers": [], "themes": ["misc"], "text_en": "@TheWaitingGameX I'm going to learn how to trade cash-settled Salmon futures next, so I can put it in my bio. https://t.co/oxJCHpb0Pd", "text_zh": "@TheWaitingGameX 接下来我要去学现金结算的三文鱼期货交易，好写进个人简介。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HM-PKJ7bUAAjT6H.jpg", "width": 2006, "height": 1267}]}, {"id": "2076032645172187292", "url": "https://x.com/aleabitoreddit/status/2076032645172187292", "created_at": "Sat Jul 11 19:55:28 +0000 2026", "created_at_cst": "2026-07-12 03:55", "is_reply": true, "metrics": {"likes": 102, "retweets": 0, "replies": 6, "quotes": 1, "views": 28657, "bookmarks": 9}, "tickers": [{"symbol": "278470.KS", "sentiment": "中性偏好"}], "themes": ["misc"], "text_en": "@ANMcapital APR might be priced in.\n\nBut maybe salmon DNA processing might be a new bottleneck from the amount women use for face lotion...", "text_zh": "@ANMcapital APR 或许已经定价了。\n\n但看女性在面霜上用掉的量，鲑鱼 DNA 加工说不定会变成新瓶颈……", "media": []}, {"id": "2076030743655109063", "url": "https://x.com/aleabitoreddit/status/2076030743655109063", "created_at": "Sat Jul 11 19:47:54 +0000 2026", "created_at_cst": "2026-07-12 03:47", "is_reply": false, "metrics": {"likes": 1959, "retweets": 130, "replies": 150, "quotes": 32, "views": 559686, "bookmarks": 761}, "tickers": [{"symbol": "278470.KS", "sentiment": "看好"}, {"symbol": "NVDA", "sentiment": "一般"}, {"symbol": "INTC", "sentiment": "一般"}], "themes": ["cpo_optics", "ai_compute", "memory"], "text_en": "Apparently, Korean Beauty was where all the alpha is.\n\nAPR (278470.KS) is up 529% over the past 2Y, wildly outperforming both $NVDA and $INTC.\n\nEvery female I know talks about their \"Medicube\" stick, then buying products... where you put a whole salmon's family tree on your face for better skin. \n\nThe world's female population creates a bigger structural demand than hyperscalers for memory or lasers? Should have known...", "text_zh": "原来韩国美妆才是 alpha 所在。\n\nAPR（278470.KS）过去两年涨了 529%，远超 $NVDA 和 $INTC。\n\n我认识的每个女生都在聊「Medicube」棒，然后买一堆……把整条鲑鱼家谱糊脸上护肤。\n\n全球女性人口创造的结构性需求，比超大规模客户对存储或激光的需求还大？早该知道……", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HM-HoOyagAA04I8.jpg", "width": 2158, "height": 1464}, {"type": "photo", "url": "https://pbs.twimg.com/media/HM-H80DbMAA3wdp.jpg", "width": 782, "height": 800}]}, {"id": "2075987162080928251", "url": "https://x.com/aleabitoreddit/status/2075987162080928251", "created_at": "Sat Jul 11 16:54:44 +0000 2026", "created_at_cst": "2026-07-12 00:54", "is_reply": true, "metrics": {"likes": 1725, "retweets": 4, "replies": 25, "quotes": 1, "views": 146547, "bookmarks": 17}, "tickers": [], "themes": ["misc"], "text_en": "@sama Wow, gpt-5.6 sol is getting really good at writing these comebacks", "text_zh": "@sama 哇，gpt-5.6 sol 写这些评论越来越拿手了。", "media": []}]}, "20260713": {"date": "20260713", "date_label": "2026年7月13日", "tweet_count": 2, "tweets": [{"id": "2076467953995071881", "url": "https://x.com/aleabitoreddit/status/2076467953995071881", "created_at": "Mon Jul 13 00:45:13 +0000 2026", "created_at_cst": "2026-07-13 08:45", "is_reply": false, "metrics": {"likes": 2023, "retweets": 168, "replies": 197, "quotes": 21, "views": 636814, "bookmarks": 924}, "tickers": [{"symbol": "GLW", "sentiment": "中性偏好"}, {"symbol": "8091.TW", "sentiment": "一般"}, {"symbol": "SPCX", "sentiment": "中性偏好"}, {"symbol": "2356.TW", "sentiment": "谨慎"}, {"symbol": "NVDA", "sentiment": "看好"}, {"symbol": "AAPL", "sentiment": "一般"}, {"symbol": "INTC", "sentiment": "中性偏好"}, {"symbol": "TSM", "sentiment": "看好"}, {"symbol": "042700.KS", "sentiment": "中性偏好"}, {"symbol": "005930.KS", "sentiment": "看好"}, {"symbol": "000660.KS", "sentiment": "看好"}, {"symbol": "SKHYV", "sentiment": "看好"}, {"symbol": "2408.TW", "sentiment": "看好"}, {"symbol": "CXMT", "sentiment": "中性偏好"}, {"symbol": "2449.TW", "sentiment": "中性偏好"}, {"symbol": "AMKR", "sentiment": "看好"}, {"symbol": "MU", "sentiment": "看好"}, {"symbol": "6488.TW", "sentiment": "中性偏好"}, {"symbol": "META", "sentiment": "中性偏好"}, {"symbol": "AVGO", "sentiment": "中性偏好"}, {"symbol": "3008.TW", "sentiment": "中性偏好"}, {"symbol": "TSLA", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute", "humanoid", "memory", "daily_sweep"], "text_en": "Just a semi recap TLDR:\n\n- $GLW glass bridge per Morgan Stanley has potential, but hard to displace FAU (like FOCI) in short term\n\n- $SPCX Starlink Gen 3 is scaling to 100,000 units (10x prev gen) creating possible capacity constraints for suppliers of switches to CCL.\n\n- PCB supply shortages are projected to persist until 2028, and component shortages/price hikes are already forcing ODMs like Inventec to issue  conservative H2 shipment\n\n- DeepSeek and Zhipu are developing custom ASICs to bypass $NVDA (kinda expected by now). \n\n- Anthropic has achieved a $30B ARR and is projected to hit >$1B in Q3 profit. Turns out these frontier labs are more profitable than people think. \n\n- US admin pressured $AAPL to source from $INTC, in exchange for tariff exception. Kinda pressuring alignment away from TSM.  \n\n- $TSM plans a 30x expansion of its Photonic Integrated Circuit (PIC)  capacity by 2028, growing from 500 to 25,000 wafers per month\n\n- Hanmi Semiconductor is entering the CoWoS packaging equipment market\n\n- $NVDA and NTT hosting a conference July 24th to discuss CPO strategies. \n\n- 5x general NAND flash price hike this year, market size $489B by next year triggered by RAG/inference. Samsung and SK Hynix make emergency fab investments, NAND equipment suppliers go brrrr.  \n\n- Gas turbine bottleneck, 40% supply gap accompanied by staggering 5-year delivery cycles (mega-fabs need them for mass production).\n\n- AI probe card assembly has hit a severe bottleneck apparently. Which is attempted to by solved with things like Innovation Service's machines. \n\n- Nanya, 79.5% gross margins reported, memory go brr. 4x capex for capacity/advanced packaging. \n\n- CXMT's STAR Market IPO on July 16, so should bring a lot of attention to memory players in that supply chain. \n\n- KYEC $1.4B investment into US for $TSM Arizona output test facilities. Lot of these players like $AMKR and others should go brr in 2028.\n\n- $INTC CEO warned last month that helium could hinder the manufacturing costs and delivery times of AI chips\n\n- 3D NAND word lines are shifting from Tungsten to Molybdenum starting at the 375-layer node\n\n- SambaNova secured JPM for AI inference and raised $1B at an $11B valuation.\n\n- HBM prices projections to double in 2027 as $NVDA Rubin platform drives demand.\n\n- $MU provides $500 million in funding to support GlobalWafers' US manufacturing capacity \n\n- $META 'Iris' will enter mass production in September  via $AVGO and TSMC and Meta aims to double computing power to 14GW by 2027.\n\n- Largan Precision has secured its first CPO FAU order, mass production slated for middle of next year (kinda indication around Foci and others). \n\n- Samsung and SK Hynix have delayed the implementation of hybrid bonding packaging technology for HBM4 apparently \n\n- Memory costs (DRAM/NAND) have reached 60% of the BOM for sub-$400 smartphones, causing a severe volume contraction.\n\n- SK Hynix successfully rasied $26.5 billion through a Nasdaq ADR\n\n- $TSLA issued procurement guidelines requiring suppliers to reach weekly production of 1,000 units by September and double to 2,000-2,500 by year end for its 3rd gen Optimus robot. Apparently Alliance Technology and A-Link may be in this supply chain harmonic reducers and vision lenses?\n\nKinda go through all this stuff every day, but don't wanna be a news reporter so just consolidated stuff I found interesting.", "text_zh": "半日情报 TLDR：\n\n- 大摩看 $GLW glass bridge 有潜力，但短期难取代 FAU（如 FOCI）\n- $SPCX Starlink Gen3 扩到 10 万台（上一代 10 倍），可能约束 CCL 交换机供应商产能\n- PCB 短缺预计持续到 2028；元器件涨价已迫使英业达等 ODM 对下半年出货偏保守\n- DeepSeek 与智谱在开发定制 ASIC 绕开 $NVDA（现在也算预期内）\n- Anthropic ARR 达 300 亿美元，预计 Q3 利润 >10 亿——前沿实验室比想象中更赚钱\n- 美政府施压 $AAPL 向 $INTC 采购以换关税豁免，某种程度把对齐从 TSM 拉开\n- $TSM 计划到 2028 把 PIC 产能扩 30 倍：月产能从 500 到 2.5 万片\n- 韩美半导体进入 CoWoS 封装设备市场\n- $NVDA 与 NTT 7 月 24 日办 CPO 策略会\n- 今年通用 NAND 五次涨价，明年市场规模 4890 亿（RAG/推理驱动）；三星与 SK 海力士紧急扩产，NAND 设备商起飞\n- 燃气轮机瓶颈：约 40% 供应缺口 + 长达 5 年交付周期（巨型 fab 量产需要）\n- AI 探针卡组装严重瓶颈；Innovation Service 等设备试图解决\n- 南亚科毛利率 79.5%，存储起飞；资本开支 4 倍扩产能/先进封装\n- 长鑫存储 7 月 16 日科创板 IPO，会把注意力拉到存储链\n- 京元电子投 14 亿美元到美国，承接 $TSM 亚利桑那测试；$AMKR 等 2028 可能受益\n- $INTC CEO 上月警告氦气可能拖累 AI 芯片成本与交付\n- 3D NAND 字线从 375 层节点起由钨转向钼\n- SambaNova 拿下摩根大通推理订单，11 亿估值融资 10 亿\n- HBM 价格预期 2027 翻倍（$NVDA Rubin 驱动）\n- $MU 出资 5 亿支持 GlobalWafers 美国产能\n- $META「Iris」9 月经 $AVGO 与台积电量产；Meta 目标 2027 算力翻倍到 14GW\n- 大立光拿下首笔 CPO FAU 订单，量产约明年中（对 FOCI 等有指向）\n- 三星与 SK 海力士似乎推迟 HBM4 混合键合\n- 亚 $400 手机 BOM 中存储已占 60%，严重压制出货\n- SK 海力士纳斯达克 ADR 成功募资 265 亿美元\n- $TSLA 要求供应商 9 月前周产 1000 台 Optimus 三代部件，年底翻到 2000–2500；谐波减速器/视觉镜头链或涉及 Alliance Technology、A-Link？\n\n这些我每天都在过，但不想当新闻搬运工，所以只汇总觉得有意思的。", "media": []}, {"id": "2076372905450188998", "url": "https://x.com/aleabitoreddit/status/2076372905450188998", "created_at": "Sun Jul 12 18:27:32 +0000 2026", "created_at_cst": "2026-07-13 02:27", "is_reply": false, "metrics": {"likes": 1470, "retweets": 48, "replies": 210, "quotes": 12, "views": 421868, "bookmarks": 37}, "tickers": [], "themes": ["memory", "macro_noise"], "text_en": "Looks like the Strait of Hormuz is open for the 50th time this year per Trump.\n\nI’m getting tired looking at macro. https://t.co/GuYgkwC2Q8", "text_zh": "看来按特朗普的说法，霍尔木兹海峡今年已经第 50 次「开放」了。\n我看宏观看累了。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNDCJuBboAAkhQ5.jpg", "width": 1201, "height": 583}]}]}, "20260714": {"date": "20260714", "date_label": "2026年7月14日", "tweet_count": 10, "tweets": [{"id": "2077044786402660829", "url": "https://x.com/aleabitoreddit/status/2077044786402660829", "created_at": "Tue Jul 14 14:57:21 +0000 2026", "created_at_cst": "2026-07-14 22:57", "is_reply": false, "metrics": {"likes": 1492, "retweets": 97, "replies": 218, "quotes": 13, "views": 433825, "bookmarks": 177}, "tickers": [{"symbol": "NBIS", "sentiment": "中性偏好"}, {"symbol": "SPCX", "sentiment": "中性偏好"}, {"symbol": "META", "sentiment": "一般"}, {"symbol": "MSFT", "sentiment": "一般"}], "themes": ["memory", "openai_ecosystem"], "text_en": "$NBIS signs $1B+ compute agreement with Reflection AI, for GB300 access through 2029.\n\nReflection also signed a multi-billion dollar agreement with $SPCX earlier. \n\nInteresting to say the least, seeing Nebius drop -5% off the news today. \n\nAlso... counterparty to get this done kinda reminds me of OpenAI, where they might not have the funds to actually execute on these LTAs yet compared to $META or $MSFT. \n\nBut generally positive long term developments, customer diversification was one of the core strengths of Nebius.", "text_zh": "$NBIS 与 Reflection AI 签署 10 亿美元+ 算力协议，通过 2029 年提供 GB300 接入。\nReflection 此前也与 $SPCX 签过多十亿美元协议。\n\n有意思的是，消息出来 Nebius 今天反而跌约 5%。\n对手方完成这笔交易的方式，有点让人想到 OpenAI：相对 $META 或 $MSFT，它们未必已有足够资金真正执行这些 LTA。\n\n但长期仍偏正面，客户多元化一直是 Nebius 的核心优势之一。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNMlOQubcAApEhI.jpg", "width": 1200, "height": 503}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNMlOP2awAA6Tq7.jpg", "width": 1037, "height": 1200}]}, {"id": "2077044267151925411", "url": "https://x.com/aleabitoreddit/status/2077044267151925411", "created_at": "Tue Jul 14 14:55:17 +0000 2026", "created_at_cst": "2026-07-14 22:55", "is_reply": false, "metrics": {"likes": 247, "retweets": 12, "replies": 11, "quotes": 6, "views": 36762, "bookmarks": 26}, "tickers": [{"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "中性偏好"}, {"symbol": "COHR", "sentiment": "中性偏好"}], "themes": ["cpo_optics"], "text_en": "Feels like algos often miss $SIVE, after slight $LITE / optical sector recovery after CPI print. Especially bc it's trading on some random Swedish exchange, but catches up on random days. \n\nThat being said it's definitely on institutional radar, especially since MS put it next to $LITE and $COHR as the three leading CPO laser companies yesterday. \n\nJust waiting for things to play out, stocks don't move in a straight line up every day.", "text_zh": "感觉算法经常漏掉 $SIVE：在 CPI 后 $LITE / 光学板块略有修复时它常跟不上，尤其因为它在某个瑞典小交易所交易，但会在随机某天补涨。\n\n话虽如此，它肯定已在机构雷达上——尤其昨天大摩已把它与 $LITE、$COHR 并列三大 CPO 激光龙头。\n\n就等事情演绎；股票不会每天直线上涨。", "media": []}, {"id": "2077040840837632253", "url": "https://x.com/aleabitoreddit/status/2077040840837632253", "created_at": "Tue Jul 14 14:41:40 +0000 2026", "created_at_cst": "2026-07-14 22:41", "is_reply": true, "metrics": {"likes": 71, "retweets": 1, "replies": 12, "quotes": 0, "views": 24714, "bookmarks": 1}, "tickers": [{"symbol": "IBM", "sentiment": "谨慎"}], "themes": ["misc"], "text_en": "@cragents Don't really have any strong opinion on $IBM since don't know enough about all their revenue streams. \n\nWas surprising to say the least seeing it drop 24.3% in a day tho after ER.", "text_zh": "@cragents 对 $IBM 没有很强观点，因为不太了解其全部收入结构。\n不过财报后单日跌 24.3% 还是挺让人吃惊的。", "media": []}, {"id": "2077039373711970804", "url": "https://x.com/aleabitoreddit/status/2077039373711970804", "created_at": "Tue Jul 14 14:35:50 +0000 2026", "created_at_cst": "2026-07-14 22:35", "is_reply": false, "metrics": {"likes": 1233, "retweets": 91, "replies": 200, "quotes": 7, "views": 314154, "bookmarks": 190}, "tickers": [{"symbol": "TSEM", "sentiment": "看好"}, {"symbol": "AAOI", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute"], "text_en": "Two different capacity expansion announcements today across $TSEM and $AAOI.\n\nTower Semi, supported by the Japanese government, announced expansion of its 300mm Silicon Photonics (SiPho), Silicon Germanium (SiGe), and advanced packaging capabilities. \n\nTargeting $1.2B net profit, and $3.6B revenue in 2028 (with a ~$28B MC, that's ~23.3 2028 forward p/e).\n\nAAOI announced the commencement of its buildout, roughly 400,000 square feet of manufacturing to make 800g/1.6T production go brrr. \n\nThe overall expansion is also supported by the local city government in Texas. (they also $20.85M worth of subsidies from the State earlier).\n\nThis one isn't exactly as materially new as Tower, since AAOI originally announced these plans before. Just commencement of it. \n\nRegardless, glad to see both of these companies in their Anime training arc phase as they power up.", "text_zh": "今天两条扩产公告，分别来自 $TSEM 与 $AAOI。\n\nTower Semi 在日本政府支持下宣布扩张 300mm 硅光（SiPho）、硅锗（SiGe）与先进封装能力。\n目标 2028 年净利润 12 亿美元、营收 36 亿美元（约 280 亿市值对应约 23.3 倍 2028 远期 P/E）。\n\nAAOI 宣布开始建设约 40 万平方英尺制造空间，推动 800G/1.6T 量产。\n扩建也获得得克萨斯当地市政府支持（此前还拿过州政府约 2085 万美元补贴）。\n这不如 Tower 那么「全新」——AAOI 原先就宣布过计划，这次是开工落地。\n\n不管怎样，很高兴看到这两家都在「二次元修炼」式加电阶段。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNMfVUWaQAIwZkT.jpg", "width": 2080, "height": 1326}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNMfZLEa4AA5VW8.jpg", "width": 1716, "height": 1440}]}, {"id": "2076847779037790620", "url": "https://x.com/aleabitoreddit/status/2076847779037790620", "created_at": "Tue Jul 14 01:54:31 +0000 2026", "created_at_cst": "2026-07-14 09:54", "is_reply": true, "metrics": {"likes": 114, "retweets": 0, "replies": 8, "quotes": 0, "views": 24738, "bookmarks": 1}, "tickers": [], "themes": ["macro_noise"], "text_en": "@macromonster69 Original article is in a different language, used AI to translate it to English for the usual audience", "text_zh": "@macromonster69 原文是其他语言，我用了 AI 翻译成英文，方便常规读者阅读。", "media": []}, {"id": "2076846994614792663", "url": "https://x.com/aleabitoreddit/status/2076846994614792663", "created_at": "Tue Jul 14 01:51:24 +0000 2026", "created_at_cst": "2026-07-14 09:51", "is_reply": false, "metrics": {"likes": 1593, "retweets": 125, "replies": 114, "quotes": 27, "views": 671510, "bookmarks": 283}, "tickers": [{"symbol": "NVDA", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute"], "text_en": "So Jensen himself went out to do damage control with $NVDA delays reports apparently:\n\n1. Jensen Huang said no delays: \n\n- 800V and rack-to-rack optical interconnects is progressing fully in line with the original plan with no material delay. \n\n- Debunked the rumor that the next-generation flagship, Rubin Ultra, would be delayed until 2028 and said it would be on track to ship next year\n\n- Rack system optimizations, like replacing Kyber with a new design are architectural optimizations, not impacting delivery timelines.\n\n2. On ASIC competition: no loss of market share.\n\n- Talked about how a leading frontier lab that previously relied heavily on internal ASICs has shifted nearly 50% of its compute load to Nvidia\n\n3. On over-reliance on hyperscalers.\n\n- AI frontier labs currently contributing to ~20% of demand.\n- Traditional cloud providers, Nvidia provides Vera CPUs and high-speed networking\n- Sovereign AI", "text_zh": "看来黄仁勋亲自出来给 $NVDA「延期报道」做危机公关：\n\n1. 黄仁勋称没有延期：\n- 800V 与机柜间光互连按原计划推进，无实质延期\n- 驳斥 Rubin Ultra 拖到 2028 的传闻，称明年按计划出货\n- 用新设计替换 Kyber 等属于架构优化，不影响交付\n\n2. ASIC 竞争：未丢份额\n- 某此前重度依赖内部 ASIC 的前沿实验室，已将近 50% 算力负荷转到英伟达\n\n3. 对超大规模过度依赖：\n- AI 前沿实验室目前约占需求 ~20%\n- 传统云：英伟达提供 Vera CPU 与高速网络\n- 主权 AI", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNJwpofaoAAfYqR.png", "width": 2098, "height": 2050}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNJxDQcbsAAQscO.jpg", "width": 1122, "height": 1402}]}, {"id": "2076808331453415674", "url": "https://x.com/aleabitoreddit/status/2076808331453415674", "created_at": "Mon Jul 13 23:17:46 +0000 2026", "created_at_cst": "2026-07-14 07:17", "is_reply": false, "metrics": {"likes": 921, "retweets": 41, "replies": 119, "quotes": 16, "views": 362867, "bookmarks": 225}, "tickers": [{"symbol": "300308.SZ", "sentiment": "看好"}, {"symbol": "AAOI", "sentiment": "看好"}, {"symbol": "COHR", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "JBL", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute", "daily_sweep"], "text_en": "TLDR of Innolight investor relations takeaways:\n\n1. \"Overall, 1.6T market demand has not contracted; instead, 800G demand has increased significantly compared with previous expectations\"\n\nProb most important takeaway as a whole was 800G demand revision (also longer tail demand). Which is a bullish read through on US transceiver makers like $AAOI, $COHR, $LITE. \n\nLot of new customers like neoclouds, AI model companies, contributing to overall demand rather than just hyperscalers, diversification always a bonus. \n\n2. Innolight said the shortage covers the module supply chain broadly including:\n\n- Optical chips.\n- Electrical chips.\n- PCBs.\n- Other module materials\n\nFrom last ER, I think they singled out EMLs and CW optical chips as the most constrained. So Innolight's bottleneck list mention broadened since then. \n\nThey expect some of the component availability to improve gradually from the second half of 2026 through the first half of 2027. \n\nThink a lot of this is already known from earlier though. \n\nBut just some confirmation + easing timelines (EML is extremely bottlenecked, same with CW, this is probably talking about other components). \n\n3.  Innolight said module-production equipment is not the constraint. Equipment lead times remain relatively short. \n\nSo this isn't really a bottleneck compared to others. \n\n4. The overall proportion of silicon photonics continues to trend upward. Last year it was mainly 800G. This year, some 800G customers are further increasing their silicon-photonics proportion. 1.6T also added some new customers\n\nPositive for SiPH penetration eg. $SIVE / $JBL, since this shifts away from EML toward CW. \n\nBasically: main surprising takeaway is just 800g demand go brrr. \n\nApart from that just reaffirming bottlenecks/timelines/market speculation.", "text_zh": "中际旭创 IR 要点 TLDR：\n\n1.「总体而言 1.6T 需求未收缩；相反 800G 需求较此前预期显著增加」\n这可能是最重要收获——800G 上修（以及更长需求尾部）。对美股光模块 $AAOI、$COHR、$LITE 偏多。\n新客户（neocloud、AI 模型公司）也在贡献需求，不只超大规模，多元化是加分。\n\n2. 短缺覆盖模块供应链：光芯片、电芯片、PCB、其他材料。\n上次财报更强调 EML 与 CW 光芯片最紧；这次瓶颈清单更宽。\n预计部分组件供应 2026H2–2027H1 逐步改善。\n很多此前已知，但确认了缓解时间表（EML/CW 仍极紧，这里多半指其他部件）。\n\n3. 模块生产设备不是瓶颈，交期仍相对短。\n\n4. 硅光占比持续上升。去年主在 800G；今年部分 800G 客户继续提高硅光比例，1.6T 也有新客户。\n利好硅光渗透如 $SIVE / $JBL（从 EML 转向 CW）。\n\n一句话：意外主要是 800G 需求太猛；其余多是重申瓶颈/时间表/市场猜测。", "media": []}, {"id": "2076767097674514474", "url": "https://x.com/aleabitoreddit/status/2076767097674514474", "created_at": "Mon Jul 13 20:33:55 +0000 2026", "created_at_cst": "2026-07-14 04:33", "is_reply": true, "metrics": {"likes": 196, "retweets": 1, "replies": 10, "quotes": 1, "views": 30133, "bookmarks": 8}, "tickers": [{"symbol": "INTC", "sentiment": "一般"}], "themes": ["misc"], "text_en": "@bottleneckceo 10 years from now, the flying spaghetti monster will descend from the heavens and bless every $INTC holder with a meatball.\n\nCan someone prove me wrong?", "text_zh": "@bottleneckceo 十年后，飞行面条怪会从天而降，给每位 $INTC 持有者赐一颗肉丸。\n有人能证明我错吗？", "media": []}, {"id": "2076763334930812936", "url": "https://x.com/aleabitoreddit/status/2076763334930812936", "created_at": "Mon Jul 13 20:18:58 +0000 2026", "created_at_cst": "2026-07-14 04:18", "is_reply": false, "metrics": {"likes": 172, "retweets": 9, "replies": 17, "quotes": 2, "views": 37089, "bookmarks": 43}, "tickers": [{"symbol": "AAOI", "sentiment": "一般"}, {"symbol": "MTSI", "sentiment": "谨慎"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "COHR", "sentiment": "看好"}], "themes": ["cpo_optics"], "text_en": "$AAOI mainly gets revenue from pluggable, they’re developing/sampling related lasers but have no CPO design wins.\n\nOthers like $MTSI look like they fell off the map for some reason with cpo lasers.\n\nCEO says “TBD” with commercial timing and it’s in reliability work right now. And fits the OSINT research done with Ayar removing Macom from their website.\n\nSo would agree with MS that $SIVE, $LITE, $COHR imo are the three leaders to focus on for lasers.", "text_zh": "$AAOI 收入主要来自可插拔；相关激光在开发/送样，但没有 CPO design win。\n$MTSI 这类在 CPO 激光上不知为何像掉出地图。\nCEO 说商业化时间「TBD」，目前在可靠性验证——也符合 Ayar 官网上移除 Macom 的 OSINT。\n\n所以同意大摩：激光我会重点看 $SIVE、$LITE、$COHR 三家。", "media": []}, {"id": "2076748688559587338", "url": "https://x.com/aleabitoreddit/status/2076748688559587338", "created_at": "Mon Jul 13 19:20:46 +0000 2026", "created_at_cst": "2026-07-14 03:20", "is_reply": false, "metrics": {"likes": 2109, "retweets": 177, "replies": 303, "quotes": 23, "views": 482539, "bookmarks": 595}, "tickers": [{"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "COHR", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "AVGO", "sentiment": "中性偏好"}, {"symbol": "NVDA", "sentiment": "中性偏好"}, {"symbol": "MRVL", "sentiment": "中性偏好"}, {"symbol": "POET", "sentiment": "中性偏好"}, {"symbol": "TSM", "sentiment": "中性偏好"}, {"symbol": "GFS", "sentiment": "中性偏好"}, {"symbol": "TSEM", "sentiment": "中性偏好"}], "themes": ["cpo_optics"], "text_en": "Morgan Stanley note on CPO today. Key participants include:\n\n- $SIVE, $COHR, and $LITE in laser supply\n- Broadcom and Nvidia in switch platforms\n- Lightmatter, Ayar Labs, Marvell/Celestial, and POET in optical engines and photonics, \n- $TSM, $GFS, and $TSEM in silicon photonics foundry capacity\n\nI’ve covered all of these before, like Tower Semi. \n\nBut I’m especially happy that Morgan Stanley validated my research that $SIVE is one of the critical global players in CPO.\n\nA small $1.5B laser company next to your two leading $60B+ companies…\n\nIf you also synthesize Rosenblatt Securities recent note that China laser suppliers were quite far from having CPO lasers.\n\nThis kinda magnifies importance of the three Western leaders of that laser chokepoint.", "text_zh": "大摩今日 CPO 纪要。关键参与方包括：\n\n- 激光供应：$SIVE、$COHR、$LITE\n- 交换机平台：博通、英伟达\n- 光引擎/光子：Lightmatter、Ayar Labs、Marvell/Celestial、POET\n- 硅光代工：$TSM、$GFS、$TSEM\n\n这些我以前都覆盖过，比如 Tower Semi。\n尤其高兴大摩验证了我的研究：$SIVE 是全球 CPO 关键玩家之一。\n\n一家约 15 亿美元的小激光公司，跟两家 600 亿+ 龙头并列……\n\n再叠 Rosenblatt「中国激光供应商距 CPO 激光还很远」的观点，\n更放大了这三家西方激光瓶颈龙头的重要性。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNIX67ba0AAXstD.jpg", "width": 1260, "height": 285}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNIX67abgAAk2Qp.jpg", "width": 1205, "height": 188}]}]}, "20260715": {"date": "20260715", "date_label": "2026年7月15日", "tweet_count": 6, "tweets": [{"id": "2077421268991926703", "url": "https://x.com/aleabitoreddit/status/2077421268991926703", "created_at": "Wed Jul 15 15:53:21 +0000 2026", "created_at_cst": "2026-07-15 23:53", "is_reply": false, "metrics": {"likes": 910, "retweets": 66, "replies": 186, "quotes": 11, "views": 262066, "bookmarks": 110}, "tickers": [{"symbol": "AAPL", "sentiment": "看好"}, {"symbol": "MSFT", "sentiment": "一般"}, {"symbol": "META", "sentiment": "一般"}, {"symbol": "AMZN", "sentiment": "一般"}, {"symbol": "GOOGL", "sentiment": "一般"}, {"symbol": "TSM", "sentiment": "中性偏好"}, {"symbol": "LITE", "sentiment": "中性偏好"}, {"symbol": "COHR", "sentiment": "中性偏好"}, {"symbol": "SIVE.ST", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "openai_ecosystem"], "text_en": "$AAPL looks to acquire AI chip companies for running AI (Source: The Information)\n\nRight now, $MSFT, $META, Amazon, Google are carrying AI capex spend.\n\nBut what if Apple joined the others after M&A? \n\nA possible scenario is that they revise capex largely upward for their own AI buildout. \n\nSince they probably witnessed Google cutting off Meta from compute constraints... or what happens when you partner with OpenAI for LLMs. \n\nThen learned how important it is to have your own infrastructure. \n\nThis scenario would be quite bullish thematically from optical networking to foundries and something markets would not expect? We'll see what happens.", "text_zh": "据 The Information：$AAPL 考虑收购 AI 芯片公司，以支撑自有 AI 运行。\n\n眼下 AI 资本开支主要由 $MSFT、$META、亚马逊、谷歌扛着。\n\n但如果苹果并购后加入呢？\n\n一种可能情景是：它们大幅上修资本开支，用于自建 AI 基础设施——\n毕竟可能已看到谷歌因算力约束切断 Meta，或依赖 OpenAI 做大模型时的被动。\n\n于是意识到自有基础设施有多重要。\n\n这情景对光网络到晶圆代工整条主题都会偏多，也是市场未必充分预期的变量？走着瞧。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNR3jK2aoAAeIHk.jpg", "width": 2174, "height": 1253}]}, {"id": "2077406548012466390", "url": "https://x.com/aleabitoreddit/status/2077406548012466390", "created_at": "Wed Jul 15 14:54:52 +0000 2026", "created_at_cst": "2026-07-15 22:54", "is_reply": false, "metrics": {"likes": 1293, "retweets": 92, "replies": 227, "quotes": 14, "views": 302634, "bookmarks": 127}, "tickers": [{"symbol": "NVDA", "sentiment": "看好"}], "themes": ["ai_compute", "memory"], "text_en": "$NVDA CEO, Jensen Huang in Tokyo today said:\n\n\"The reports are not true. Vera Rubin is already in production. Giant amounts of production incoming\"\n\nAs a flat denial to the accusation that their AI servers would be delayed. \n\nJensen appears to be using the Umbrella term for Rubin Ultra/Kyber, then pointed to current gen ramp. \n\nRegardless, lot of damage has been done already to Nvidia supply chains stock prices, after the multiple delay reports. Even if Nvidia refuted them by clarifying Kyber change was an architecture optimization, not impacting timelines.\n\nIt's a very dangerous and growing trend for folks to post  overreaching broader claims from technical nuances to grow viewcount... Especially if they get Jensen has to respond.\n\nIn the end, I'm trusting $NVDA on timelines since they probably have the greatest visibility into their own supply chain.", "text_zh": "$NVDA CEO 黄仁勋今天在东京说：\n\n「报道不属实。Vera Rubin 已经在生产。大量产能正在到来。」\n\n这是对「AI 服务器将延期」指控的直接否认。\n\n黄似乎用 Rubin Ultra/Kyber 的统称口径，同时指向当前世代正在放量。\n\n无论如何，多轮延期报道后，英伟达供应链相关股价已受明显伤害——即便英伟达此前已澄清 Kyber 变更是架构优化、不影响时间表。\n\n这种把技术细节夸大成全局延期、靠流量带节奏的做法，正在变得危险——尤其当黄仁勋都不得不下场回应。\n\n最终我更信任 $NVDA 自己的时间表：他们对自身供应链可见度通常最高。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNRpBZKbAAA1kKO.jpg", "width": 2011, "height": 1219}]}, {"id": "2077228758491386121", "url": "https://x.com/aleabitoreddit/status/2077228758491386121", "created_at": "Wed Jul 15 03:08:23 +0000 2026", "created_at_cst": "2026-07-15 11:08", "is_reply": false, "metrics": {"likes": 1003, "retweets": 74, "replies": 120, "quotes": 8, "views": 346272, "bookmarks": 339}, "tickers": [{"symbol": "MU", "sentiment": "一般"}, {"symbol": "Kioxia", "sentiment": "一般"}, {"symbol": "2344.TW", "sentiment": "看好"}, {"symbol": "2337.TW", "sentiment": "看好"}, {"symbol": "688766.SH", "sentiment": "看好"}], "themes": ["memory", "macro_noise"], "text_en": "Well, looks like SLC NAND is forcasted to rise up 120-170% for H2 2026 per Trendforce. \n\nThere's $MU (21%), Kioxia (20%) as largest share, but clearer beneficiaries appears to be:\n\n1. Winbond (2344): ~15% of the SLC NAND market\n2. Macronix (2337): ~11% market share\n3. SkyHigh Memory via Puya Semi: ~14% market share\n\nGiven Micron at $1T and others are a bit large relative to SLC NAND TAM. \n\n(source: Q1 2026 Winbond presentation/Trendforce).", "text_zh": "Trendforce 预测 2026 下半年 SLC NAND 涨价约 120–170%。\n\n份额上 $MU（约 21%）、铠侠 Kioxia（约 20%）最大，但更清晰的受益者似乎是：\n\n1. 华邦电 Winbond（2344）：SLC NAND 市占约 15%\n2. 旺宏 Macronix（2337）：市占约 11%\n3. SkyHigh Memory（经普冉 Puya Semi）：市占约 14%\n\n鉴于美光已到万亿市值，其它巨头相对 SLC NAND 的 TAM 也偏大。\n\n（来源：华邦 2026Q1 简报 / Trendforce）", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNPLfNva4AAstTR.jpg", "width": 2802, "height": 1583}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNPMGNHaMAAoVzH.jpg", "width": 1080, "height": 560}]}, {"id": "2077217140042760358", "url": "https://x.com/aleabitoreddit/status/2077217140042760358", "created_at": "Wed Jul 15 02:22:13 +0000 2026", "created_at_cst": "2026-07-15 10:22", "is_reply": false, "metrics": {"likes": 63, "retweets": 0, "replies": 3, "quotes": 0, "views": 12880, "bookmarks": 5}, "tickers": [{"symbol": "AEHR", "sentiment": "中性偏好"}, {"symbol": "NVDA", "sentiment": "一般"}, {"symbol": "MSScorps", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute"], "text_en": "It's nuanced, $AEHR implications was more toward broader silicon photonics related ramp. \n\nWhich could include 800g/1.6T pluggables, or CPO. \n\nIf they directly named CPO, Msscorps would be a very clean readthrough. It just got hit really hard recently from that delay claim (even after $NVDA refuted it), since it's it's upside seems tied to CPO yields in specific. \n\nSo it's positive, just uncertain.", "text_zh": "这里有细微差别：$AEHR 的含义更偏向更广泛的硅光相关放量，\n可能包括 800G/1.6T 可插拔，也可能包括 CPO。\n\n如果他们直接点名 CPO，那 MSScorps 会是很干净的读穿标的——它最近因延期说法被砸得很惨（即便 $NVDA 已辟谣），因为它的上行似乎更绑定特定 CPO 良率。\n\n所以整体偏正，但还不确定。", "media": []}, {"id": "2077212864948162871", "url": "https://x.com/aleabitoreddit/status/2077212864948162871", "created_at": "Wed Jul 15 02:05:14 +0000 2026", "created_at_cst": "2026-07-15 10:05", "is_reply": true, "metrics": {"likes": 138, "retweets": 0, "replies": 46, "quotes": 0, "views": 16572, "bookmarks": 8}, "tickers": [{"symbol": "AEHR", "sentiment": "一般"}], "themes": ["misc"], "text_en": "@RiversSmith3 Bro I just came out from surgery, unfortunately I'm not able to listen to $AEHR earnings call while bleeding out thx.", "text_zh": "@RiversSmith3 兄弟我刚做完手术出来，不幸的是我没法一边流血一边听 $AEHR 财报电话会，谢了。", "media": []}, {"id": "2077208587005542464", "url": "https://x.com/aleabitoreddit/status/2077208587005542464", "created_at": "Wed Jul 15 01:48:14 +0000 2026", "created_at_cst": "2026-07-15 09:48", "is_reply": false, "metrics": {"likes": 1194, "retweets": 66, "replies": 149, "quotes": 11, "views": 478374, "bookmarks": 245}, "tickers": [{"symbol": "AEHR", "sentiment": "看好"}, {"symbol": "SNDK", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute", "memory"], "text_en": "$AEHR back up +36.4% today off earnings!\n\n2027 guide: $130-$150m (160-200% growth) from 2026 revenue.  Sees opportunity to guide higher (assumes no memory revenue or little to none from newly benchmarked AI customer).\n\nQ4 bookings: $60.7M, effective backlog is $100.6M.\n\n- Lead AI processor wafer-level burn-in customer is significantly ramping their products. \n\n- Engaged with additional AI processor customers who are evaluating wafer-level burn-in. \n\n- Benchmark customer, which was a “major supplier of AI accelerators, CPUs and network processors” “exceeded their expectations. \n\nFrom management: The potential revenue opportunity from one of these devices is \"significant to Aehr\". So another benchmark win for potential HVM in the future.\n\n- Wafer level burn-in benchmark with a \"global leader in NAND flash completed\". Now evaluating a development agreement for HBM/NAND\n\nSeems like $SNDK since there was HBF related discussions from last quarter I think.\n\n- \"Our package level burn-in business for AI processors also gained  momentum over the year … from our lead hyperscale customer for Sonoma systems\"\n\n- Silicon photonics customer already ramping, newer networking customers     has forecast additional systems  \n\nBasically the amount of global semi companies that map to $AEHR is pretty ridiculous across silicon photonics, memory, AI processors, and others. \n\nI don’t quite think that $130-$150m guidance is representative of actualized revenue for 2027 if these hyperscalers/semi companies convert to HVM. \n\nTypically with these types of qualification into HVM players, markets don’t really judge it by current quarter, but what’s to come.  \n\nAnd it looks very positive so far in terms of reactions...\n\n$116 -> $60 -> $94 all in the span of a month is pretty insane volatility tho, so good to know what you're holding.", "text_zh": "$AEHR 财报后今日大涨 +36.4%！\n\n2027 指引：1.3–1.5 亿美元（相对 2026 营收增 160–200%）。管理层看到上修空间（假设几乎不含新对标的 AI 客户的存储收入）。\n\nQ4 订单：6070 万美元；有效 backlog 1.006 亿美元。\n\n- 领先的 AI 处理器晶圆级 burn-in 客户正显著放量其产品。\n- 正与更多评估晶圆级 burn-in 的 AI 处理器客户接触。\n- 对标客户（「AI 加速器、CPU 与网络处理器的主要供应商」）「超出预期」。\n管理层称其中一款器件的潜在收入机会「对 Aehr 意义重大」——未来 HVM 的又一次对标胜利。\n\n- 与「全球 NAND flash 领导者」完成晶圆级 burn-in 对标；正评估 HBM/NAND 开发协议。\n看起来像 $SNDK（上季度有过 HBF 相关讨论）。\n\n- 「AI 处理器封装级 burn-in 业务全年也获得动能……来自领先超大规模客户的 Sonoma 系统」\n- 硅光客户已在放量，较新的网络客户还预测追加系统\n\n基本上，能映射到 $AEHR 的全球半导体公司跨硅光、存储、AI 处理器等，数量多到离谱。\n我不太认为 1.3–1.5 亿指引能代表这些超大规模/半导体重客若转为 HVM 后的 2027 真实收入。\n这类导入 HVM 的故事，市场通常不看当季，而看未来——目前反应相当正面。\n\n不过 $116→$60→$94 一个月内波动很疯狂，得清楚自己拿的是什么。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNO6MxwacAAy0Tv.jpg", "width": 1062, "height": 1052}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNO6MxtbsAAe_-Y.jpg", "width": 1260, "height": 909}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNO6MyIa0AAdVmc.jpg", "width": 1228, "height": 982}]}]}, "20260716": {"date": "20260716", "date_label": "2026年7月16日", "tweet_count": 5, "tweets": [{"id": "2077784594959725056", "url": "https://x.com/aleabitoreddit/status/2077784594959725056", "created_at": "Thu Jul 16 15:57:05 +0000 2026", "created_at_cst": "2026-07-16 23:57", "is_reply": false, "metrics": {"likes": 3553, "retweets": 177, "replies": 341, "quotes": 34, "views": 622934, "bookmarks": 631}, "tickers": [{"symbol": "INTC", "sentiment": "中性偏好"}, {"symbol": "LITE", "sentiment": "中性偏好"}, {"symbol": "RDDT", "sentiment": "一般"}], "themes": ["cpo_optics"], "text_en": "My guess is we’re close to market bottom on semis from $INTC to $LITE.\n\nA good indicator is if everyone on $RDDT blew up their portfolios to $0. https://t.co/X1m9Yv1JuX", "text_zh": "我猜半导体板块从 $INTC 到 $LITE 已接近市场底部。\n\n一个不错的指标是：如果 $RDDT 上大家都把自己的组合亏到归零了。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNXGEp8bkAAcdBb.jpg", "width": 1156, "height": 1535}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNXGEp6bQAAeRWq.jpg", "width": 1107, "height": 1596}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNXGEqAbQAAfu12.jpg", "width": 1171, "height": 1633}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNXGEqBbAAAqeQZ.jpg", "width": 1190, "height": 1668}]}, {"id": "2077768896061563339", "url": "https://x.com/aleabitoreddit/status/2077768896061563339", "created_at": "Thu Jul 16 14:54:42 +0000 2026", "created_at_cst": "2026-07-16 22:54", "is_reply": false, "metrics": {"likes": 1111, "retweets": 81, "replies": 206, "quotes": 13, "views": 463269, "bookmarks": 286}, "tickers": [{"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "3105.TW", "sentiment": "中性偏好"}, {"symbol": "LITE", "sentiment": "中性偏好"}, {"symbol": "COHR", "sentiment": "中性偏好"}, {"symbol": "AMD", "sentiment": "中性偏好"}, {"symbol": "GFS", "sentiment": "中性偏好"}, {"symbol": "JBL", "sentiment": "中性偏好"}, {"symbol": "POET", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "daily_sweep"], "text_en": "Lot of people were curious about $SIVE capacity volume ramp modeling through fab-light (Win Semi + others):\n\nUsing 10% of Win's wafer capacity as a low-end allocation (65% yield assumption, $50-$75 ASP):\n\nSivers would support $341-$512M worth of annual array revenue. Given upper end of managements 50-60%+ gross margin target, would be roughly:\n\n$205–307M of annual gross profit.\n\nAgainst Sivers current ~$1.1B MC, would be ~:\n\n3.6–5.4× MC/gross profit if this capacity scenario plays out in 2028.  \n\nAnd at 15% would be $307–461M in gross profit (2.4–3.6× MC/gross profit)\n\nSivers CEO also replied that they're working with more fabs for capacity. And from an older deck, there looks to be more qualifications since 2024.  \n\nSo capacity targets might be larger than what's stated here as CPO takes off. \n\nI also expect to see revenue pipeline projections hiked in future quarters, as more qualification suppliers to into HVM. \n_\n\nAs for demand side, CW also happens to be very bottlenecked. \n\nLumentum are buying CW off the open market due to EML obligations from their ER transcript. \n\nAnd $AMD are signing LTAs to secure CW capacity (from Trendforce). So when Sivers is ramping with $GFS, $JBL, Ayar, $POET, O-NET and others... \n\nGiven the current constraints, it's highly likely any  independent qualified capacity that comes online would be absorbed.  \n\nAnd as a cherry on top, Morgan Stanley named $SIVE (~$1.1B) as one of the three leading CPO laser players .\n\nAlongside $55B+ players Coherent and Lumentum in their recent note for a reason...\n\n_\n\nTLDR: Sivers only needs a low end allocation from Win to make substantial gross income relative to current valuations. \n\nI think the largest revenue upside that isn't modeled in if they TAM expansion with M&A after US NASDAQ listing. \n\nBy copying the Lumentum playbook with Cloud Light to build out entire transceiver modules or with optical engines.", "text_zh": "很多人好奇 $SIVE 在 fab-light（稳懋 Win Semi 等）路径下的产能放量模型：\n\n若按稳懋晶圆产能 10% 作为偏低分配（良率假设 65%，ASP 50–75 美元）：\n\nSivers 可支撑约 3.41–5.12 亿美元年化阵列收入。按管理层毛利率目标上限 50–60%+ 粗算：\n\n约 2.05–3.07 亿美元年化毛利。\n\n相对 Sivers 当前约 11 亿美元市值，大约是：\n\n若该产能情景在 2028 兑现 → 市值/毛利约 3.6–5.4×。\n\n若分配到 15%，毛利约 3.07–4.61 亿（市值/毛利约 2.4–3.6×）。\n\nSivers CEO 也回复称正在与更多晶圆厂谈产能；旧材料显示 2024 年以来又有更多认证推进。\n\n因此随着 CPO 起飞，产能目标可能高于这里的保守假设。\n\n我也预期未来几个季度会看到收入 pipeline 预测上修——随着更多认证供应商进入 HVM。\n\n需求侧：CW 本身也极度瓶颈。\n\nLumentum 因 EML 义务在公开市场采购 CW（财报电话会）。\n$AMD 也在签 LTA 锁定 CW 产能（Trendforce）。\n所以当 Sivers 与 $GFS、$JBL、Ayar、$POET、O-NET 等一起放量时——\n\n在当前约束下，任何独立、已认证的新增产能都很可能被吃掉。\n\n锦上添花：大摩近期笔记把约 11 亿美元市值的 $SIVE，与 550 亿+ 市值的 Coherent、Lumentum 并列，称为三大 CPO 激光龙头之一……\n\nTLDR：Sivers 只需从稳懋拿到偏低分配，就能相对当前估值贡献可观毛利。\n\n我认为最大、尚未建模的收入上行，是美股纳斯达克上市后靠并购扩 TAM——\n复制 Lumentum 买 Cloud Light 那套，把整机收发器或光引擎做起来。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNWnC6zasAAeC8R.png", "width": 2056, "height": 773}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNWnH1Ya8AAVTJ4.jpg", "width": 957, "height": 1188}]}, {"id": "2077753660592033828", "url": "https://x.com/aleabitoreddit/status/2077753660592033828", "created_at": "Thu Jul 16 13:54:10 +0000 2026", "created_at_cst": "2026-07-16 21:54", "is_reply": false, "metrics": {"likes": 2091, "retweets": 143, "replies": 281, "quotes": 21, "views": 577047, "bookmarks": 270}, "tickers": [{"symbol": "MU", "sentiment": "中性偏好"}, {"symbol": "QCOM", "sentiment": "一般"}], "themes": ["ai_compute", "memory"], "text_en": "Today, $MU announced it signed memory LTAs with $QCOM.\n\nInteresting reaction to see Micron proceeded to drop 5.37% right after.\n\nDoesn’t quite feel like there’s anything individually wrong with memory or AI names with all these structural agreements signed?\n\nMore like the tail end of deleveraging / margin cascades.", "text_zh": "今天 $MU 宣布与 $QCOM 签署存储长期协议（LTA）。\n\n有意思的是：消息后美光反而跌了约 5.37%。\n\n看这些结构性协议不断落地，并不太像存储或 AI 个股各自出了什么大问题——\n更像去杠杆 / 保证金连环平仓走到尾声的情绪。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNWp14pbsAAmMza.jpg", "width": 1231, "height": 1098}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNWp14taoAA94Hi.jpg", "width": 1159, "height": 1019}]}, {"id": "2077741631135191234", "url": "https://x.com/aleabitoreddit/status/2077741631135191234", "created_at": "Thu Jul 16 13:06:22 +0000 2026", "created_at_cst": "2026-07-16 21:06", "is_reply": false, "metrics": {"likes": 206, "retweets": 8, "replies": 136, "quotes": 2, "views": 193633, "bookmarks": 9}, "tickers": [], "themes": ["misc"], "text_en": "I hope there's someone at X can fix this subscription bug. \n\nMany people are reporting that subscriptions don't renew anymore. https://t.co/0MvdfJmBg3", "text_zh": "希望 X 有人能修好这个订阅 bug。\n\n很多人反馈订阅不再自动续费了。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNWe_vEbMAAnCp3.jpg", "width": 1153, "height": 399}]}, {"id": "2077437150715666900", "url": "https://x.com/aleabitoreddit/status/2077437150715666900", "created_at": "Wed Jul 15 16:56:28 +0000 2026", "created_at_cst": "2026-07-16 00:56", "is_reply": false, "metrics": {"likes": 1273, "retweets": 78, "replies": 236, "quotes": 23, "views": 327398, "bookmarks": 140}, "tickers": [], "themes": ["misc"], "text_en": "Anthropic to IPO as early as October per Bloomberg.\n\nThis is following their $65B financing at a $965 billion  valuation last May.\n\nHmm, would you all invest in Anthropic at a $1T+ valuation? https://t.co/iFIY1WulvO", "text_zh": "彭博：Anthropic 最早或于 10 月 IPO。\n\n此前 5 月刚完成 650 亿美元融资，估值约 9650 亿美元。\n\n嗯，你们会在万亿+ 估值上投资 Anthropic 吗？", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNSJgT3aUAAomzn.jpg", "width": 1624, "height": 626}]}]}, "20260717": {"date": "20260717", "date_label": "2026年7月17日", "tweet_count": 2, "tweets": [{"id": "2078130772121399553", "url": "https://x.com/aleabitoreddit/status/2078130772121399553", "created_at": "Fri Jul 17 14:52:40 +0000 2026", "created_at_cst": "2026-07-17 22:52", "is_reply": false, "metrics": {"likes": 1605, "retweets": 97, "replies": 422, "quotes": 18, "views": 1612568, "bookmarks": 444}, "tickers": [{"symbol": "AAOI", "sentiment": "看好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "NVDA", "sentiment": "看好"}, {"symbol": "CCXI", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute", "humanoid"], "text_en": "Agreed! It’s nice to remember your thesis during a market crash.\n\nFrom my own personal thesis, if $AAOI hits $1.4B quarterly revenue start of Q3 2027. Which is annualized $5.6B off a $8B MC. \n\nIs it “over” for the company if that revenue ramp hasn’t even shown up in the quarterly earnings… when it’s 2026?\n\nSame applies to my CPO sector exposure like $SIVE, an architecture shift led by $NVDA. \n\nIf scale out volume ramps from H2 2026 into 2027, and scale up heavily volume ramps into 2028.\n\nIs it “over” that $0 -> $91B TAM expansion (per GS) hasn’t even hit yet?\n\nWith robotics like Agility, is it over in 2026 if the listing hasn’t even happened yet and humanoids haven’t ramped?\n\nI personally think current market conditions are a reflection of liquidity and leverage, not individual fundamentals.\n\nIt’s brutal for everyone to see KOSPI, TW, Nikkei, and AI, space, robotics sector stocks crash recently. \n\nEspecially when there’s a lot of irrational behavior stemming from those leverage.\n\nIn the end, we can’t tell you what stocks to buy, what timeframe you should sell, how to size your positions, or what you should do. \n\nOnly share personal thoughts or research and track if they get validated over time.\n\nSo it’s extremely important to build your own thesis, since everyone has unique risk tolerance or investing timeframes.\n\nAnd that usually leads to having higher conviction during crashes.", "text_zh": "同意！市场崩的时候，记得自己的论点很重要。\n\n按我个人框架：若 $AAOI 在 2027Q3 初做到单季收入 14 亿美元——年化约 56 亿，对应约 80 亿美元市值。\n\n那收入爬坡还没进季报、现在才是 2026 年时，公司就「完了」吗？\n\n同样适用于我的 CPO 敞口如 $SIVE——这是由 $NVDA 引领的架构切换。\n\n若 scale-out 放量从 2026H2 到 2027，scale-up 大幅放量进 2028——\n高盛说的 0→910 亿美元 TAM 扩张都还没兑现，难道就已经「完了」？\n\n机器人如 Agility：2026 年还没上市、人形还没放量，就已经结束了？\n\n我个人认为当前市况更多是流动性与杠杆的映射，而非个股基本面。\n\n最近看 KOSPI、台股、日经，以及 AI、航天、机器人板块一起崩，对谁都难受——尤其杠杆催生大量非理性行为。\n\n说到底，我们没法告诉你该买什么、何时卖、怎么仓位、该怎么办。\n只能分享个人想法/研究，并跟踪它们是否随时间被验证。\n\n所以建立自己的论点极其重要——每个
