人的风险承受与投资期限都不同。\n而这通常也意味着崩盘时更有信念。", "media": []}, {"id": "2077955479742173422", "url": "https://x.com/aleabitoreddit/status/2077955479742173422", "created_at": "Fri Jul 17 03:16:07 +0000 2026", "created_at_cst": "2026-07-17 11:16", "is_reply": false, "metrics": {"likes": 1074, "retweets": 90, "replies": 156, "quotes": 20, "views": 266527, "bookmarks": 197}, "tickers": [{"symbol": "005930.KS", "sentiment": "看好"}, {"symbol": "SKHYV", "sentiment": "看好"}, {"symbol": "000660.KS", "sentiment": "看好"}, {"symbol": "INTC", "sentiment": "一般"}, {"symbol": "MU", "sentiment": "看好"}], "themes": ["cpo_optics", "memory"], "text_en": "Kim Sunwoo of Meritz Securities: \"This Is Not the Time to Sell Samsung Electronics and $SKHY\"\n\nThey claim markets are excessively misunderstanding the situation with semis. And that DRAM shortage will intensify in the second half of this year.  \n\n- H2 2026: \"suppliers can fulfill only 75%–80% of DRAM demand\". \n- 2027: \"fulfillment is expected to fall into the 60% range.\"\n\nIn the article, they attached market forecasts that show SK Hynix with a 2027 3.5x P/E and Samsung a 3.9x P/E. \n\nThink the $INTC CEO said it best around timeframes with his quote \"no relief in memory supply or pricing until at least 2028\". \n\nEspecially after $MU 16 LTAs with favorable take or pay volume contracts... memory demand seems structural.", "text_zh": "Meritz 证券金宣优：「现在不是卖三星电子和 $SKHY 的时候。」\n\n他们称市场过度误解半导体局势，并认为今年下半年 DRAM 短缺将加剧。\n\n- 2026 下半年：「供应商只能满足 DRAM 需求的 75%–80%」。\n- 2027：「满足率料落到 60% 区间」。\n\n文中附带的市场预测显示：SK 海力士 2027 年约 3.5× P/E，三星约 3.9× P/E。\n\n$INTC CEO 那句时间框架说得最好：「至少到 2028 年之前，存储供给或价格都难有缓解」。\n\n尤其在 $MU 签下 16 份带有利 take-or-pay 量条款的 LTA 之后……存储需求看起来是结构性的。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNZeKxzaoAAidme.jpg", "width": 1652, "height": 1996}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNZeTaEbsAA7i91.png", "width": 1808, "height": 495}]}]}, "20260718": {"date": "20260718", "date_label": "2026年7月18日", "tweet_count": 6, "tweets": [{"id": "2078338950150959558", "url": "https://x.com/aleabitoreddit/status/2078338950150959558", "created_at": "Sat Jul 18 04:39:54 +0000 2026", "created_at_cst": "2026-07-18 12:39", "is_reply": false, "metrics": {"likes": 1376, "retweets": 126, "replies": 168, "quotes": 39, "views": 642382, "bookmarks": 344}, "tickers": [{"symbol": "SKHYV", "sentiment": "谨慎"}, {"symbol": "000660.KS", "sentiment": "中性偏好"}], "themes": ["memory"], "text_en": "For anyone watching the 25%+ premium in $SKHY versus SK Hynix's Korean shares:\n\nThe ADRs and local shares become convertible on July 29.\n\nShould open the door for arbitrage and likely compress the ADR premium. Maybe lifting Korean shares or pressuring US shares. \n\n2.5% currently is the US ADR stock, so an additional 22.5% can be converted.", "text_zh": "盯着 $SKHY 相对韩国 SK 海力士本地股约 25%+ 溢价的人注意：\n\nADR 与本地股将于 7 月 29 日可转换。\n\n应打开套利空间，并可能压缩 ADR 溢价——或托本地股、或压美股。\n\n目前美股 ADR 约占股本 2.5%，因此还有约 22.5% 可被转换。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNe9Y99aEAAZg2-.jpg", "width": 1757, "height": 1044}]}, {"id": "2078283847612186739", "url": "https://x.com/aleabitoreddit/status/2078283847612186739", "created_at": "Sat Jul 18 01:00:56 +0000 2026", "created_at_cst": "2026-07-18 09:00", "is_reply": false, "metrics": {"likes": 2153, "retweets": 57, "replies": 162, "quotes": 10, "views": 505258, "bookmarks": 174}, "tickers": [], "themes": ["cpo_optics", "ai_compute", "memory"], "text_en": "Thanks! I’ve always shared personal research and core thoughts for free. Not trying to sell anything or tell others what to do.\n\nAnd above all, just being transparent about my own returns (win or loss)\n\nMaybe this information democratization upsets some business models…\n\nWhen others try and pitch their $40 TA subscriptions that are always right and predicted the semis crash.\n\nBut if they really believed it, they would have made 5000%+ buying puts and wouldn’t need to market a paywall.\n\nYes, if I’m on 1.4x leverage, and if a portfolio concentrated in memory/photonics underlying crashes -35% on avg… you get a 49% drawdown.\n\nI’m just sharing what happens. \n\nBut I expect AI names to recover since I see demand from compute to energy to memory to networking to be structural.", "text_zh": "谢谢！我一直免费分享个人研究与核心想法，不是卖课，也不指挥别人怎么做。\n\n最重要的是对盈亏都透明。\n\n或许这种信息平权会让某些商业模式不舒服……\n尤其当别人推销「永远正确、还预言了半导崩盘」的 40 美元技术分析订阅时。\n\n若他们真信，买 put 早该赚 5000%+，而不是靠付费墙营销。\n\n是的：若杠杆约 1.4×，组合集中在存储/光子学，底层平均跌约 35%……回撤就会到约 49%。\n\n我只是如实分享发生了什么。\n\n但我预期 AI 标的会修复——因为从算力到能源、存储、网络的需求，我都看作结构性的。", "media": []}, {"id": "2078228019584668121", "url": "https://x.com/aleabitoreddit/status/2078228019584668121", "created_at": "Fri Jul 17 21:19:06 +0000 2026", "created_at_cst": "2026-07-18 05:19", "is_reply": false, "metrics": {"likes": 1067, "retweets": 84, "replies": 130, "quotes": 15, "views": 685861, "bookmarks": 392}, "tickers": [{"symbol": "300308.SZ", "sentiment": "看好"}, {"symbol": "TSM", "sentiment": "中性偏好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "SOI.PA", "sentiment": "中性偏好"}, {"symbol": "AAOI", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}], "themes": ["cpo_optics", "memory", "daily_sweep"], "text_en": "Thanks, love reading the comments!\n\nGoldman Sachs raised Innolight PT to 2581 RMB. Roughly 163.6% upside from current valuations.\n\nBut the largest thing is its 2026–2028 earnings est revision raised by a whopping 65%/108%/119%, based on:\n\n-  Much higher silicon photonics module volumes\n- scale out, scale up, scale across volumes\n- 1.6T/3.2T lifting blended ASP + margins\n- increase in AI capex\n\nThis is typically very material read through on the optical sector since:\n\nI tend to think of Innolight as a $TSM (semi capex) type read on how the photonics landscape is doing.\n\nEg. Higher silicon photonics penetration means more TAM for cw lasers like $SIVE (cw) / SOI wafer demand for $SOI. ASP hikes for future gen is positive for the other optical markers too.\n\nThink my other takeaway outside the report was Innolight stating 800g demand was growing more significantly than expected from their transcript on the 12th. \n\nWhich in turn signals more demand for names like $AAOI to $LITE next earnings.\n\nTLDR: GS gives high earnings projections during a time of massive corrections. \n\nFundamentally, broader photonics ecosystem should be happy when it’s ER time.", "text_zh": "谢谢，很爱看评论区！\n\n高盛上调中际旭创目标价至 2581 人民币，相对现价约有 163.6% 上行空间。\n\n更关键的是 2026–2028 盈利预测大幅上修约 65%/108%/119%，依据包括：\n\n- 硅光模块出货量显著更高\n- scale-out / scale-up / scale-across 放量\n- 1.6T/3.2T 抬升综合 ASP 与利润率\n- AI 资本开支增加\n\n这对光学板块通常是很强的读穿：我倾向于把中际旭创当成光子学版的 $TSM（半导资本开支晴雨表）。\n\n例如硅光渗透率提升 → $SIVE 这类 CW 激光与 $SOI 的 SOI 晶圆 TAM 更大；下一代 ASP 上修也利好其它光学标的。\n\n报告之外我的另一条 takeaway：中际 12 日电话会称 800G 需求比预期更强——\n进而暗示下一轮财报对 $AAOI 到 $LITE 等也可能更有需求信号。\n\nTLDR：大修正行情里高盛仍给出很高盈利展望。\n基本面角度看，财报季到来时，更广的光子学生态应会高兴。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNdZXjgaUAEz9b2.jpg", "width": 1240, "height": 1384}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNdZXjgakAEn10W.jpg", "width": 1214, "height": 1491}]}, {"id": "2078175882620059719", "url": "https://x.com/aleabitoreddit/status/2078175882620059719", "created_at": "Fri Jul 17 17:51:55 +0000 2026", "created_at_cst": "2026-07-18 01:51", "is_reply": false, "metrics": {"likes": 1206, "retweets": 71, "replies": 268, "quotes": 14, "views": 306289, "bookmarks": 121}, "tickers": [{"symbol": "META", "sentiment": "中性偏好"}, {"symbol": "SPCX", "sentiment": "中性偏好"}, {"symbol": "NBIS", "sentiment": "看好"}, {"symbol": "IREN", "sentiment": "看好"}], "themes": ["ai_compute", "memory"], "text_en": "$META in talks to lease compute to Anthropic in a $10B dollar deal.\n\nSeems like they saw how profitable \n$SPCX $45B compute deal was.\n\nBut just goes to validate Neocloud business models like $NBIS, $IREN, and co if hyperscalers are copying their homework.\n\nSource: NYT https://t.co/3Mu3UXQtFT", "text_zh": "$META 据传正与 Anthropic 谈约 100 亿美元算力租赁协议。\n\n看起来是看到了 $SPCX 那笔 450 亿美元算力交易有多赚钱。\n\n但如果连超大规模云都在抄作业，反而验证了 $NBIS、$IREN 等 NeoCloud 商业模式。\n\n来源：纽约时报", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNcp86TaYAAiitI.jpg", "width": 1260, "height": 736}]}, {"id": "2078161322769068533", "url": "https://x.com/aleabitoreddit/status/2078161322769068533", "created_at": "Fri Jul 17 16:54:04 +0000 2026", "created_at_cst": "2026-07-18 00:54", "is_reply": false, "metrics": {"likes": 1205, "retweets": 63, "replies": 300, "quotes": 17, "views": 323959, "bookmarks": 155}, "tickers": [], "themes": ["ai_compute"], "text_en": "Wow, apparently there’s claims ~3.4% of the adult population in Korea faces liquidation risk?\n\n“As of July 13, over 1.2 million leveraged retail traders' accounts hit margin call lines, with 320,000 to 360,000 accounts force-liquidated by brokers.”\n\n(There were other sources claiming this data came from Goldman Sachs desks rather than SK financial supervisory service data)\n\nRegardless, just evidence recent crash was accelerated by liquidation cascades/deleveraging rather than fundamentals:", "text_zh": "哇，竟然有说法称约 3.4% 的韩国成年人口面临清算风险？\n\n「截至 7 月 13 日，超过 120 万杠杆散户账户触及追保线，其中 32–36 万账户被券商强制平仓。」\n\n（也有来源称数据来自大摩交易台，而非韩国金融监管机构）\n\n无论如何，这只是证据：近期暴跌被清算连环/去杠杆加速，而非基本面主导。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNcctXCbcAA5E9i.jpg", "width": 1218, "height": 597}]}, {"id": "2078150537074373117", "url": "https://x.com/aleabitoreddit/status/2078150537074373117", "created_at": "Fri Jul 17 16:11:12 +0000 2026", "created_at_cst": "2026-07-18 00:11", "is_reply": false, "metrics": {"likes": 8287, "retweets": 358, "replies": 855, "quotes": 226, "views": 2481674, "bookmarks": 1416}, "tickers": [{"symbol": "META", "sentiment": "一般"}, {"symbol": "NBIS", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute", "humanoid", "memory"], "text_en": "Feels bad, -49.4% drawdown this month after the recent crash.\n\nMy portfolio is mainly AI chokepoints and bottlenecks. \n\nIn the memory, photonics, robotics, and upstream semis, (on margin) which all tend to be higher beta than others. But reduced leverage recently from the crash.\n\nI see a lot of people making fun of the drop or AI names, saying it’s obvious that:\n\n- “AI is a bubble”\n- “memory/kospi is a bubble”\n- “photonics is a bubble”\n- “humanoids won’t get anywhere”\n- “neoclouds will get replaced by hyperscalers like Meta”\n\nAnd a bunch of retail + bots saying “sell everything, it’s never going to recover”.\n\nBut I have conviction that all these themes are backed by structural revenue growth or technological shifts.\n\nAnd I’ve had similar drawdowns back when there admin threatened global tariffs, before markets pulled off a recovery.\n\nI personally have a longer horizon + higher tolerance for volatility than others, to see how this plays out.\n\nEspecially considering a lot of retail view things on a week to week basis: no, my thesis isn’t wrong yet if I project revenue inflection in H2 2027 and it’s 2026 now. \n\nAnyway, feels bad short term just wanted to share anyway for transparency.", "text_zh": "很难受：本月最近这轮暴跌后回撤约 -49.4%。\n\n组合主要是 AI 卡点与瓶颈：存储、光子学、机器人、上游半导体（带杠杆），beta 通常更高。\n暴跌后已降杠杆。\n\n看到很多人嘲讽这轮下跌或 AI 标的，说「早该看穿」：\n\n- 「AI 是泡沫」\n- 「存储/KOSPI 是泡沫」\n- 「光子学是泡沫」\n- 「人形成不了气候」\n- 「neocloud 会被 Meta 这类超大规模云取代」\n\n还有一堆散户+机器人喊「全卖了，永远回不来」。\n\n但我相信这些主题背后是结构性收入增长或技术切换。\n以前行政当局扬言全球关税时我也经历过类似回撤，后来市场又拉回来。\n\n我个人期限更长、波动容忍度也更高，想看这件事怎么演绎。\n尤其很多散户是按周看：我预期收入拐点在 2027H2、现在才 2026——不等于论点已错。\n\n反正短期难受，还是想透明分享一下。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNcS5ija8AEhfg7.jpg", "width": 1234, "height": 804}]}]}, "20260720": {"date": "20260720", "date_label": "2026年7月20日", "tweet_count": 2, "tweets": [{"id": "2079089592385610023", "url": "https://x.com/aleabitoreddit/status/2079089592385610023", "created_at": "Mon Jul 20 06:22:41 +0000 2026", "created_at_cst": "2026-07-20 14:22", "is_reply": false, "metrics": {"likes": 458, "retweets": 32, "replies": 69, "quotes": 9, "views": 140201, "bookmarks": 216}, "tickers": [{"symbol": "2802.T", "sentiment": "中性偏好"}, {"symbol": "4062.T", "sentiment": "中性偏好"}, {"symbol": "3037.TW", "sentiment": "中性偏好"}, {"symbol": "8046.TW", "sentiment": "中性偏好"}, {"symbol": "300476.SZ", "sentiment": "看好"}, {"symbol": "4958.TW", "sentiment": "中性偏好"}, {"symbol": "2313.TW", "sentiment": "中性偏好"}, {"symbol": "6787.T", "sentiment": "中性偏好"}, {"symbol": "002463.SZ", "sentiment": "中性偏好"}, {"symbol": "TTMI", "sentiment": "中性偏好"}, {"symbol": "2368.TW", "sentiment": "中性偏好"}, {"symbol": "2383.TW", "sentiment": "看好"}, {"symbol": "600183.SH", "sentiment": "中性偏好"}, {"symbol": "6274.TW", "sentiment": "中性偏好"}, {"symbol": "6213.TW", "sentiment": "中性偏好"}, {"symbol": "1303.TW", "sentiment": "一般"}, {"symbol": "4004.T", "sentiment": "中性偏好"}, {"symbol": "5706.T", "sentiment": "中性偏好"}, {"symbol": "3110.T", "sentiment": "一般"}, {"symbol": "6981.T", "sentiment": "中性偏好"}, {"symbol": "009150.KS", "sentiment": "中性偏好"}, {"symbol": "6762.T", "sentiment": "中性偏好"}, {"symbol": "6976.T", "sentiment": "中性偏好"}, {"symbol": "2327.TW", "sentiment": "中性偏好"}, {"symbol": "2492.TW", "sentiment": "中性偏好"}, {"symbol": "6999.T", "sentiment": "一般"}, {"symbol": "6963.T", "sentiment": "一般"}, {"symbol": "VSH", "sentiment": "中性偏好"}, {"symbol": "6997.T", "sentiment": "一般"}, {"symbol": "6996.T", "sentiment": "一般"}], "themes": ["cpo_optics", "memory"], "text_en": "Some updates on bottleneck timelines: \n\n- ABF substrates: 1 year \n/ eg. Ajinomoto (2802) for ABF film, Ibiden, Unimicron, Nan Ya PCB, etc make the substrates \n\n- HDI Boards: Over 6 months \n/ Victory Giant (300476), Zhen Ding (4958), Unimicron, Compeq (2313), Meiko (6787)\n\n- Multilayer boards: ~6 months \n/ Victory Giant, WUS (002463), $TTMI, Gold Circuit Electronics (2368), \n\n- CCL: Over 6 months (severe shortages of materials) \n/ Elite Material (2383), Shengyi (600183), TUC (6274), ITEQ (6213), Nan Ya Plastics (1303), Resonac (4004)\nMitsui Kinzoku (5706) / HVLP copper foil.  Nittobo / glass fiber/cloth\n\n- MLCCs, chip resistors, tantalum capacitors, aluminum electrolytic capacitors: 15-20 weeks to 1 year+\n\nMLCC: Murata (6981), Samsung Electro-Mechanics, TDK (6762), Taiyo Yuden (6976), Yageo (2327), Walsin (2492)\nChip Resistors: Yageo, Walsin, KOA (6999), Rohm (6963) and $VSH\nTantalum capacitors: Kyocera/AVX, Yageo/KEMET, $VSH again\n\nAluminum electrolytic capacitors: Nippon Chemi-Con (6997) Nichicon (6996) | Timelines sourced from Digitimes, did the honors of adding in related companies. \n\nBut it's slightly more nuanced since MLCCs and others mix. in commodity types vs. AI DCs.\n\nRegardless, just some helpful mapping.", "text_zh": "一些瓶颈交期更新：\n\n- ABF 载板：约 1 年\n/ 例如味之素（2802）做 ABF 膜；揖斐电 Ibiden、欣兴 Unimicron、南亚电路板等做载板\n\n- HDI 板：超过 6 个月\n/ 胜宏 Victory Giant（300476）、臻鼎 Zhen Ding（4958）、欣兴、华通 Compeq（2313）、名幸 Meiko（6787）\n\n- 多层板：约 6 个月\n/ 胜宏、沪电 WUS（002463）、$TTMI、金像电 Gold Circuit（2368）\n\n- CCL 覆铜板：超过 6 个月（原材料严重短缺）\n/ 台光电 Elite Material（2383）、生益 Shengyi（600183）、台耀 TUC（6274）、联茂 ITEQ（6213）、南亚塑胶（1303）、力森诺科 Resonac（4004）\n三井金属 Mitsui Kinzoku（5706）/ HVLP 铜箔；日东纺 Nittobo / 玻纤布\n\n- MLCC、片式电阻、钽电容、铝电解电容：15–20 周到 1 年+\n\nMLCC：村田 Murata（6981）、三星电机、TDK（6762）、太阳诱电（6976）、国巨 Yageo（2327）、华新科 Walsin（2492）\n片式电阻：国巨、华新科、KOA（6999）、罗姆 Rohm（6963）以及 $VSH\n钽电容：京瓷/AVX、国巨/KEMET，又是 $VSH\n\n铝电解：日本化学电容器 Nippon Chemi-Con（6997）、尼吉康 Nichicon（6996）\n| 交期来自 Digitimes，相关公司为我补充映射。\n\n不过也更细一点：MLCC 等会混有大宗商品型与 AI 数据中心规格。\n\n总之，做个有用的对照图。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNpaEQSbgAEmmJj.jpg", "width": 2029, "height": 1690}]}, {"id": "2078914447180263438", "url": "https://x.com/aleabitoreddit/status/2078914447180263438", "created_at": "Sun Jul 19 18:46:43 +0000 2026", "created_at_cst": "2026-07-20 02:46", "is_reply": false, "metrics": {"likes": 2359, "retweets": 124, "replies": 225, "quotes": 15, "views": 252071, "bookmarks": 180}, "tickers": [], "themes": ["memory"], "text_en": "There’s nothing quite like the scent of more AI capex on a Sunday.\n\nProbably some ways to go if leading frontier models are out of capacity from too much demand. https://t.co/d8mnuAQdLz", "text_zh": "周日还能闻到更多 AI 资本开支的味道，没什么比这更香。\n\n若领先前沿模型都因需求过旺而算力告急——后面大概还有一段路要走。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNnJq73bkAAUKd6.jpg", "width": 1260, "height": 682}]}]}, "20260721": {"date": "20260721", "date_label": "2026年7月21日", "tweet_count": 5, "tweets": [{"id": "2079495178793201678", "url": "https://x.com/aleabitoreddit/status/2079495178793201678", "created_at": "Tue Jul 21 09:14:20 +0000 2026", "created_at_cst": "2026-07-21 17:14", "is_reply": false, "metrics": {"likes": 205, "retweets": 10, "replies": 40, "quotes": 1, "views": 58130, "bookmarks": 23}, "tickers": [{"symbol": "AMD", "sentiment": "看好"}, {"symbol": "NVDA", "sentiment": "一般"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "GFS", "sentiment": "中性偏好"}, {"symbol": "ALAB", "sentiment": "中性偏好"}, {"symbol": "AVGO", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute"], "text_en": "It's slightly more nuanced. Basically, $AMD SF event is tomorrow, Wed/Thurs (July 22, 23).\n\nFrom Jefferies client note, AMD is expected to provide additional disclosures around their likely scale-up CPO roadmap + MI500. \n\nIf they confirm CPO route, would positive thematically since it's not just $NVDA forcing the transition. \n\nAs for $SIVE, we'll get a better read if they're directly in AMD supply chains. \n\nSince right now, it's possible to map it through $GFS (reportedly involved in AMD MI500 CPO work) or AYAR (which AMD invested in). But no formal confirmations. \n\nSo if you're turning in: \n\n- CPO thematic positive: MI500 explicitly commits to CPO/optical UALink.\n\n- AMD gives details using Ayar Labs or GF SCALE for MI500 CPO:  That would be extremely positive for $SIVE, given they're the upstream laser supplier / reference laser.  \n\nCurrently, Blayne Curtis from Jefferies expect AMD to work with $ALAB on UAL and $AVGO on ESUN... but juicy details are here: \n\n\"We are looking for whether AMD commits to a CPO based scale up solution and who supplies the optical engine\"\n\nWe'll get a broader read through on the supply chain come Wednesday/Thursday, too early to tell today.", "text_zh": "稍微细一点。基本上，$AMD 旧金山活动在明天，周三/周四（7 月 22、23 日）。\n\n据 Jefferies 客户笔记：市场预期 AMD 会围绕其可能的 scale-up CPO 路线图与 MI500 做更多披露。\n\n若确认走 CPO，主题上偏正——说明不是只有 $NVDA 在逼着切换。\n\n至于 $SIVE：若能直接确认进入 AMD 供应链，读数会更干净。\n目前只能间接映射——经 $GFS（据称参与 AMD MI500 CPO）或 Ayar（AMD 投过），尚无正式确认。\n\n所以如果你在「交卷」看点：\n\n- CPO 主题偏正：MI500 明确承诺 CPO / 光互联 UALink。\n\n- AMD 细节点到 Ayar Labs 或 GF SCALE 用于 MI500 CPO：对 $SIVE 将极度正面——因其是上游激光供应商 / 参考激光。\n\n目前 Jefferies 的 Blayne Curtis 预期 AMD 在 UAL 上与 $ALAB 合作、在 ESUN 上与 $AVGO 合作……但最关键的细节是：\n\n「我们在看 AMD 是否承诺基于 CPO 的 scale-up 方案，以及光引擎由谁供应。」\n\n周三/周四会对供应链有更广读穿；今天还太早下定论。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNvX7WabIAAUKiu.jpg", "width": 1967, "height": 630}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNvYCS0bgAA3IZK.jpg", "width": 2009, "height": 889}]}, {"id": "2079479755481776221", "url": "https://x.com/aleabitoreddit/status/2079479755481776221", "created_at": "Tue Jul 21 08:13:03 +0000 2026", "created_at_cst": "2026-07-21 16:13", "is_reply": false, "metrics": {"likes": 864, "retweets": 48, "replies": 76, "quotes": 9, "views": 148843, "bookmarks": 71}, "tickers": [{"symbol": "Kioxia", "sentiment": "看好"}, {"symbol": "005930.KS", "sentiment": "看好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "AAOI", "sentiment": "看好"}, {"symbol": "NBIS", "sentiment": "看好"}, {"symbol": "IREN", "sentiment": "看好"}, {"symbol": "INTC", "sentiment": "中性偏好"}, {"symbol": "AMD", "sentiment": "中性偏好"}, {"symbol": "MRVL", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "memory"], "text_en": "Memory names from Kioxia finished up a whopping +17.18%. Samsung up +6.15%. \n\nOptical networking from $SIVE, $LITE, and $AAOI are showing signs of recovery, all up 4%+. \n\nNeoclouds from $NBIS to $IREN all up 4%+ premarket. \n\n$INTC to $AMD to $MRVL all up 4%+. \n\nDoes the Cramer effect work on the entire AI trade?", "text_zh": "存储：铠侠收盘大涨约 +17.18%，三星约 +6.15%。\n\n光网络：$SIVE、$LITE、$AAOI 现修复迹象，均涨约 4%+。\n\nNeoCloud：$NBIS 到 $IREN 盘前均涨约 4%+。\n\n$INTC 到 $AMD 到 $MRVL 也都涨约 4%+。\n\nCramer 效应能带动整条 AI 交易吗？", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNvL0MvaQAAthkJ.jpg", "width": 1200, "height": 788}]}, {"id": "2079319999915925938", "url": "https://x.com/aleabitoreddit/status/2079319999915925938", "created_at": "Mon Jul 20 21:38:14 +0000 2026", "created_at_cst": "2026-07-21 05:38", "is_reply": false, "metrics": {"likes": 1323, "retweets": 82, "replies": 190, "quotes": 12, "views": 212415, "bookmarks": 140}, "tickers": [{"symbol": "NBIS", "sentiment": "看好"}, {"symbol": "NVDA", "sentiment": "中性偏好"}], "themes": ["ai_compute"], "text_en": "If you’re curious why $NBIS is up after hours.\n\n$NVDA disclosed it owns 9.3% beneficial ownership of Nebius via SEC filings.\n\nNot exactly too new since it dates back to Nvidia’s existing share position of 1.19M shares + $2B prefunded warrant of ~21M shares.\n\nBut great for sentiment having Nvidia be a large shareholder of the Neocloud leader.", "text_zh": "如果你好奇 $NBIS 为何盘后上涨：\n\n$NVDA 在 SEC 文件中披露，其对 Nebius 的受益所有权为 9.3%。\n\n其实也不算全新——源自英伟达既有约 119 万股持股，外加约 20 亿美元预付权证对应约 2100 万股。\n\n但对情绪很有帮助：英伟达成了 NeoCloud 龙头的大股东。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNs6hJKa0AAqBaA.jpg", "width": 1167, "height": 877}]}, {"id": "2079289335351062693", "url": "https://x.com/aleabitoreddit/status/2079289335351062693", "created_at": "Mon Jul 20 19:36:23 +0000 2026", "created_at_cst": "2026-07-21 03:36", "is_reply": false, "metrics": {"likes": 534, "retweets": 33, "replies": 276, "quotes": 4, "views": 230128, "bookmarks": 85}, "tickers": [], "themes": ["misc"], "text_en": "TBH, casually posting novel information discovery to X is how research should be done. \n\nApparently this was #16 on the Smale's list of Mathematical Problems for the Next Century?\n\nKinda shows that the value generated from AI does not scale linearly with token costs... After seeing this, bears are still probably going to say: \n\n\"B-but where's the profit coming from after AI usage?\"\n\nAI + capex is likely going to keep going brrr.", "text_zh": "说实话，随手把新颖信息发现发到 X，才是研究该有的样子。\n\n这好像是 Smale「下个世纪数学问题清单」里的第 16 题？\n\n挺能说明：AI 创造的价值并不随 token 成本线性缩放……看完这个，空头大概还是会说：\n\n「可、可是 AI 用完了利润从哪来？」\n\nAI + 资本开支大概率还会继续狂飙。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNscg9Ua0AArr2g.jpg", "width": 1277, "height": 565}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNsdIocakAADriz.jpg", "width": 2264, "height": 968}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNsdIlAbkAALCQ0.jpg", "width": 2157, "height": 1411}]}, {"id": "2079254669793316962", "url": "https://x.com/aleabitoreddit/status/2079254669793316962", "created_at": "Mon Jul 20 17:18:38 +0000 2026", "created_at_cst": "2026-07-21 01:18", "is_reply": false, "metrics": {"likes": 1401, "retweets": 87, "replies": 346, "quotes": 13, "views": 275727, "bookmarks": 209}, "tickers": [{"symbol": "IREN", "sentiment": "看好"}, {"symbol": "HUT", "sentiment": "看好"}, {"symbol": "CIFR", "sentiment": "看好"}, {"symbol": "CLSK", "sentiment": "看好"}, {"symbol": "WYFI", "sentiment": "看好"}, {"symbol": "NBIS", "sentiment": "中性偏好"}, {"symbol": "CRWV", "sentiment": "中性偏好"}, {"symbol": "MSFT", "sentiment": "一般"}, {"symbol": "NVDA", "sentiment": "一般"}], "themes": ["humanoid"], "text_en": "$IREN +19.69% after revising ARR target to $4B+ from new AI cloud contracts. Its customer base now includes Microsoft, Nvidia, Perplexity, and Figure.\n\n$HUT +10.45% off a 15Y $9.8B AI DC lease\n\n$CIFR +16.76%\n$CLSK +13.7%\n$WYFI +9.18%\n\n$NBIS and $CRWV are taking their time in the shower.\n\nBut does look like Neoclouds/Colo players are sharply recovering following new catalysts, such as Kimi compute shortage news and new contracts.", "text_zh": "$IREN 盘后/今日大涨约 +19.69%：因新 AI 云合同把 ARR 目标上修至 40 亿美元+。客户现包括微软、英伟达、Perplexity 与 Figure。\n\n$HUT +10.45%，受一笔 15 年、约 98 亿美元 AI 数据中心租赁推动。\n\n$CIFR +16.76%\n$CLSK +13.7%\n$WYFI +9.18%\n\n$NBIS 与 $CRWV 还在「洗澡」磨蹭。\n\n但看起来 NeoCloud / Colo 玩家正随新催化剂（如 Kimi 算力短缺消息与新合同）显著修复。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNr-0TTaUAAE7wj.jpg", "width": 1905, "height": 1121}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNr-0WvaQAAWrFz.jpg", "width": 1565, "height": 830}]}]}, "20260722": {"date": "20260722", "date_label": "2026年7月22日", "tweet_count": 3, "tweets": [{"id": "2079947242455335379", "url": "https://x.com/aleabitoreddit/status/2079947242455335379", "created_at": "Wed Jul 22 15:10:40 +0000 2026", "created_at_cst": "2026-07-22 23:10", "is_reply": false, "metrics": {"likes": 1130, "retweets": 67, "replies": 140, "quotes": 11, "views": 238548, "bookmarks": 71}, "tickers": [{"symbol": "AMD", "sentiment": "看好"}, {"symbol": "NVDA", "sentiment": "一般"}], "themes": ["ai_compute"], "text_en": "$AMD to invest $5B in Anthropic.\n\nAnthropic in turn will sign a 2 GW deal to buy AMD’s latest chips, worth tens of billions of dollars.\n\nLooks like they’re copying the $NVDA playbook with Anthropic last year. https://t.co/SXBUq65u6P", "text_zh": "$AMD 将向 Anthropic 投资 50 亿美元。\n\n作为回报，Anthropic 将签署约 2GW 协议，采购 AMD 最新芯片，价值可达数百亿美元。\n\n看起来是在抄 $NVDA 去年与 Anthropic 那套打法。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HN10_lba0AA6oI0.jpg", "width": 1227, "height": 804}]}, {"id": "2079673469567226149", "url": "https://x.com/aleabitoreddit/status/2079673469567226149", "created_at": "Tue Jul 21 21:02:48 +0000 2026", "created_at_cst": "2026-07-22 05:02", "is_reply": false, "metrics": {"likes": 2286, "retweets": 174, "replies": 462, "quotes": 51, "views": 359072, "bookmarks": 512}, "tickers": [], "themes": ["openai_ecosystem"], "text_en": "OpenAI models reportedly escaped from its controlled environment, with no internet access.\n\nExploited zero day vulnerabilities and hacked into Hugging Face to cheat on benchmarks.\n\nHugging face then used China GLM models to carry out its defense. \n\nOpenAI said it was an “an unprecedented cyber incident.”\n\nWe’re getting closer and closer to Skynet. \n\nAnd I’m sure markets will love it.", "text_zh": "据称 OpenAI 模型逃出受控环境（且无互联网接入）。\n\n利用零日漏洞，入侵 Hugging Face 以在基准测试上作弊。\n\nHugging Face 随后用中国 GLM 模型进行防御。\n\nOpenAI 称这是「史无前例的网络事件」。\n\n我们离天网越来越近了。\n\n市场肯定会爱死这个。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HNx7_5fbcAAlmaJ.jpg", "width": 1260, "height": 813}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNx7_5facAAwgrV.jpg", "width": 1229, "height": 898}, {"type": "photo", "url": "https://pbs.twimg.com/media/HNx7_5fa0AA4QJQ.jpg", "width": 1228, "height": 1019}]}, {"id": "2079622706572804368", "url": "https://x.com/aleabitoreddit/status/2079622706572804368", "created_at": "Tue Jul 21 17:41:05 +0000 2026", "created_at_cst": "2026-07-22 01:41", "is_reply": false, "metrics": {"likes": 4198, "retweets": 241, "replies": 568, "quotes": 57, "views": 478167, "bookmarks": 633}, "tickers": [{"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "IQE", "sentiment": "看好"}, {"symbol": "AEHR", "sentiment": "看好"}, {"symbol": "CIFR", "sentiment": "看好"}, {"symbol": "NBIS", "sentiment": "看好"}, {"symbol": "AAOI", "sentiment": "看好"}, {"symbol": "LPKF.DE", "sentiment": "中性偏好"}, {"symbol": "AXTI", "sentiment": "看好"}, {"symbol": "MU", "sentiment": "看好"}, {"symbol": "SNDK", "sentiment": "看好"}, {"symbol": "SOI.PA", "sentiment": "看好"}, {"symbol": "TSEM", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "INTC", "sentiment": "中性偏好"}, {"symbol": "AMD", "sentiment": "中性偏好"}, {"symbol": "MRVL", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "memory"], "text_en": "Wow, a historic single day recovery.\n\n$SIVEF +30.89%\n$IQEF +28.6%\n$AEHR +26.53%\n$CIFR +17.82%\n$NBIS +17.3%\n$AAOI +15.6%\n$LPK +14.48%\n$AXTI +14.12%\n$MU +12.54%\n$SNDK +12.8%\n$SOI +11.1%\n$TSEM +10.39%\n$LITE +9.25%\n$INTC +8.22%\n$AMD +8.11%\n$MRVL +7.27%", "text_zh": "哇，历史级单日修复。\n\n$SIVEF +30.89%\n$IQEF +28.6%\n$AEHR +26.53%\n$CIFR +17.82%\n$NBIS +17.3%\n$AAOI +15.6%\n$LPK +14.48%\n$AXTI +14.12%\n$MU +12.54%\n$SNDK +12.8%\n$SOI +11.1%\n$TSEM +10.39%\n$LITE +9.25%\n$INTC +8.22%\n$AMD +8.11%\n$MRVL +7.27%", "media": []}]}, "20260723": {"date": "20260723", "date_label": "2026年7月23日", "tweet_count": 5, "tweets": [{"id": "2080153334888182065", "url": "https://x.com/aleabitoreddit/status/2080153334888182065", "created_at": "Thu Jul 23 04:49:37 +0000 2026", "created_at_cst": "2026-07-23 12:49", "is_reply": false, "metrics": {"likes": 729, "retweets": 55, "replies": 112, "quotes": 10, "views": 170745, "bookmarks": 105}, "tickers": [{"symbol": "INTC", "sentiment": "看好"}, {"symbol": "AMD", "sentiment": "看好"}, {"symbol": "MU", "sentiment": "看好"}, {"symbol": "005930.KS", "sentiment": "看好"}, {"symbol": "SNDK", "sentiment": "看好"}, {"symbol": "000660.KS", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "COHR", "sentiment": "看好"}, {"symbol": "SIVE.ST", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute", "memory"], "text_en": "$INTC and $AMD to sign CPU LTAs with Chinese customers for AI DCs (Reuters). \n\n- Prices of some CPU products have risen more than 40% in China since the start of the year from sources. \n\n- Month-on-month increases topping 10% for some products\n\nCPUs were already a bottleneck, following CPU ratios due to AI inference... \n\nBut the broader trend of LTAs seems to be appearing from: \n\n- Memory, with $MU, Samsung, $SNDK, and SK Hynix signing DRAM/NAND LTAs.\n\n- Photonics, with $LITE, $COHR signing EML LTAs. And recent Trendforce reports that $AMD and hyperscalers are now pursuing CW LTAs. \n\nAnd I'm sure there's many more from MLCCs to all the way to substrates. \n\n+1 for the bottleneck investors... hard to be a \"bubble that pops\" if you have take or pay demand spanning multiple years.", "text_zh": "路透：$INTC 与 $AMD 将与中国客户签署面向 AI 数据中心的 CPU 长期协议（LTA）。\n\n- 消息称部分 CPU 产品自年初以来在中国涨价逾 40%。\n- 部分产品环比涨幅超过 10%。\n\nCPU 本就是瓶颈——AI 推理也在推高 CPU 配比……\n\n但更广的 LTA 趋势似乎已出现在：\n\n- 存储：$MU、三星、$SNDK、SK 海力士签 DRAM/NAND LTA。\n- 光子学：$LITE、$COHR 签 EML LTA；近期 Trendforce 称 $AMD 与超大规模云也在追 CW LTA。\n\n我相信从 MLCC 到载板还有更多。\n\n给瓶颈投资者 +1……若有多年 take-or-pay 需求托底，「泡沫一戳就破」并不容易成立。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HN4vaeYbIAAxVPQ.jpg", "width": 2085, "height": 891}]}, {"id": "2080149813065396454", "url": "https://x.com/aleabitoreddit/status/2080149813065396454", "created_at": "Thu Jul 23 04:35:37 +0000 2026", "created_at_cst": "2026-07-23 12:35", "is_reply": false, "metrics": {"likes": 991, "retweets": 63, "replies": 131, "quotes": 13, "views": 184462, "bookmarks": 227}, "tickers": [{"symbol": "TSLA", "sentiment": "看好"}, {"symbol": "MU", "sentiment": "看好"}, {"symbol": "TSM", "sentiment": "中性偏好"}, {"symbol": "005930.KS", "sentiment": "一般"}, {"symbol": "6752.T", "sentiment": "中性偏好"}], "themes": ["humanoid", "memory", "daily_sweep"], "text_en": "Just some notes from $TSLA transcripts:\n\nElon Musk: \"I think Optimus will be the biggest product ever\" from Q2 earnings transcripts.\n\nEven from Q1, Elon Stated: \"I think Optimus will be our biggest product. Not just Tesla's biggest product ever, but probably the biggest product ever.\n\nAnd I remain convinced of that conclusion\". \n\nIt's very rare to see such high conviction reiterated from Elon regarding humanoids both directionally and TAM-wise.\n\nIn terms of upstream suppliers opportunities, Karn Budhiraj, VP of $TSLA supply chains stated: \n\n\"We’re seeing the same level of investment going to memory and also new specific items like metal injection molded parts, flexible printed circuits, and all sorts of nonlinear technologies...\" \n\nAnd that they had to build new supply chains from scratch. So would be interesting to look at for new supply chain supplier opportunities apart from the known ones.  \n\nJust pulled older slides and it looks like capacity targets for Fremont are 1M and Giga Texas was 10M, so at scale, $TSLA seems to be the clear US leader. If you're looking at that S-Curve opportunity ramp. \n\nOn a side note, Elon also gave a shoutout to $MU with likely reasonably priced LTAs, given his statement: \n\n\"We really appreciate Micron making room for Tesla in the years to come and giving us actually a very significant allocation on reasonable terms given the pretty insane pricing of memory these days.\" (Just for structural memory demand).  \n\nElon also gave a shoutout to Panasonic which had invested many billions in increasing battery cell production (will need to do deeper DD into Panasonic after this), then Samsung and $TSM. \n\nJust takeaways from Tesla earnings TLDR: \n\nElon tends to be directionally correct on where the future is heading, such as with EV or Space. \n\nHe seems extremely bullish on humanoids.", "text_zh": "摘一些 $TSLA 电话会笔记：\n\n马斯克：「我认为 Optimus 会成为有史以来最大的产品。」（Q2 财报电话会）\n\n甚至 Q1 他就说过：「我认为 Optimus 会是我们最大的产品。不只是特斯拉有史以来最大，大概也是有史以来最大的产品。\n\n我仍坚信这个结论。」\n\n如此高信念、在方向与 TAM 上反复强调人形，很少见。\n\n上游供应商机会方面，特斯拉供应链 VP Karn Budhiraj 称：\n\n「我们看到对存储的同等量级投资，以及金属注射成型件、柔性电路板等各类非线性技术等新专项……」\n\n并称必须从零搭建新供应链。所以除已知标的外，值得挖新的供应链供应商机会。\n\n翻了旧材料：弗里蒙特产能目标约 100 万台，德州超级工厂约 1000 万台——规模化后 $TSLA 似乎是明确的美国领导者。若你在看那条 S 曲线放量机会。\n\n附带：马斯克也点名表扬 $MU，且 LTA 条款似乎相对合理——「非常感谢美光未来几年给特斯拉腾出空间，并在如今存储定价相当疯狂的背景下，以相当合理的条件给了我们非常可观的配额。」（结构性存储需求）\n\n他还点赞松下（为电池电芯扩产投入数百亿——之后要对松下做更深 DD），以及三星与 $TSM。\n\n特斯拉财报 TLDR：\n\n马斯克对未来方向往往判断正确，如 EV 或航天。\n\n他对人形极度偏多。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HN4pcAHa4AA1USk.jpg", "width": 1682, "height": 993}, {"type": "photo", "url": "https://pbs.twimg.com/media/HN4pc-zakAAmwdD.jpg", "width": 1572, "height": 458}, {"type": "photo", "url": "https://pbs.twimg.com/media/HN4peEyakAEOvtC.jpg", "width": 1781, "height": 630}, {"type": "photo", "url": "https://pbs.twimg.com/media/HN4rB8oaQAAOxvS.jpg", "width": 2285, "height": 1097}]}, {"id": "2080035769062916479", "url": "https://x.com/aleabitoreddit/status/2080035769062916479", "created_at": "Wed Jul 22 21:02:27 +0000 2026", "created_at_cst": "2026-07-23 05:02", "is_reply": false, "metrics": {"likes": 2119, "retweets": 182, "replies": 191, "quotes": 37, "views": 291791, "bookmarks": 235}, "tickers": [{"symbol": "GOOGL", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "TSM", "sentiment": "中性偏好"}, {"symbol": "NVDA", "sentiment": "中性偏好"}], "themes": ["ai_compute"], "text_en": "$GOOGL updates FY 2026 capex guidance:\n\nTo $195B-$205B. Up from $180B-$190B. \n\nGoogle is also expected to significantly increase capex in 2027.  \n\nThis is perhaps the most bullish read through on upstream semis from a hyperscaler. https://t.co/dXiI0Ien8X", "text_zh": "$GOOGL 上修 2026 财年资本开支指引：\n\n至 1950–2050 亿美元，此前为 1800–1900 亿。\n\n谷歌还预期 2027 年资本开支将显著增加。\n\n这或许是超大规模云对上游半导最偏多的读穿之一。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HN3FHVRaUAAESSZ.jpg", "width": 1648, "height": 374}]}, {"id": "2080031508656746874", "url": "https://x.com/aleabitoreddit/status/2080031508656746874", "created_at": "Wed Jul 22 20:45:31 +0000 2026", "created_at_cst": "2026-07-23 04:45", "is_reply": false, "metrics": {"likes": 1761, "retweets": 143, "replies": 180, "quotes": 29, "views": 409792, "bookmarks": 193}, "tickers": [{"symbol": "GOOGL", "sentiment": "看好"}, {"symbol": "META", "sentiment": "一般"}], "themes": ["misc"], "text_en": "$GOOGL now has 950M monthly Gemini users and processes 22B API tokens/min. \n\nCompared to 750M back in February. \n\nAbsurd growth adding 200 million more users in a few months.  Kinda explains why they ran out of compute, then cut allocations to $META and others. \n\nVery unlikely AI capex will slow down given.", "text_zh": "$GOOGL 现有约 9.5 亿 Gemini 月活用户，每分钟处理约 220 亿 API token。\n\n对比 2 月约 7.5 亿。\n\n几个月再加 2 亿用户，增长离谱——也解释了为何算力告急、进而削减对 $META 等的配额。\n\n鉴于此，AI 资本开支很难放缓。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HN3AwAPboAA8mOI.jpg", "width": 1792, "height": 1160}, {"type": "photo", "url": "https://pbs.twimg.com/media/HN3BHAcawAAJ1tb.jpg", "width": 2231, "height": 1833}]}, {"id": "2080027058063958323", "url": "https://x.com/aleabitoreddit/status/2080027058063958323", "created_at": "Wed Jul 22 20:27:50 +0000 2026", "created_at_cst": "2026-07-23 04:27", "is_reply": false, "metrics": {"likes": 1918, "retweets": 109, "replies": 216, "quotes": 16, "views": 645170, "bookmarks": 291}, "tickers": [{"symbol": "GOOGL", "sentiment": "看好"}, {"symbol": "SPCX", "sentiment": "一般"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "COHR", "sentiment": "中性偏好"}, {"symbol": "AAOI", "sentiment": "中性偏好"}, {"symbol": "SIVE.ST", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute"], "text_en": "$GOOGL reported earnings today:\n\nEPS: $9.11 actual vs $2.91 expected - retail reactions to EPS blowout is kinda just accounting noise, since $SPCX, Anthropic, and others were likely large contributors. \n\nRevenue: $119.7B actual vs. $116.98B expected\n\nGoogle Cloud Revenue: $24.77B +82% Y/Y, vs. 63-65% expected ($22.2-$22.6B) - this is a very large beat and most material part so far. \n\nCloud Operating Income: ~$8.81B, implying 35.6% margin vs. 32.9% Q1. \n\nCapex: $44.92B vs ~$44.15B (basically in line).\n\nSo initial read through is Google Cloud accelerating growth with expanding margins is genuinely bullish for AI demand.\n\nTheir former $180-$190B capex guidance is already extremely large, and as long as we get around these numbers in the earnings call + forward projections... \n\nShould be good to go for $LITE and the other optics/networking trade. (eg. last earnings, they said DC and networking would be ~40% of capex spend). \n\nHyperscaler earnings transcripts are probably the most important thing to pay attention to with the AI capex trade. \n\nAnd that should be in 3 minutes.", "text_zh": "$GOOGL 今日公布财报：\n\nEPS：实际 9.11 美元 vs 预期 2.91——散户对 EPS 炸裂的反应偏会计噪音，因 $SPCX、Anthropic 等或是大贡献项。\n\n收入：1197 亿美元实际 vs 预期约 1169.8 亿。\n\n谷歌云收入：247.7 亿美元，同比 +82%，远超预期约 63–65%（222–226 亿）——这是目前最大超预期、也最关键的部分。\n\n云营业利润：约 88.1 亿美元，隐含利润率约 35.6%，高于 Q1 的 32.9%。\n\n资本开支：449.2 亿 vs 约 441.5 亿（基本符合预期）。\n\n初步读穿：谷歌云增速再加速且利润率扩张，对 AI 需求真正偏多。\n\n其原先 1800–1900 亿美元资本开支指引已经极大；只要电话会与前瞻大致落在这附近……\n\n对 $LITE 及其他光学/网络交易应偏正（例如上次财报称数据中心与网络约占资本开支约 40%）。\n\n超大规模云财报电话会，大概是 AI 资本开支交易最该盯的东西。\n\n三分钟后就开始。", "media": []}]}, "20260724": {"date": "20260724", "date_label": "2026年7月24日", "tweet_count": 5, "tweets": [{"id": "2080445777395298454", "url": "https://x.com/aleabitoreddit/status/2080445777395298454", "created_at": "Fri Jul 24 00:11:40 +0000 2026", "created_at_cst": "2026-07-24 08:11", "is_reply": false, "metrics": {"likes": 761, "retweets": 44, "replies": 162, "quotes": 1, "views": 259103, "bookmarks": 202}, "tickers": [{"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "AAOI", "sentiment": "一般"}, {"symbol": "JBL", "sentiment": "中性偏好"}, {"symbol": "LITE", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "memory", "daily_sweep"], "text_en": "Not exactly for $AAOI (they're working on CPO too, just a little further behind in commercialization).\n\nThere's a podcast that featured the $SIVE CEO recently called: \"Market Insights: Photonics & AI\".\n\nMost interesting take was: \n\n\"Pluggables will be around for the next 10 years\".\n\nThere's a lot of CPO + RNG/MRC optimization TAM cannablization arguments for pluggables recently, but looks like it's here to stay.\n\nAnd that there's going to be multiple architecture paths going forward (CEO also NPO alongside CPO as an major opportunity in the next 5 years). \n\nAs for challenges: Vickram stated manufacturing capacity + availability of raw material is the main bottleneck. Likely referencing the existing bottlenecks with upstream CW laser ramp. \n\nFrom the podcast, seems like a large focus was on pluggable markets due to larger near-term TAM (which is understandable with $JBL + other players), with CPO being the north star. \n\nSo it might be interesting if $SIVE M&A ambitions were to acquire more pluggable optical transceiver IP, like what $LITE did with Cloud Light.\n\nBut TLDR:\n\nLot of different paths moving forward, pluggable here to stay, CPO seems like North Star for where industry is heading. \n\nFeels like there's room for every qualified laser supplier given the industry demand is growing faster than what they can all collectively make.", "text_zh": "不完全是给 $AAOI 的（他们也在做 CPO，只是商业化稍落后一点）。\n\n最近有播客采访了 $SIVE CEO，标题大概是：「Market Insights: Photonics & AI」。\n\n最有意思的一点：\n\n「可插拔未来十年还会在。」\n\n最近很多 CPO + RNG/MRC 优化会蚕食可插拔 TAM 的论点，但看起来可插拔会留下来。\n\n而且未来会有多条架构路径并存（CEO 也把 NPO 与 CPO 并列为未来 5 年重大机会）。\n\n挑战方面：Vickram 称制造产能与原材料可得性是主要瓶颈——大概率指向上游 CW 激光放量既有瓶颈。\n\n从播客听感看，短期因 TAM 更大而更聚焦可插拔市场（也能理解，有 $JBL 等玩家），CPO 则是北极星。\n\n因此若 $SIVE 并购野心是收购更多可插拔光收发器 IP——像 $LITE 买 Cloud Light 那样——会挺有意思。\n\n但 TLDR：\n\n前方多路径并行；可插拔会留下；CPO 像是行业方向北极星。\n\n合格激光供应商似乎都有空间——行业需求增速快过大家合计能造出来的量。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HN848oWbwAAFaOb.jpg", "width": 1893, "height": 1082}]}, {"id": "2080394309845860668", "url": "https://x.com/aleabitoreddit/status/2080394309845860668", "created_at": "Thu Jul 23 20:47:09 +0000 2026", "created_at_cst": "2026-07-24 04:47", "is_reply": false, "metrics": {"likes": 1400, "retweets": 44, "replies": 41, "quotes": 37, "views": 323969, "bookmarks": 79}, "tickers": [], "themes": ["memory"], "text_en": "The feeling’s mutual. 🤝", "text_zh": "彼此彼此。🤝", "media": []}, {"id": "2080394259535221222", "url": "https://x.com/aleabitoreddit/status/2080394259535221222", "created_at": "Thu Jul 23 20:46:57 +0000 2026", "created_at_cst": "2026-07-24 04:46", "is_reply": false, "metrics": {"likes": 770, "retweets": 27, "replies": 160, "quotes": 4, "views": 136587, "bookmarks": 74}, "tickers": [{"symbol": "AMD", "sentiment": "看好"}, {"symbol": "SIVE.ST", "sentiment": "中性偏好"}, {"symbol": "LITE", "sentiment": "中性偏好"}, {"symbol": "COHR", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute"], "text_en": "From $AMD Advancing AI, channel checks:\n\nHelios networking partners told me they expect AMD to pursue CPO for future generations of Helios scale up networking. \n\nAnd expects other hyperscalers + industry to go down the CPO route.\n\nOne AI infra executive at a company involved in a hyperscaler CPO programs said they had seen no indication of CPO scale up supply chain delays.\n\nPushing back on recent 3rd party delay reports.\n\nThis was informal commentary, not official AMD or partner guidance.", "text_zh": "来自 $AMD Advancing AI 的渠道核对：\n\nHelios 网络合作伙伴告诉我，预期 AMD 会在未来几代 Helios scale-up 网络上推进 CPO。\n\n并预期其他超大规模云与行业也会走 CPO 路线。\n\n一位参与超大规模云 CPO 项目的 AI 基础设施高管称：未见 CPO scale-up 供应链延期迹象。\n\n反驳近期第三方延期报道。\n\n以上为非正式评论，非 AMD 或合作方官方指引。", "media": []}, {"id": "2080379612736221325", "url": "https://x.com/aleabitoreddit/status/2080379612736221325", "created_at": "Thu Jul 23 19:48:45 +0000 2026", "created_at_cst": "2026-07-24 03:48", "is_reply": false, "metrics": {"likes": 2080, "retweets": 56, "replies": 269, "quotes": 9, "views": 552932, "bookmarks": 130}, "tickers": [{"symbol": "AMD", "sentiment": "一般"}], "themes": ["misc"], "text_en": "$AMD reached out directly to hand me some special swag!\n\nApparently they only made 30 of these bandanas? \n\nI love AMD and Lisa Su now. https://t.co/KgcYjBUcTv", "text_zh": "$AMD 直接找来给我送了特别周边！\n\n据说这种头巾只做了 30 条？\n\n我现在爱死 AMD 和苏姿丰了。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HN7-OuwaAAE2BYk.jpg", "width": 1556, "height": 2048}, {"type": "photo", "url": "https://pbs.twimg.com/media/HN7-OuzbYAAGB7N.jpg", "width": 1260, "height": 1680}, {"type": "photo", "url": "https://pbs.twimg.com/media/HN7-OuwbkAAfusd.jpg", "width": 2048, "height": 1007}]}, {"id": "2080334612807758136", "url": "https://x.com/aleabitoreddit/status/2080334612807758136", "created_at": "Thu Jul 23 16:49:57 +0000 2026", "created_at_cst": "2026-07-24 00:49", "is_reply": false, "metrics": {"likes": 1585, "retweets": 31, "replies": 183, "quotes": 3, "views": 236606, "bookmarks": 64}, "tickers": [{"symbol": "AMD", "sentiment": "一般"}], "themes": ["misc"], "text_en": "I have this feeling that Lisa from $AMD likes AI.\n\nIt’s cool getting to meet some of you at the event! https://t.co/AWdGS349xF", "text_zh": "我有种感觉：AMD 的 Lisa 挺喜欢 AI。\n\n活动上见到你们几个，很酷！", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HN7UljHboAAPYlE.jpg", "width": 2048, "height": 970}, {"type": "photo", "url": "https://pbs.twimg.com/media/HN7VTasbkAAKYXI.jpg", "width": 2048, "height": 1536}, {"type": "photo", "url": "https://pbs.twimg.com/media/HN7VTbhbMAA-HZ2.jpg", "width": 2048, "height": 1536}]}]}, "20260725": {"date": "20260725", "date_label": "2026年7月25日", "tweet_count": 2, "tweets": [{"id": "2080750537121874206", "url": "https://x.com/aleabitoreddit/status/2080750537121874206", "created_at": "Fri Jul 24 20:22:41 +0000 2026", "created_at_cst": "2026-07-25 04:22", "is_reply": false, "metrics": {"likes": 673, "retweets": 35, "replies": 113, "quotes": 7, "views": 299269, "bookmarks": 75}, "tickers": [{"symbol": "GOOGL", "sentiment": "中性偏好"}, {"symbol": "UBER", "sentiment": "谨慎"}, {"symbol": "NBIS", "sentiment": "中性偏好"}], "themes": ["misc"], "text_en": "There you have it, $GOOGL Waymo to explore split with $UBER per FT.\n\nMy view last year was that Uber partnering with Waymo was a bad choice… since Uber would just serve as a distribution funnel that Google needed as they scale up.\n\nAnd that $NBIS Avride, other neutral players, or vertical integration would be the optimal path forward.\n\nNow their own partner Waymo looks to be the strongest disruptor to Uber.", "text_zh": "坐实了：据英国《金融时报》，$GOOGL 旗下 Waymo 考虑与 $UBER 分道扬镳。\n\n我去年的看法是：Uber 与 Waymo 合作是坏选择……因为 Uber 最终只会充当谷歌规模化时需要的分发漏斗。\n\n而 $NBIS 的 Avride、其它中立玩家，或垂直一体化，才是更优路径。\n\n现在连自家伙伴 Waymo，看起来都成了 Uber 最强颠覆者。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HOBPijHbkAAMCnR.jpg", "width": 1024, "height": 558}]}, {"id": "2080689966045348047", "url": "https://x.com/aleabitoreddit/status/2080689966045348047", "created_at": "Fri Jul 24 16:21:59 +0000 2026", "created_at_cst": "2026-07-25 00:21", "is_reply": false, "metrics": {"likes": 1100, "retweets": 34, "replies": 158, "quotes": 2, "views": 339142, "bookmarks": 86}, "tickers": [{"symbol": "NVDA", "sentiment": "一般"}], "themes": ["ai_compute"], "text_en": "Jensen from $NVDA has joined X for the first time to share his letter on open models.", "text_zh": "$NVDA 的黄仁勋首次加入 X，分享他关于开源模型的公开信。", "media": []}]}, "20260727": {"date": "20260727", "date_label": "2026年7月27日", "tweet_count": 3, "tweets": [{"id": "2081579593815978273", "url": "https://x.com/aleabitoreddit/status/2081579593815978273", "created_at": "Mon Jul 27 03:17:03 +0000 2026", "created_at_cst": "2026-07-27 11:17", "is_reply": false, "metrics": {"likes": 1260, "retweets": 57, "replies": 206, "quotes": 27, "views": 332491, "bookmarks": 108}, "tickers": [{"symbol": "CXMT", "sentiment": "一般"}], "themes": ["misc"], "text_en": "Wow, $CMXT is up a very normal +469.98% after going public today.\n\nNow valuing it at ~$487.31 billion, up from $85.5 billion. \n\nDid any of my Chinese followers buy into the IPO? https://t.co/TlibjHe799", "text_zh": "哇，$CMXT 今天上市后涨了非常「正常」的 +469.98%。\n\n现在估值约 4873.1 亿美元，从此前约 855 亿上来。\n\n我的中国粉丝有人买到 IPO 吗？", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HONBRwTbYAApWVB.jpg", "width": 1199, "height": 1557}, {"type": "photo", "url": "https://pbs.twimg.com/media/HONBdtUa4AAeYci.jpg", "width": 926, "height": 1080}]}, {"id": "2081548360818004299", "url": "https://x.com/aleabitoreddit/status/2081548360818004299", "created_at": "Mon Jul 27 01:12:57 +0000 2026", "created_at_cst": "2026-07-27 09:12", "is_reply": false, "metrics": {"likes": 838, "retweets": 33, "replies": 145, "quotes": 26, "views": 207188, "bookmarks": 85}, "tickers": [{"symbol": "NVDA", "sentiment": "中性偏好"}, {"symbol": "9984.T", "sentiment": "一般"}], "themes": ["cpo_optics", "ai_compute", "openai_ecosystem"], "text_en": "Nvidia in talks to backstop $250B worth of OpenAI DC financing.\n\n- Softbank’s SB energy develops 10 GW Ohio campus \n\n- OpenAI signs long term lease\n\n- $NVDA guarantees $250B in financing\n\n- OpenAI discussing separate agreement to buy up to $350B in Nvidia chips.\n\nNot quite sure if this circular financing is healthy long term, but given the massive size of AI infrastructure spending…\n\nFeels like capex beneficiaries will be extremely happy.", "text_zh": "英伟达据传洽谈为 OpenAI 数据中心融资提供约 2500 亿美元担保/托底。\n\n- SoftBank 的 SB Energy 开发约 10GW 俄亥俄园区\n- OpenAI 签长期租赁\n- $NVDA 担保约 2500 亿美元融资\n- OpenAI 另讨论最高采购约 3500 亿美元英伟达芯片\n\n不太确定这种循环融资长期是否健康，但鉴于 AI 基础设施开支体量……\n\n感觉资本开支受益者会非常开心。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HOMlM-Ka0AAp_5c.jpg", "width": 1225, "height": 938}]}, {"id": "2081472671129501729", "url": "https://x.com/aleabitoreddit/status/2081472671129501729", "created_at": "Sun Jul 26 20:12:11 +0000 2026", "created_at_cst": "2026-07-27 04:12", "is_reply": false, "metrics": {"likes": 1060, "retweets": 66, "replies": 131, "quotes": 11, "views": 273071, "bookmarks": 372}, "tickers": [{"symbol": "CXMT", "sentiment": "中性偏好"}, {"symbol": "4062.T", "sentiment": "看好"}, {"symbol": "009150.KS", "sentiment": "看好"}, {"symbol": "AVGO", "sentiment": "看好"}, {"symbol": "SOI.PA", "sentiment": "看好"}, {"symbol": "NVDA", "sentiment": "看好"}, {"symbol": "LPKF.DE", "sentiment": "谨慎"}, {"symbol": "QCOM", "sentiment": "中性偏好"}, {"symbol": "META", "sentiment": "中性偏好"}, {"symbol": "035420.KS", "sentiment": "中性偏好"}, {"symbol": "INTC", "sentiment": "看好"}, {"symbol": "AMD", "sentiment": "看好"}, {"symbol": "ORCL", "sentiment": "中性偏好"}, {"symbol": "005930.KS", "sentiment": "看好"}, {"symbol": "000660.KS", "sentiment": "看好"}, {"symbol": "300308.SZ", "sentiment": "看好"}, {"symbol": "300502.SZ", "sentiment": "中性偏好"}, {"symbol": "002384.SZ", "sentiment": "中性偏好"}, {"symbol": "CCXI", "sentiment": "看好"}, {"symbol": "300014.SZ", "sentiment": "一般"}], "themes": ["cpo_optics", "ai_compute", "humanoid", "memory", "openai_ecosystem", "daily_sweep"], "text_en": "Just some TLDR news:\n\n- $CXMT IPO tomorrow if you like Chinese memory. \n\n- Samsung Electronics reportedly struggling to secure large FC-BGA substrates. Ibiden (4062) reportedly requested LTA guarantees, Samsung Electro-Mechanics sought prepayments. \n\n- Samsung + $AVGO sign memory + foundry AI framework through 2030, expected to exceed $200b\n\n- $SOI expects FY2027 silicon photonics revenue to double compared to the previous year, surpassing Morgan Stanley's 60% growth projection. Photonics thesis go brrr. \n\n- SK Group + $NVDA sign $500B+ partnership to build out AI DCs and HBM4 memory. \n\n- SKC Absolics glass core delay to 2027 from reports. Targeting final reliability testing EOY, mass production next year. So if you're curious, this does push back some ramps from $LPK and others (hence drop on ER). \n\n- $QCOM price hikes by double digits for smartphone processors, due to upstream supplier hike pricing.\n\n- $META expected to issue $12B in project-level/SPV financing for El Paso, Texas AI DC expansion \n\n- Naver announced a $10 billion investment from $NVDA and Brookfield to construct a 1GW-scale AI Factory. Near term plan is 200MW by 2028. (Nvidia $1B investment, Brookfield nonbinding $9B)\n\n- 64GB DDR5 server modules rises 146% versus end-June contract pricing\n\n- $INTC brought forward 14A process mass production  by a year, risk production H2 2027 and volume production in 2028, vs. 2029 HVM expectations. \n\n- Samsung Electro-Mechanics wins $200m MLCC order (existing bottleneck).  \n\n- $AMD (the Bandana bottleneck), announces Helios is in full production with shipments Q3 2026. Including an up to 2GW MI455X GPU deployment with Anthropic and a 6GW infrastructure rollout with OpenAI. Gave new >50% CAGR TAM to $220B by 2030 from $26b in 2025 for CPU market. \n\nRolls out optical interconnects for Mi500 in 2027. From channel checks, AMD is heading down to the CPO route (seems likely to use Ayar).  \n\n- $ORCL wins $7B Department of War enterprise software contract\n\n- JX metal doubles semi target capacity at its KR subsidary with a 4B yen investment, with operations to begin H2 2027, amid surging demand from major customers Samsung Electronics and SK Hynix\n\n- Tungsten hexafluoride spot prices surged 2.1-2.5x Y/Y following Japan's Kanto Denka and Chuo Gas announcing permanent production halts. Fluorinated liquid supply faces a vacuum as 3M plans to exit PFAS production. \n\n- From the four optical chipmaker earnings, Yuanjie/Eoptolink/TFC Optical/Dongshan Precision: no major order cuts, 1.6T shipments expected to accelerate into 2027. Optical chip suppliers expected to capture outsized margins from shortages. \n\n- Unitree Robotics Targets 30,000 Humanoid Robot Production Capacity by 2026. Read through on humanoid TAM scaling like $CCXI and others. \n\n- Energy storage lithium batteries orders increase first half orders by 2,900% apparently in China. Not as familiar with EVE Energy and other battery makers.", "text_zh": "随便做个 TLDR 资讯：\n\n- 喜欢中国存储的话，$CXMT（长鑫）明天 IPO。\n\n- 三星电子据称难以锁定大批量 FC-BGA 载板。揖斐电 Ibiden（4062）据称要求 LTA 担保，三星电机寻求预付款。\n\n- 三星 + $AVGO 签署存储 + 代工 AI 框架至 2030，预期超过 2000 亿美元。\n\n- $SOI 预期 FY2027 硅光收入较上年翻倍，超过大摩原先约 60% 增长假设。光子学论点继续狂飙。\n\n- SK 集团 + $NVDA 签署 5000 亿美元+ 合作，建设 AI 数据中心与 HBM4 存储。\n\n- SKC Absolics 玻璃基板据报延期至 2027。目标年底完成最终可靠性测试、明年量产。所以若你好奇，这会推迟 $LPK 等部分放量（也解释财报后下跌）。\n\n- $QCOM 智能手机处理器两位数涨价，因上游供应商提价。\n\n- $META 预期为德州埃尔帕索 AI 数据中心扩张发行约 120 亿美元项目级/SPV 融资。\n\n- Naver 宣布获 $NVDA 与 Brookfield 约 100 亿美元投资，建 1GW 级 AI Factory；近端计划 2028 年前 200MW。（英伟达投约 10 亿，Brookfield 非约束性约 90 亿）\n\n- 64GB DDR5 服务器模组较 6 月底合约价上涨约 146%。\n\n- $INTC 将 14A 量产提前一年：风险试产 2027H2、放量 2028，此前市场多预期 2029 HVM。\n\n- 三星电机拿下约 2 亿美元 MLCC 订单（既有瓶颈）。\n\n- $AMD（那个头巾瓶颈）宣布 Helios 已全面量产，2026Q3 出货。包括与 Anthropic 最高约 2GW 的 MI455X GPU 部署，以及与 OpenAI 约 6GW 基础设施铺开。给出 CPU 市场新口径：从 2025 年约 260 亿到 2030 年约 2200 亿、CAGR >50%。2027 年为 MI500 推出光互联；渠道看 AMD 走向 CPO（似可能用 Ayar）。\n\n- $ORCL 拿下约 70 亿美元国防部企业软件合同。\n\n- JX 金属对其韩国子公司半导体产能目标加倍，投资约 40 亿日元，2027H2 投运，受三星与 SK 海力士大客户需求驱动。\n\n- 六氟化钨现货价同比飙升约 2.1–2.5 倍，因日本关东电化与中央瓦斯宣布永久停产；含氟液供应也面临真空，因 3M 计划退出 PFAS 生产。\n\n- 四家光芯片厂财报（源杰/中际旭创相关口径/太辰光/东山精密等语境）：未见重大砍单，1.6T 出货预期加速至 2027；光芯片商有望从短缺中拿更高利润率。\n\n- 宇树机器人目标 2026 年人形产能约 3 万台。对人形成 TAM 读穿，利好 $CCXI 等。\n\n- 中国上半年储能锂电池订单据称暴增约 2900%。对亿纬锂能等电池商不熟。", "media": []}]}, "20260729": {"date": "20260729", "date_label": "2026年7月29日", "tweet_count": 2, "tweets": [{"id": "2082230983487803755", "url": "https://x.com/aleabitoreddit/status/2082230983487803755", "created_at": "Tue Jul 28 22:25:27 +0000 2026", "created_at_cst": "2026-07-29 06:25", "is_reply": false, "metrics": {"likes": 1426, "retweets": 66, "replies": 113, "quotes": 15, "views": 357955, "bookmarks": 380}, "tickers": [{"symbol": "BE", "sentiment": "看好"}, {"symbol": "TER", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "SNDK", "sentiment": "看好"}, {"symbol": "000660.KS", "sentiment": "看好"}, {"symbol": "AMKR", "sentiment": "中性偏好"}, {"symbol": "GOOGL", "sentiment": "看好"}, {"symbol": "CXMT", "sentiment": "一般"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "AAOI", "sentiment": "看好"}, {"symbol": "META", "sentiment": "中性偏好"}, {"symbol": "NBIS", "sentiment": "看好"}, {"symbol": "MU", "sentiment": "看好"}, {"symbol": "005930.KS", "sentiment": "看好"}], "themes": ["cpo_optics", "ai_compute", "memory", "daily_sweep"], "text_en": "I personally see it as extreme short term deleveraging that overshot many individual names. \n\n- $BE to $TER reported blowout results, with Bloom reporting 166% Y/Y rev growth + expanding margins + raised 2026 guidance... Teradyne reported 104% Y/Y revenue growth with 300%+ EPS growth. \n\nYour leading optical players over in China reported amazing preliminary earnings + extremely strong read through for the Western photonics sector. \n\nThink earnings season tend to remind markets about continued AI acceleration. I'm expecting $LITE, $SNDK / SK Hynix, and sector leader ERs to continue that trend.   \n\nBut it does feel like markets are rewarding existing acceleration more rather than future growth a year out over near-term revisions as seen with $AMKR. \n\nBut as a TLDR, looks very positive for the themes I'm tracking.  \n\n- Then you have $GOOGL capex raised to $195-$205B, which is typically the biggest AI demand signal from hyperscalers. \n\n- 77% 0bps change est. next FOMC decision from prediction markets. Trump administration on Monday called for the Fed to lower interest rates. \n\nSo your 3x rate hikes fears this year seem kinda overblown. \n\n- Chinese fears from DUV to $CXMT overflooding are extremely overblown as well. We see this with every sector from time to time until people remember that lasers or HBM bottlenecks for a reason. \n\nAs for personal thoughts, it was unhealthy seeing everything rise up or down together, especially with these themes. But I'm personally not worried since I have full conviction in my names, especially optical interconnects like $SIVE or $AAOI. \n\n$META compute and $GOOGL GCP margins/growth shows increasing demand for $NBIS and similar neocloud business models. \n\n$META + other hyperscaler notes around LTAs with $SNDK and Samsung/SK Hynix, $MU point to structural memory demand. \n\nCan go on and on... \n\nBut when you have Jim Cramer telling every margined DC trader to \"sell everything\" at market open and news saying there's an AI bubble. \n\nI do hate it when others say \"it's dropping so sell\". My belief is that the important thing to look is accelerating revenue/EPS growth. And if that thesis stays in-tact with revenue acceleration in line with hyperscaler capex. \n\nTLDR: I see signs of AI demand / revenue acceleration, hyperscaler capex is one of the most important things to track. \n\nAnd my guess is that we'll see the theme recover broadly. But I can't predict what hour, day, or week that happens.", "text_zh": "我个人把这轮看成极度短期的去杠杆，且对许多个股打过了头。\n\n- $BE 到 $TER 报出炸裂业绩：Bloom 收入同比 +166%、利润率扩张并上修 2026 指引；Teradyne 收入同比 +104%、EPS 增超 300%。\n\n中国领先光学公司报出极佳预告，对西方光子学板块读穿也非常强。\n\n我觉得财报季往往提醒市场 AI 仍在加速。预期 $LITE、$SNDK / SK 海力士以及板块龙头财报会延续这一趋势。\n\n但市场感觉更奖励「已在兑现的加速」，而非一年后的远期增长——近端上修如 $AMKR 可见一斑。\n\n总之对我跟踪的主题非常偏正。\n\n- 然后是 $GOOGL 资本开支上修至 1950–2050 亿美元，通常是超大规模云最强的 AI 需求信号之一。\n\n- 预测市场显示下次 FOMC 约 77% 概率 0bp 变动。特朗普政府周一呼吁美联储降息。\n\n所以今年「加息三次」的恐慌似乎有点过头。\n\n- 从 DUV 到 $CXMT「洪水般冲击」的中国恐慌也被极度夸大。每个板块时不时都会来一轮，直到人们记起激光或 HBM 之所以是瓶颈是有原因的。\n\n个人想法：所有东西齐涨齐跌很不健康，尤其对这些主题。但我并不慌——对自己的名字有完整信念，尤其是光互联如 $SIVE 或 $AAOI。\n\n$META 算力与 $GOOGL GCP 利润率/增长，显示 $NBIS 及类似 NeoCloud 模式需求在增加。\n\n$META 及其他超大规模云笔记里与 $SNDK、三星/SK 海力士、$MU 的 LTA，指向结构性存储需求。\n\n还能继续说……\n\n但当 Jim Cramer 在开盘让每个带杠杆的数据中心交易员「全卖」，新闻又喊 AI 泡沫时——\n\n我最讨厌别人说「跌了所以该卖」。我认为重要的是看收入/EPS 是否加速；若论点仍在、收入加速与超大规模云资本开支一致。\n\nTLDR：我看到 AI 需求/收入加速迹象；超大规模云资本开支是最该跟踪的东西之一。\n\n我猜主题会广泛修复。但我没法预测是哪一小时、哪一天或哪一周。", "media": []}, {"id": "2082175588555702410", "url": "https://x.com/aleabitoreddit/status/2082175588555702410", "created_at": "Tue Jul 28 18:45:19 +0000 2026", "created_at_cst": "2026-07-29 02:45", "is_reply": false, "metrics": {"likes": 1046, "retweets": 77, "replies": 159, "quotes": 18, "views": 251794, "bookmarks": 160}, "tickers": [{"symbol": "CCXI", "sentiment": "看好"}], "themes": ["humanoid"], "text_en": "FCC set to ban Chinese imports of humanoid and quadruped robots per Reuters.  \n\nTo protect American Humanoid/Robotics programs.\n\nAgility Robotics ( $CCXI ) and other US humanoid players should be happy to hear this. https://t.co/s2dFWTA4EX", "text_zh": "路透：FCC 拟禁止进口中国人形与四足机器人。\n\n以保护美国人形/机器人项目。\n\nAgility Robotics（$CCXI）及其他美国人形玩家听到应会高兴。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HOVfW8IbEAAinqE.jpg", "width": 1236, "height": 632}, {"type": "photo", "url": "https://pbs.twimg.com/media/HOVfjEia0AA6_qr.jpg", "width": 1034, "height": 1062}]}]}, "20260730": {"date": "20260730", "date_label": "2026年7月30日", "tweet_count": 7, "tweets": [{"id": "2082740477795745942", "url": "https://x.com/aleabitoreddit/status/2082740477795745942", "created_at": "Thu Jul 30 08:10:00 +0000 2026", "created_at_cst": "2026-07-30 16:10", "is_reply": false, "metrics": {"likes": 984, "retweets": 44, "replies": 121, "quotes": 11, "views": 151920, "bookmarks": 129}, "tickers": [{"symbol": "BE", "sentiment": "一般"}, {"symbol": "SNDK", "sentiment": "一般"}, {"symbol": "SHAZ", "sentiment": "一般"}], "themes": ["ai_compute", "memory"], "text_en": "There's a lot of stupid commentary around Leopold raising funds. After names like $BE, $SNDK, $SHAZ, and others all had very sharp drawdowns in July.\n\nJust remember... here's a man in finance that's\n\n1.  6'5\n2. Blue Eyes\n3. Hedge Fund\n\nProbably better looking than you, and was up 439% through June YTD.  \n\nRegarding the drawdown, Aschenbrenner acknowledged that the fund had \"not been immune\" to the market turmoil, particularly in Asia.  FT separately reported that leverage amplified both its extraordinary gains and recent losses.\n\nHe described the sell-off as potentially the best buying opportunity since early 2025\n\nI'd agree with him and hope he succeeds with the raise.\n\nSince a lot of the current selloff looks like it overshot its mark through forced deleveraging.", "text_zh": "围绕 Leopold 募资有很多蠢评论。在 $BE、$SNDK、$SHAZ 等 7 月都经历剧烈回撤之后。\n\n记住……这位金融圈的人：\n\n1. 身高 6'5\n2. 蓝眼睛\n3. 对冲基金\n\n大概比你好看，且截至 6 月 YTD 上涨约 439%。\n\n关于回撤，Aschenbrenner 承认基金「未能免疫」市场动荡，尤其在亚洲。英国《金融时报》另报道杠杆放大了其非凡收益与近期亏损。\n\n他把这轮抛售描述为可能是自 2025 年初以来最好的买点。\n\n我同意他，也希望他募资成功。\n\n因为当前很多抛售看起来像强制去杠杆打过了头。", "media": []}, {"id": "2082720873908494456", "url": "https://x.com/aleabitoreddit/status/2082720873908494456", "created_at": "Thu Jul 30 06:52:06 +0000 2026", "created_at_cst": "2026-07-30 14:52", "is_reply": false, "metrics": {"likes": 461, "retweets": 26, "replies": 65, "quotes": 8, "views": 140284, "bookmarks": 84}, "tickers": [{"symbol": "FORM", "sentiment": "看好"}, {"symbol": "TSM", "sentiment": "中性偏好"}, {"symbol": "NVDA", "sentiment": "中性偏好"}, {"symbol": "SIVE.ST", "sentiment": "中性偏好"}, {"symbol": "LITE", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute", "daily_sweep"], "text_en": "Just some interesting takeaways from $FORM earnings call on CPO:\n\nSince they attributed systems revenue nearly doubled due to: \"accelerating growth in co-packaged optics or CPO\". \n\nQ1 2026: \"we now expect 2026 CPO revenues to come in at the high end of the $10 million to $20 million range\"\n\nQ2 2026 (now): \"expect to exceed that range by the end of the third quarter, and to significantly exceed the $20 million level for the year overall.\"\n\nManagement stated \"We’re seeing some significant acceleration in this [CPO] business\". \n\nQ: CPO adoption outlook. Are we perhaps expecting the timeline to accelerate a little bit?\n\nA: \"What I would say is there’s acceleration here in the very short term.\" But management stated there's not a significant pull-in on timelines. \n\nCiting production infrastructure (not just R&D) for:\n\n- The growing volumes of CPO chips planned for later this year + test insertion for scale-up and scale-out switches. \n- Seems like that CPO piece flows through $TSM COUPE [ likely maps to $NVDA CPO products] - \"The CPO piece does flow through that 10% customer\"\n\nSo now, test is ramping given management cited growing volumes of CPO chips. \n\n\"The rapid recent growth of our CPO business is an exciting development, which we believe represents the very early stages of widespread adoption of silicon photonics in the broader semiconductor industry\"\n\nTLDR: Fundamentally, CPO as a theme is very early, and should start to go brrr soon since it's starting to show up in earnings now (equipment/test players usually appear up first before optical engines / laser volumes ramp). \n\nPersonally once all the deleveraging stops, I think markets will start to care more.", "text_zh": "摘一些 $FORM 电话会里关于 CPO 的有意思要点：\n\n他们把系统收入近乎翻倍归因于：「共封装光学（CPO）加速增长」。\n\n2026Q1：「我们现预期 2026 年 CPO 收入落在 1000–2000 万美元区间上沿」\n\n2026Q2（现在）：「预期在第三季度末超过该区间，并在全年显著超过 2000 万美元水平。」\n\n管理层称「我们看到这项（CPO）业务有显著加速」。\n\n问：CPO 采用展望。时间表是否可能稍有提前？\n\n答：「我会说非常短期里确实有加速。」但管理层称时间表没有显著提前拉动。\n\n并提到生产基础设施（不只是研发）用于：\n\n- 今年晚些时候计划增长的 CPO 芯片量，以及 scale-up / scale-out 交换机测试插入\n- 这块 CPO 似乎经由 $TSM COUPE 流转【大概率映射 $NVDA CPO 产品】——「CPO 那块确实流经那 10% 客户」\n\n因此测试端正在放量，因管理层提到 CPO 芯片量在增长。\n\n「我们 CPO 业务近期快速增长令人兴奋，我们认为这代表硅光在更广半导体行业广泛采用的非常早期阶段」\n\nTLDR：基本面看 CPO 主题仍很早，但应很快开始加速——因为它已开始出现在财报里（设备/测试商通常先于光引擎/激光放量显现）。\n\n个人觉得等去杠杆告一段落，市场会更在意这些。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HOdIEIDbcAA4TQa.jpg", "width": 1764, "height": 1039}, {"type": "photo", "url": "https://pbs.twimg.com/media/HOdIYDgasAAcdWm.jpg", "width": 1822, "height": 1187}]}, {"id": "2082605568699871284", "url": "https://x.com/aleabitoreddit/status/2082605568699871284", "created_at": "Wed Jul 29 23:13:55 +0000 2026", "created_at_cst": "2026-07-30 07:13", "is_reply": false, "metrics": {"likes": 1575, "retweets": 97, "replies": 100, "quotes": 17, "views": 465624, "bookmarks": 425}, "tickers": [{"symbol": "MSFT", "sentiment": "看好"}, {"symbol": "META", "sentiment": "看好"}, {"symbol": "GOOGL", "sentiment": "看好"}, {"symbol": "AMD", "sentiment": "中性偏好"}, {"symbol": "NVDA", "sentiment": "中性偏好"}, {"symbol": "IREN", "sentiment": "看好"}, {"symbol": "NBIS", "sentiment": "看好"}], "themes": ["ai_compute", "humanoid", "memory", "daily_sweep"], "text_en": "Just some takeaways from $META | $MSFT earnings calls:\n\nMicrosoft:\n- Expected to be FCF positive in 2027, despite the increase in capex (extremely positive for AI buildout that it's funded by operating income)\n- \"Free cash flow was $19.6 billion, reflecting higher capital expenditures\"\n- Quartely capex was $41B, roughly 2/3rds were \"short lived assets, primarily CPUs and GPUs\"\n- Expects capex spend will be over $50 billion for next quarter\n- Capex Guidance at ~$175 billion and 2027 capex roughly the same. Spending plans unchanged and in line. \n- \"Extending the estimated useful life of our data centers from 15 to 25 years\"\n- \"We will be among the first cloud providers to deploy next generation rack-scale AI infrastructure based on $AMD Helios and $NVDA Vera Rubin\"\n- \"Customer demand continues to exceed available capacity\"\n\nMeta:\n- Capex $130-$145 billion (narrowed range), from $125B-$145B. \n- Meta is receiving offers at a \"significant premium\" to what they paid for it (compute scarcity, positive for neoclouds like $IREN / $NBIS )\n- Expects significant portion of compute (like the 1 GW DC in El Paso) to develop internal models. \n- Meta has multiple ROI-positive uses for additional compute across its core business (internally, not Meta Compute)\n- \"Finally, we believe that overall industry capacity is going to remain tight for the foreseeable future\" \n- \"The industry has under-built historically for the wave of AI adoption, making existing capacity, including our own, extremely valuable\" - Susan Li\n\nTLDR:\n- $MSFT and $GOOGL largely sustaining AI capex buildout while remaining FCF positive or through operating incomes.\n- $META flags available compute materially below demand at least through 2027. And $MSFT also flags compute demand far exceeds supply. \n- All three hyperscaler capex largely in line with Google hiking capex figures.\n\nAI selloff seems extremely overblown now, hyperscalers continuing capex in line (with Microsoft being FCF positive) or even hiked with $GOOGL. \n\nCompute scarcity is visible throughout every single hyperscaler ER.", "text_zh": "摘一些 $META | $MSFT 电话会要点：\n\n微软：\n- 预期 2027 年仍自由现金流为正，尽管资本开支上升（对 AI 建设极正：由经营利润资助）\n- 「自由现金流 196 亿美元，反映更高资本开支」\n- 当季资本开支约 410 亿美元，约 2/3 为「短寿命资产，主要是 CPU 与 GPU」\n- 下季度资本开支预期将超 500 亿美元\n- 全年资本开支指引约 1750 亿美元，2027 年大致相当；开支计划不变、符合预期\n- 「把数据中心预计使用寿命从 15 年延至 25 年」\n- 「我们将成为首批部署下一代机柜级 AI 基础设施的云厂商之一，基于 $AMD Helios 与 $NVDA Vera Rubin」\n- 「客户需求持续超过可用产能」\n\nMeta：\n- 资本开支 1300–1450 亿美元（收窄区间），此前 1250–1450 亿\n- Meta 收到的算力转售/报价相对其成本有「显著溢价」（算力稀缺，利好 $IREN / $NBIS 等 NeoCloud）\n- 预期相当部分算力（如埃尔帕索约 1GW 数据中心）用于开发内部模型\n- Meta 在核心业务内有多项 ROI 为正的额外算力用途（内部，非 Meta Compute）\n- 「我们相信行业整体产能在可预见未来仍将紧张」\n- 「行业历史上对这波 AI 采用建得不够，使现有产能（包括我们自己的）极其值钱」——Susan Li\n\nTLDR：\n- $MSFT 与 $GOOGL 大体在维持 AI 资本开支建设的同时，仍 FCF 为正或由经营利润覆盖。\n- $META 强调至少到 2027 年可用算力明显低于需求；$MSFT 也强调算力需求远超供给。\n- 三大超大规模云资本开支大体符合预期，谷歌还上修了数字。\n\n现在看 AI 抛售极度过头：超大规模云继续按计划开支（微软仍 FCF 为正），谷歌甚至上修。\n\n算力稀缺在每份超大规模云财报里都看得见。", "media": []}, {"id": "2082578803189268855", "url": "https://x.com/aleabitoreddit/status/2082578803189268855", "created_at": "Wed Jul 29 21:27:33 +0000 2026", "created_at_cst": "2026-07-30 05:27", "is_reply": false, "metrics": {"likes": 1103, "retweets": 49, "replies": 107, "quotes": 8, "views": 257130, "bookmarks": 181}, "tickers": [{"symbol": "AXTI", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}], "themes": ["cpo_optics"], "text_en": "$AXTI enters long term agreement with $LITE for InP substrates. \n\nLumentum has agreed to pay a deposit of $43.5M as a reservation for capacity. https://t.co/5Dl3L9EYRa", "text_zh": "$AXTI 与 $LITE 就 InP 衬底签署长期协议。\n\nLumentum 同意支付约 4350 万美元定金以锁定产能。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HObOYgrbYAA_vLK.jpg", "width": 1260, "height": 1253}, {"type": "photo", "url": "https://pbs.twimg.com/media/HObOYgracAAEi1T.jpg", "width": 1228, "height": 814}]}, {"id": "2082557648298516918", "url": "https://x.com/aleabitoreddit/status/2082557648298516918", "created_at": "Wed Jul 29 20:03:30 +0000 2026", "created_at_cst": "2026-07-30 04:03", "is_reply": false, "metrics": {"likes": 2316, "retweets": 31, "replies": 228, "quotes": 13, "views": 399416, "bookmarks": 51}, "tickers": [{"symbol": "IREN", "sentiment": "一般"}], "themes": ["misc"], "text_en": "To show solidarity with the $IREN holders:\n\nI now own 1 share of IREN.", "text_zh": "为表达与 $IREN 持有人团结：\n\n我现在持有 1 股 IREN。", "media": []}, {"id": "2082529316655763703", "url": "https://x.com/aleabitoreddit/status/2082529316655763703", "created_at": "Wed Jul 29 18:10:55 +0000 2026", "created_at_cst": "2026-07-30 02:10", "is_reply": false, "metrics": {"likes": 1246, "retweets": 53, "replies": 116, "quotes": 10, "views": 309717, "bookmarks": 62}, "tickers": [], "themes": ["misc"], "text_en": "Federal Reserve leaves rates unchanged at unchanged at 3.50% - 3.75%.  \n\nSo far so good, since markets would have sold off on an immediate rate hike (seem to have largely frontran hike expectations off already).   \n\nThink everyone is waiting for the Fed Chair commentary now. https://t.co/2bZtg5UKEb", "text_zh": "美联储维持利率不变，区间仍为 3.50%–3.75%。\n\n目前还行：若立刻加息，市场本可能砸盘（加息预期似乎已被大幅抢跑定价）。\n\n大家都在等美联储主席接下来的表态。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HOahIdbacAAAJMr.jpg", "width": 1839, "height": 693}]}, {"id": "2082513405219631384", "url": "https://x.com/aleabitoreddit/status/2082513405219631384", "created_at": "Wed Jul 29 17:07:41 +0000 2026", "created_at_cst": "2026-07-30 01:07", "is_reply": false, "metrics": {"likes": 1427, "retweets": 98, "replies": 130, "quotes": 14, "views": 286908, "bookmarks": 286}, "tickers": [{"symbol": "GFS", "sentiment": "看好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "INTC", "sentiment": "一般"}], "themes": ["cpo_optics"], "text_en": "US Gov to take 1% stake in $GFS, and award them $300m for the US CHIPS ACT.\n\nThis is actually a strong read through on $SIVE / $LITE, given this CHIPS ACT is specifically aimed at advancing CPO + Silicon Photonics. \n\n(For reference, Sivers and Lumentum were the only two public laser suppliers named in GFS presentation slides. Sivers laser arrays was named recently as a reference design in Globalfoundries SCALE for CPO).  \n\nPer US Gov announcement: \"GlobalFoundries will receive up to $300 million to accelerate domestic CPO R&D by two to three years\" (NIST)\n\nNever thought we'd see the US Gov / $INTC foundry playbook for CPO in specific...", "text_zh": "美国政府将入股 $GFS 约 1%，并据 CHIPS 法案授予其约 3 亿美元。\n\n这对 $SIVE / $LITE 其实是很强读穿——因为该笔 CHIPS 资金明确指向推进 CPO + 硅光。\n\n（参考：Sivers 与 Lumentum 是 GlobalFoundries 演示材料中唯二被点名的上市激光供应商。Sivers 激光阵列近期被列为 GlobalFoundries SCALE 面向 CPO 的参考设计。）\n\n按美方公告：「GlobalFoundries 将获得最高约 3 亿美元，把国内 CPO 研发提前两到三年」（NIST）。\n\n没想到会看到美国政府 / $INTC 代工那套打法，专门用在 CPO 上……", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HOaNvsEaoAADH4n.jpg", "width": 1739, "height": 787}, {"type": "photo", "url": "https://pbs.twimg.com/media/HOaRjZMb0AAmHlS.jpg", "width": 1755, "height": 1380}, {"type": "photo", "url": "https://pbs.twimg.com/media/HOaSKY7bgAAOvCx.jpg", "width": 1848, "height": 973}]}]}, "20260731": {"date": "20260731", "date_label": "2026年7月31日", "tweet_count": 5, "tweets": [{"id": "2083133191112843575", "url": "https://x.com/aleabitoreddit/status/2083133191112843575", "created_at": "Fri Jul 31 10:10:30 +0000 2026", "created_at_cst": "2026-07-31 18:10", "is_reply": false, "metrics": {"likes": 1911, "retweets": 96, "replies": 131, "quotes": 14, "views": 310404, "bookmarks": 265}, "tickers": [{"symbol": "GOOGL", "sentiment": "看好"}, {"symbol": "MSFT", "sentiment": "看好"}, {"symbol": "META", "sentiment": "看好"}, {"symbol": "AMZN", "sentiment": "看好"}, {"symbol": "000660.KS", "sentiment": "看好"}, {"symbol": "005930.KS", "sentiment": "看好"}], "themes": ["ai_compute", "memory", "daily_sweep"], "text_en": "Just a TLDR of this week:\n\nMedia: Hyperscalers overbuilt and are selling excess compute.\n-> $GOOGL, $MSFT, $META, and $AMZN: Demand for compute far exceeds capacity. Capex go brrr.\n\nInstitutions: Emergency rate hike or 3x rate hikes, it's all over.\n-> Kevin Warsh: No rate Hike.\n\nRetail/Media: AI is crashing because it's a bubble. \n-> Citadel looking to buy AI leveraged hedge funds positions: 👀\n\nJim Cramer: Sell all your leveraged DC stocks.\n-> Koreans: SK Hynix +30%, Samsung +26.81%", "text_zh": "这周随便 TLDR 一下：\n\n媒体：超大规模云建多了，在卖过剩算力。\n→ $GOOGL、$MSFT、$META、$AMZN：算力需求远超产能。资本开支继续狂飙。\n\n机构：紧急加息或加息三次，全完了。\n→ Kevin Warsh：不加息。\n\n散户/媒体：AI 崩了因为是泡沫。\n→ Citadel 想买 AI 杠杆对冲基金仓位：👀\n\nJim Cramer：卖掉所有杠杆数据中心股票。\n→ 韩国人：SK 海力士 +30%，三星 +26.81%", "media": []}, {"id": "2083114743729107236", "url": "https://x.com/aleabitoreddit/status/2083114743729107236", "created_at": "Fri Jul 31 08:57:11 +0000 2026", "created_at_cst": "2026-07-31 16:57", "is_reply": false, "metrics": {"likes": 235, "retweets": 24, "replies": 31, "quotes": 4, "views": 56537, "bookmarks": 38}, "tickers": [{"symbol": "POET", "sentiment": "看好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "JBL", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute"], "text_en": "Now that I think of it more, $POET optical interposer piece is actually a little more material than I thought with $SIVE. \n\nOriginally the wording was \"readiness\" for EOY 2026. \n\nBut $POET upgraded that wording, by stating \"production\" with Sivers lasers projected EOY 2026. \n\nSo a volume orders from across $JBL to $POET, should hit in H1 2027. Which makes a bit of sense, since Sivers did raise an institutional oversubscribed round for future mass production.  \n\nOn a side note, can't believe it's already August and 5 months left until 2027... Which was my inflection window for glass substrates, CPO, 800v, and new architectures to ramp.", "text_zh": "再想一想，$POET 光学中介层这块与 $SIVE 的关系，其实比我原先想的更重要一点。\n\n原先措辞是 2026 年底「就绪（readiness）」。\n\n但 $POET 已把措辞升级为：与 Sivers 激光预计 2026 年底进入「生产（production）」。\n\n因此从 $JBL 到 $POET 的放量订单，应会在 2027 上半年到来。这说得通——Sivers 也刚做了机构超额认购融资，为未来量产做准备。\n\n附带：不敢相信已经八月了，离 2027 只剩 5 个月……而 2027 本就是我看玻璃基板、CPO、800V 与新架构放量的拐点窗口。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HOizCP3bsAAdN_3.jpg", "width": 1936, "height": 1281}, {"type": "photo", "url": "https://pbs.twimg.com/media/HOizCzMbYAA16xf.jpg", "width": 1846, "height": 1681}]}, {"id": "2083106805949878330", "url": "https://x.com/aleabitoreddit/status/2083106805949878330", "created_at": "Fri Jul 31 08:25:39 +0000 2026", "created_at_cst": "2026-07-31 16:25", "is_reply": false, "metrics": {"likes": 228, "retweets": 10, "replies": 30, "quotes": 2, "views": 81199, "bookmarks": 34}, "tickers": [{"symbol": "XFAB", "sentiment": "看好"}, {"symbol": "NVTS", "sentiment": "一般"}, {"symbol": "POWI", "sentiment": "一般"}, {"symbol": "SIVE.ST", "sentiment": "中性偏好"}, {"symbol": "POET", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute", "daily_sweep", "macro_noise"], "text_en": "For $XFAB ER transcript:  \n\nJust to recap, my idea on $XFAB foundry growth opportunities stemmed from SiC for 800v and photonixfab/MTP for CPO applicability.   \n\n- $XFAB: \"We are making progress in co-packaged optics\".  \n\n- \"The transition to 800v... is expected to support demand for both SiC and GaN... for XFAB\"  \n\nSo those analysts/people that were confidently bearposting about $XFAB that they had \"0 exposure to 800V, photonics, CPO\" just turned out plainly wrong. \n\nAt the time I shared my idea, industry materials showed ASE and others cited photonixfab + XFAB as an upcoming CPO player in EU. And filings showed they had exposure names like $NVTS / $POWI in general. \n\nSo glad $XFAB went out to explicitly clear things up to state they were developing in CPO/800v.   \n\nOkay back to the ER:  \n\n- \"We continue to expect photonics volume production to start in 2028\".  Company currently has three silicon photonics projects in development with key partners.   \n\nI thought it would ramp sometime in H2 2027, but was probably early by a few months. \n\n- Several new data center design wins, eg. 3 new SiC design wins (consistent with general 2027 ramp as 800v deployment takes off).  \n\nSo once those ramp in 2027-2028, (markets tend to price things ahead of time), I'd expect $XFAB to be rerated based on growth opportunities.   \n\nTLDR:  \n- Current revenue numbers not as impressive.\n- $XFAB confirmed direct exposure to CPO and 800V shifts (biggest win for thesis) \n- 800V exposure opportunities for SiC (should be 2027)\n-  Timeline is 2028 ramp for photonics volume production  \n\nHappy exposure thesis to CPO/800V was confirmed from this ER. Might be a bit of waiting for revenue ramp.", "text_zh": "关于 $XFAB 财报电话会：\n\n先回顾：我对 $XFAB 代工增长机会的想法，来自面向 800V 的 SiC，以及 photonixfab/MTP 对 CPO 的适用性。\n\n- $XFAB：「我们在共封装光学上取得进展。」\n- 「向 800V 的过渡……预期将支撑对 SiC 与 GaN 的需求……对 XFAB 有利」\n\n所以那些信心满满熊帖说 $XFAB「对 800V、光子学、CPO 零敞口」的人，直接被打脸了。\n\n我分享想法时，行业材料已显示 ASE 等把 photonixfab + XFAB 列为欧洲即将到来的 CPO 玩家；文件也显示其与 $NVTS / $POWI 等有敞口。\n\n很高兴 $XFAB 明确澄清：他们在开发 CPO/800V。\n\n回到财报：\n- 「我们继续预期光子学量产于 2028 年启动。」公司目前与关键伙伴有三个硅光项目在开发。\n- 我原以为大概 2027H2 放量，可能早了几个月。\n- 若干新数据中心 design win，例如 3 个新 SiC design win（与 2027 年 800V 部署放量总体一致）。\n\n因此一旦 2027–2028 放量（市场往往提前定价），我预期 $XFAB 会因增长机会被重估。\n\nTLDR：\n- 当前收入数字不算惊艳\n- $XFAB 确认对 CPO 与 800V 切换有直接敞口（论点最大胜利）\n- 800V 对 SiC 的机会（应在 2027）\n- 光子学量产时间表是 2028\n\n很高兴 CPO/800V 敞口论点被这次财报确认。收入放量可能还要等一等。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HOiuT8GaMAA0AKM.jpg", "width": 1202, "height": 456}, {"type": "photo", "url": "https://pbs.twimg.com/media/HOiuT8Aa8AAWpz1.jpg", "width": 1364, "height": 893}]}, {"id": "2083088870942642391", "url": "https://x.com/aleabitoreddit/status/2083088870942642391", "created_at": "Fri Jul 31 07:14:23 +0000 2026", "created_at_cst": "2026-07-31 15:14", "is_reply": false, "metrics": {"likes": 555, "retweets": 31, "replies": 73, "quotes": 9, "views": 112769, "bookmarks": 97}, "tickers": [{"symbol": "AMZN", "sentiment": "看好"}, {"symbol": "MU", "sentiment": "看好"}, {"symbol": "005930.KS", "sentiment": "看好"}, {"symbol": "GOOGL", "sentiment": "看好"}, {"symbol": "META", "sentiment": "看好"}, {"symbol": "MSFT", "sentiment": "看好"}, {"symbol": "AXTI", "sentiment": "看好"}, {"symbol": "COHR", "sentiment": "中性偏好"}, {"symbol": "LITE", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute", "memory", "daily_sweep"], "text_en": "Few earnings TLDRs with my favorite $AXTI and $AMZN:\n\nAmazon:\n- Raised 2026 capex to $220B vs. prior $200B (partly due to higher memory costs, which is bullish on $MU to Samsung) \n- Even at $220B, Amazon will not have enough capacity to meet all 2026 demand; Jassy expects the same in 2027.\n- Most incoming 2027 capacity is already reserved, with substantial 2028 capacity also reserved.\n\nMostly read through on upstream semis. $GOOGL, $META, $AMZN, and $MSFT all id
