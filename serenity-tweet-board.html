entified compute shortage. \n\nAll the narratives a few weeks earlier was \"excess compute\" from Meta and others + hyperscalers cutting back on spend... All BS. \n\nAmazon earnings was very bullish on AI semi trade. \n\nAXTI:\n\n- AXT to double InP capacity during 2026. Then double again in 2027. \n\nThis is expected to make AXT \"by far the largest indium phosphide producer in the world.\" - LFG\n\n- Q2 rev was $47.6M, the highest quarterly revenue in AXT history (InP revenue reached a record $30.7M, from DC applications.)\n- Revenue increased 77% sequentially and 164% year over year.\n- InP revenue-capacity targets: $60M per quarter exiting 2026.\n- $130M per quarter exiting 2027 \n\nThat $130m target could be hiked too since management stated they find \"whatever ways to increase that capacity expansion\"\n\n- Management said the reported backlog remains well above $100M, but that number no longer reflects all available demand.\n\n\"Customer demand continues to outpace supply, no matter how fast we add capacity.\" 800G/1.6T is driving the current cycle, while NPO/CPO extends it beyond 2027. \n\nAlso they're targeting 50%-plus gross margin: \"We should definitely be targeting a number that begins with a five.\"\n\nChina demand more than doubled, and their agreements with Casela, $COHR and $LITE did not materially drive Q2. \n\nThis is not even considering my projected massive ASP hikes yet as InP substrates get more bottlenecked. \n\nTLDR:\n\n- Amazon too much compute demands, needs capex to fufill it, so upstream semis go brrr. \n- AXT world largest InP substrate supplier, high gross margins, expansion, and supply can't keep up with demand.  \n\nBullish on demand side from Amazon + capex. Bullish on upstream optical supply chains from too much demand.", "text_zh": "几条财报 TLDR，重点是我最爱的 $AXTI 与 $AMZN：\n\n亚马逊：\n- 2026 资本开支上修至 2200 亿美元（此前 2000 亿），部分因存储成本更高——对 $MU 到三星偏多\n- 即便 2200 亿，亚马逊仍不够满足全部 2026 需求；Jassy 预期 2027 年也一样\n- 2027 年大部分即将上线产能已被预订，相当部分 2028 产能也已预订\n\n大体是对上游半导的读穿。$GOOGL、$META、$AMZN、$MSFT 都点名算力短缺。\n\n几周前叙事还是 Meta 等「算力过剩」+ 超大规模云砍开支……全是胡扯。\n\n亚马逊财报对 AI 半导交易非常偏多。\n\nAXTI：\n- AXT 将在 2026 年把 InP 产能翻倍，2027 年再翻一倍\n- 预期将使 AXT「成为遥遥领先的全球最大磷化铟生产商」——冲啊\n- Q2 收入 4760 万美元，公司单季历史新高（InP 收入创纪录 3070 万美元，来自数据中心应用）\n- 收入环比 +77%，同比 +164%\n- InP 收入-产能目标：2026 年底单季约 6000 万美元；2027 年底单季约 1.3 亿美元\n- 这 1.3 亿目标还可能上修，因管理层称会「想尽办法加大扩产」\n- 管理层称披露的 backlog 仍远高于 1 亿美元，但该数字已不再反映全部可得需求\n- 「客户需求持续快于供给，无论我们扩产多快。」800G/1.6T 驱动当前周期，NPO/CPO 把周期延到 2027 之后\n- 目标毛利率 50%+：「我们肯定该瞄准以五开头的数字。」\n- 中国需求翻倍有余；与 Casela、$COHR、$LITE 的协议对 Q2 贡献并不大\n- 这还没计入我预期的 InP 衬底更紧后的大幅 ASP 上涨\n\nTLDR：\n- 亚马逊算力需求过大、需要资本开支去兑现 → 上游半导狂飙\n- AXT 成全球最大 InP 衬底商，高毛利、扩产，供给仍跟不上需求\n\n需求侧看亚马逊 + 资本开支偏多；上游光学供应链因需求过旺也偏多。", "media": []}, {"id": "2082896789880119590", "url": "https://x.com/aleabitoreddit/status/2082896789880119590", "created_at": "Thu Jul 30 18:31:07 +0000 2026", "created_at_cst": "2026-07-31 02:31", "is_reply": false, "metrics": {"likes": 3348, "retweets": 216, "replies": 267, "quotes": 48, "views": 414248, "bookmarks": 463}, "tickers": [{"symbol": "NBIS", "sentiment": "看好"}, {"symbol": "IREN", "sentiment": "看好"}, {"symbol": "SHAZ", "sentiment": "看好"}, {"symbol": "SNDK", "sentiment": "看好"}, {"symbol": "BE", "sentiment": "看好"}, {"symbol": "SKHYV", "sentiment": "看好"}, {"symbol": "INTC", "sentiment": "中性偏好"}], "themes": ["misc"], "text_en": "Did Citadel really just liquidate Situational Awareness…\n\nThen brought up entire markets the next day?\n\n$NBIS +26.25%\n$IREN +25.96%\n$SHAZ +22.82%\n$SNDK + 23.98%\n$BE +23.67%\n$SKHY +16.98%\n$INTC +12.16%\n\nAmid many others. This has gotta be one of the wildest liquidations I’ve seen.", "text_zh": "Citadel 真的刚把 Situational Awareness 清仓了……\n\n第二天却把整个市场拉起来？\n\n$NBIS +26.25%\n$IREN +25.96%\n$SHAZ +22.82%\n$SNDK +23.98%\n$BE +23.67%\n$SKHY +16.98%\n$INTC +12.16%\n\n还有很多别的。这大概是我见过最疯的清算之一。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HOfvlTLa4AArH-O.jpg", "width": 1234, "height": 694}]}]}, "20260801": {"date": "20260801", "date_label": "2026年8月1日", "tweet_count": 4, "tweets": [{"id": "2083438823548293140", "url": "https://x.com/aleabitoreddit/status/2083438823548293140", "created_at": "Sat Aug 01 06:24:58 +0000 2026", "created_at_cst": "2026-08-01 14:24", "is_reply": false, "metrics": {"likes": 1806, "retweets": 153, "replies": 120, "quotes": 24, "views": 337583, "bookmarks": 528}, "tickers": [{"symbol": "LITE", "sentiment": "看好"}, {"symbol": "AAOI", "sentiment": "看好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "COHR", "sentiment": "看好"}], "themes": ["cpo_optics", "memory"], "text_en": "$LITE CEO Michael Hurlston at the RAISE Summit warned that the supply gap for InP lasers for AI DCs:\n\nIs facing a more severe supply chain crisis than memory. \n\nAnd with Lumentum's 5 InP fabs, shipments would be more than 30%+ below customer demand.\n\nThis is especially visible with EMLs today but is already expanding to CW, especially as CPO ramps.\n\nI've always been a fan of the laser chokepoint + bottleneck from $AAOI, $SIVE, $LITE, and $COHR. And glad this thesis is starting to see validation.", "text_zh": "$LITE CEO Michael Hurlston 在 RAISE Summit 警告：面向 AI 数据中心的 InP 激光供给缺口，\n\n正面临比存储更严重的供应链危机。\n\n即便 Lumentum 有 5 座 InP 工厂，出货仍会低于客户需求逾 30%。\n\n今天在 EML 上尤其明显，且已扩展到 CW——尤其随着 CPO 放量。\n\n我一直看好 $AAOI、$SIVE、$LITE、$COHR 的激光卡点 + 瓶颈。很高兴这个论点开始得到验证。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HOnags2awAACJgB.jpg", "width": 2124, "height": 570}]}, {"id": "2083324920214536208", "url": "https://x.com/aleabitoreddit/status/2083324920214536208", "created_at": "Fri Jul 31 22:52:21 +0000 2026", "created_at_cst": "2026-08-01 06:52", "is_reply": false, "metrics": {"likes": 3235, "retweets": 108, "replies": 252, "quotes": 18, "views": 434762, "bookmarks": 215}, "tickers": [{"symbol": "SNDK", "sentiment": "一般"}, {"symbol": "BE", "sentiment": "一般"}], "themes": ["ai_compute", "memory"], "text_en": "The media framing and X reactions around Leopold are egregious.\n\nFraming his successful multi-year thesis from $SNDK to $BE as a \"collapse\" or \"failure\".\n\nAfter July's surprising crash, then personally attacking him on top is just pathetic to witness. \n\nIt's almost like everyone is cheering for the downfall of others. \n\nYes, July's crash exposed problems with SA’s leverage, liquidity management, and hedging. \n\nBut his current YTD performance remains +80%, ranking among the best performing hedge funds. And he still has public equities after all this (just removed leverage). \n\nI think he's doing something unique while being successful at it. And this draws the envy of others.", "text_zh": "媒体框架和 X 上对 Leopold 的反应太过分了。\n\n把他从 $SNDK 到 $BE 的多年成功论点，框成「崩盘」或「失败」。\n\n7 月意外暴跌后，还人身攻击，看着就可悲。\n\n几乎像人人都在为别人倒霉喝彩。\n\n是的，7 月暴跌暴露了 SA 在杠杆、流动性管理与对冲上的问题。\n\n但他当前 YTD 仍约 +80%，仍在表现最好的对冲基金之列；折腾完后仍有公开股票仓位（只是去掉了杠杆）。\n\n我觉得他在做独特的事且做得成功，这才会引来别人的嫉妒。", "media": []}, {"id": "2083270545320386734", "url": "https://x.com/aleabitoreddit/status/2083270545320386734", "created_at": "Fri Jul 31 19:16:17 +0000 2026", "created_at_cst": "2026-08-01 03:16", "is_reply": false, "metrics": {"likes": 1152, "retweets": 99, "replies": 131, "quotes": 10, "views": 288241, "bookmarks": 331}, "tickers": [{"symbol": "AMZN", "sentiment": "看好"}, {"symbol": "META", "sentiment": "看好"}, {"symbol": "GOOGL", "sentiment": "看好"}, {"symbol": "MSFT", "sentiment": "看好"}, {"symbol": "NVDA", "sentiment": "中性偏好"}, {"symbol": "NBIS", "sentiment": "看好"}], "themes": ["cpo_optics", "ai_compute", "memory"], "text_en": "As a earnings recap: $AMZN, $META, $GOOGL, and $MSFT guided a 2026 combined capex forecast to ~$720-$745 Billion.\n\nUp from $695-$725B Billion previously.\n\nAmazon: $220B\nGoogle: $195B-$205B\nMeta: $130B-$145B\nMicrosoft: $175B\n\nWe've already seen significant deleveraging and retail/institutional margin liquidations (maybe it continues for more time, who knows). \n\nBut medium-long term, I'm not quite sure how anyone can be bearish the upstream semis or neoclouds. \n\nGiven each hyperscaler has flagged either compute shortages, rising cloud demand + pricing power, or increased spending for chips/networking.  \n\nMy \"bottleneck\" thesis with many of these upstream semi supply chains is that when trillions in capital flows into things from InP substrates or memory (which were both treated as cheap commodities) or even energy. \n\nLot of these current AI names that were treated as useless before in telecom cycles or even toilet sellers. \n\nGets rerated when their inflection period hits and capex flows into their balance sheets. \n\nAs seen with $NVDA GPUs past few years, memory this year, CPUs/MLCCs next few years, CPO in 2027, Glass Substrates in 2027, 800V in 2027, and so on.", "text_zh": "财报复盘：$AMZN、$META、$GOOGL、$MSFT 指引的 2026 合计资本开支约 7200–7450 亿美元。\n\n此前约 6950–7250 亿。\n\n亚马逊：2200 亿\n谷歌：1950–2050 亿\nMeta：1300–1450 亿\n微软：1750 亿\n\n我们已经看到显著去杠杆与散户/机构保证金清算（或许还会延续一阵，谁知道）。\n\n但中长期，我不太确定怎么还能看空上游半导或 NeoCloud。\n\n因为每家超大规模云都点出了：算力短缺、云需求与定价权上升，或芯片/网络开支加大。\n\n我对这些上游半导供应链的「瓶颈」论点是：当万亿美元级资本涌入 InP 衬底或存储（两者以前都被当便宜大宗商品）甚至能源时——\n\n很多当前 AI 名字，过去在电信周期里被视为没用，甚至像卖马桶的——\n\n会在拐点到来、资本开支流进它们资产负债表时被重估。\n\n就像过去几年 $NVDA GPU、今年的存储、未来几年的 CPU/MLCC、2027 的 CPO、2027 的玻璃基板、2027 的 800V，等等。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HOlBXrNa8AAUeRQ.jpg", "width": 1610, "height": 1526}]}, {"id": "2083225872207937687", "url": "https://x.com/aleabitoreddit/status/2083225872207937687", "created_at": "Fri Jul 31 16:18:47 +0000 2026", "created_at_cst": "2026-08-01 00:18", "is_reply": false, "metrics": {"likes": 1592, "retweets": 61, "replies": 179, "quotes": 18, "views": 466815, "bookmarks": 314}, "tickers": [{"symbol": "RDDT", "sentiment": "中性偏好"}], "themes": ["misc"], "text_en": "$RDDT ER in a nutshell:\n\nRevenue: $804.9M vs. $730.4M (expected).\nEPS: $1.25 vs. ~$0.95.\nNet income: $252.8M vs. $196.5M\n\nQ3 guidance:\nRevenue: $860–870M vs. 829.1M\nAdjusted EBITDA: $385-395M vs. $369M\n\nBlowout financials, market always like to explain the drop 22.6% off some new BS narrative. \n\nLast quarter: \"AI will disrupt Reddit causing revenue loss!\"\n\nThis quarter: \"See, DAU fell .6%!\" (proceeds to ignore any revenue/profitability growth)", "text_zh": "$RDDT 财报一句话：\n\n收入：8.049 亿 vs 预期 7.304 亿\nEPS：1.25 美元 vs 约 0.95\n净利润：2.528 亿 vs 1.965 亿\n\nQ3 指引：\n收入：8.60–8.70 亿 vs 预期 8.291 亿\n调整后 EBITDA：3.85–3.95 亿 vs 预期 3.69 亿\n\n财务炸裂，市场总爱拿新胡扯叙事解释为何跌 22.6%。\n\n上季：「AI 会颠覆 Reddit、导致收入损失！」\n这季：「看，DAU 掉了 0.6%！」（然后无视任何收入/利润增长）", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HOkV0nBa4AAZLoI.jpg", "width": 2041, "height": 1626}]}]}, "20260802": {"date": "20260802", "date_label": "2026年8月2日", "tweet_count": 1, "tweets": [{"id": "2083760320062083406", "url": "https://x.com/aleabitoreddit/status/2083760320062083406", "created_at": "Sun Aug 02 03:42:29 +0000 2026", "created_at_cst": "2026-08-02 11:42", "is_reply": false, "metrics": {"likes": 2703, "retweets": 100, "replies": 266, "quotes": 22, "views": 440245, "bookmarks": 154}, "tickers": [], "themes": ["misc"], "text_en": "Trump announced that US has cancelled its attack on Iran.\n\nAnd that they’ve agreed to the perimeters of a deal to open the Strait and end the nuclear program.\n\nAnyone else feel like they’ve aged a few years in the past 6 months? https://t.co/4PK671c548", "text_zh": "特朗普宣布美国已取消对伊朗的打击。\n\n并称已就开放霍尔木兹海峡、结束核计划的协议框架达成一致。\n\n还有人觉得过去 6 个月自己老了好几岁吗？", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HOsA9z4aYAAN7pf.jpg", "width": 1240, "height": 1237}, {"type": "photo", "url": "https://pbs.twimg.com/media/HOsA9z5akAAK3z_.jpg", "width": 1260, "height": 1286}]}]}, "20260804": {"date": "20260804", "date_label": "2026年8月4日", "tweet_count": 5, "tweets": [{"id": "2084613071423893692", "url": "https://x.com/aleabitoreddit/status/2084613071423893692", "created_at": "Tue Aug 04 12:11:01 +0000 2026", "created_at_cst": "2026-08-04 20:11", "is_reply": false, "metrics": {"likes": 1283, "retweets": 58, "replies": 158, "quotes": 14, "views": 271970, "bookmarks": 50}, "tickers": [], "themes": ["memory", "macro_noise"], "text_en": "Bessent says: \"There may be deal Tuesday or Wednesday to open Strait of Hormuz with freedom of movement\"\n\nI think markets might like the sound of this. https://t.co/qXc8u2050N", "text_zh": "Bessent 说：「周二或周三可能有协议，开放霍尔木兹海峡并保障通行自由。」\n\n我觉得市场可能会喜欢这个消息。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HO4IeB1aUAADrKf.jpg", "width": 2100, "height": 699}]}, {"id": "2084597612175618342", "url": "https://x.com/aleabitoreddit/status/2084597612175618342", "created_at": "Tue Aug 04 11:09:35 +0000 2026", "created_at_cst": "2026-08-04 19:09", "is_reply": false, "metrics": {"likes": 2478, "retweets": 249, "replies": 259, "quotes": 63, "views": 563746, "bookmarks": 447}, "tickers": [{"symbol": "AAOI", "sentiment": "看好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "JBL", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "COHR", "sentiment": "看好"}, {"symbol": "300308.SZ", "sentiment": "谨慎"}, {"symbol": "300502.SZ", "sentiment": "谨慎"}], "themes": ["cpo_optics"], "text_en": "A very material catalyst came about for Western supply chains from $AAOI, $SIVE / Jabil, to $LITE and Coherent: \n\nThe Trump administration is drafting a ban of new Chinese optical transceivers and DC devices. \n\nWhich would likely hit China’s Innolight, Eoptolink, and other Chinese optical interconnect supply chains. \n\n\"The agency would ban all imports of new transceiver models ​and then exempt many ⁠non-Chinese suppliers from the restrictions\"\n\nWe'll likely see a larger bifurcation of supply chains with even greater importance put on Western players.", "text_zh": "对西方供应链从 $AAOI、$SIVE / Jabil，到 $LITE 与 Coherent，出现一个很实质的催化剂：\n\n特朗普政府正起草禁止新增中国光收发器与数据中心设备的进口。\n\n这很可能冲击中国的中际旭创、太辰光及其他中国光互联供应链。\n\n「该机构将禁止所有新收发器型号进口，然后再豁免许多非中国供应商。」\n\n我们可能会看到供应链更大幅度分叉，西方玩家的重要性进一步上升。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HO36RXTaoAAoYOw.jpg", "width": 1760, "height": 1620}]}, {"id": "2084468063228060092", "url": "https://x.com/aleabitoreddit/status/2084468063228060092", "created_at": "Tue Aug 04 02:34:48 +0000 2026", "created_at_cst": "2026-08-04 10:34", "is_reply": false, "metrics": {"likes": 2090, "retweets": 194, "replies": 151, "quotes": 42, "views": 315445, "bookmarks": 340}, "tickers": [{"symbol": "000660.KS", "sentiment": "看好"}, {"symbol": "MU", "sentiment": "看好"}, {"symbol": "005930.KS", "sentiment": "看好"}, {"symbol": "SNDK", "sentiment": "看好"}, {"symbol": "Kioxia", "sentiment": "中性偏好"}, {"symbol": "SKHYV", "sentiment": "看好"}], "themes": ["memory"], "text_en": "SK Hynix, $MU , and Samsung have sold out of 2027 capacity for DRAM/HBM.\n\n$SNDK, Samsung, Micron current annual NAND capacity has been sold out, with Kioxia and SK Hynix expected to finalize allocations by August 2026. \n\n- Customers are being allocated only 60–70% of the volumes they initially requested\n\n- industry insiders pointed out that 2027 will enter the most severe moment of memory shortage\n\n- Allocation amounts are mostly decided, but final shipment pricing will be determined closer to delivery \n\nSource: Digitimes, citing industry sources. \n\nHard to see those memory \"oversupply\" claims in early-mid 2027 when they're all sold out of capacity already.", "text_zh": "SK 海力士、$MU 与三星的 2027 年 DRAM/HBM 产能已售罄。\n\n$SNDK、三星、美光当前年度 NAND 产能也已售罄；铠侠与 SK 海力士预计在 2026 年 8 月前敲定配额。\n\n- 客户最初申请量大约只拿到 60–70% 配额\n- 业内人士指出 2027 年将进入存储短缺最严重阶段\n- 配额量大体已定，但最终出货定价更接近交付时才定\n\n来源：Digitimes，引述业界消息。\n\n既然产能早已售罄，很难再相信那些「2027 上半年存储过剩」的说法。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HO2DBefa0AAGRfk.jpg", "width": 1882, "height": 1359}, {"type": "photo", "url": "https://pbs.twimg.com/media/HO2DHLCbUAErHo2.jpg", "width": 1809, "height": 1352}]}, {"id": "2084422873423519844", "url": "https://x.com/aleabitoreddit/status/2084422873423519844", "created_at": "Mon Aug 03 23:35:14 +0000 2026", "created_at_cst": "2026-08-04 07:35", "is_reply": false, "metrics": {"likes": 2319, "retweets": 133, "replies": 171, "quotes": 35, "views": 269305, "bookmarks": 175}, "tickers": [], "themes": ["misc"], "text_en": "Be Citadel:\n\n&gt; calls for unexpected rate hike few days ago, causing market panic\n\n&gt; reaches out and buys billions of liquidated hedge fund AI assets\n\n&gt; no rate hike \n\n&gt; “Bull market drivers are fully intact” https://t.co/gyy4Nk4SHq", "text_zh": "做 Citadel 的一天：\n\n> 几天前喊意外加息，市场恐慌\n> 伸手买入被清算对冲基金里数十亿美元 AI 资产\n> 没有加息\n> 「牛市驱动力完全完好」", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HO1bjbzaAAAa4HL.jpg", "width": 1236, "height": 1043}, {"type": "photo", "url": "https://pbs.twimg.com/media/HO1bjb4bQAAEbNj.jpg", "width": 1246, "height": 1170}]}, {"id": "2084388023689679001", "url": "https://x.com/aleabitoreddit/status/2084388023689679001", "created_at": "Mon Aug 03 21:16:45 +0000 2026", "created_at_cst": "2026-08-04 05:16", "is_reply": false, "metrics": {"likes": 2787, "retweets": 111, "replies": 247, "quotes": 35, "views": 405065, "bookmarks": 72}, "tickers": [], "themes": ["misc"], "text_en": "The bears have gone back into hibernation", "text_zh": "空头又冬眠回去了。", "media": []}]}, "20260805": {"date": "20260805", "date_label": "2026年8月5日", "tweet_count": 1, "tweets": [{"id": "2084795597417263442", "url": "https://x.com/aleabitoreddit/status/2084795597417263442", "created_at": "Wed Aug 05 00:16:18 +0000 2026", "created_at_cst": "2026-08-05 08:16", "is_reply": false, "metrics": {"likes": 1746, "retweets": 91, "replies": 90, "quotes": 19, "views": 248298, "bookmarks": 109}, "tickers": [{"symbol": "RKLB", "sentiment": "看好"}], "themes": ["cpo_optics"], "text_en": "$RKLB has been awarded a $397M contract by the US Space Force.\n\nTo build out Flatellite satellites and launch them on their Medium Lift rocket, Neutron. https://t.co/0jsPPf9ucI", "text_zh": "$RKLB 获得美国太空军约 3.97 亿美元合同。\n\n用于建设 Flatellite 卫星，并用其中型运载火箭 Neutron 发射。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HO6uiTza4AA2SKn.jpg", "width": 1560, "height": 1100}]}]}, "20260806": {"date": "20260806", "date_label": "2026年8月6日", "tweet_count": 3, "tweets": [{"id": "2085304045099696547", "url": "https://x.com/aleabitoreddit/status/2085304045099696547", "created_at": "Thu Aug 06 09:56:42 +0000 2026", "created_at_cst": "2026-08-06 17:56", "is_reply": false, "metrics": {"likes": 206, "retweets": 7, "replies": 59, "quotes": 3, "views": 35933, "bookmarks": 16}, "tickers": [{"symbol": "AAOI", "sentiment": "一般"}], "themes": ["cpo_optics"], "text_en": "I remain convinced nobody knows how to pronounce or talk about $AAOI in real life. \n\nIt’s one letter too long to say $TSM or $AMD. \n\nAnd nobody ever says to a friend“Wow, I like applied optoelectronics!”", "text_zh": "我始终坚信：现实生活中没人知道怎么念、怎么聊 $AAOI。\n\n它比说 $TSM 或 $AMD 多一个字母，太长了。\n\n也从没人跟朋友说：「哇，我喜欢 Applied Optoelectronics！」", "media": []}, {"id": "2085217487864643658", "url": "https://x.com/aleabitoreddit/status/2085217487864643658", "created_at": "Thu Aug 06 04:12:45 +0000 2026", "created_at_cst": "2026-08-06 12:12", "is_reply": false, "metrics": {"likes": 731, "retweets": 70, "replies": 67, "quotes": 9, "views": 264715, "bookmarks": 163}, "tickers": [{"symbol": "AEVA", "sentiment": "看好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "JBL", "sentiment": "一般"}], "themes": ["cpo_optics", "ai_compute", "daily_sweep"], "text_en": "The unexpected thing of the week... Was $AEVA becoming a CPO/NPO optical source player. \n\nFor background: $SIVE is viewed as the high confidence CW DFB laser supplier to Aeva (which is known for lidar). \n\nToday, Aeva reacted with +18.26% AH on news that they signed a JDA with an optical engine player for deployment at a major hyperscaler in H2 2027, production ramp 2028. \n\n\"Optical Connectivity will leverage that foundation along with Aeva’s EXISTING high-volume manufacturing and foundry supply chain\" for:\n\n- ELSFP (similar to O-Net/Enablence + $SIVE), with Sivers as the likely CW laser + potential amplifier supplier\n\n- On-chip integrated light source (likely $SIVE DFB + Aeva PIC on the architecture/integration side)\n\nTLDR: New TAM and a hyperscaler programs for Aeva for CPO/NPO, positive read through for upstream suppliers like $SIVE.", "text_zh": "这周意外的是……$AEVA 变成 CPO/NPO 光源玩家。\n\n背景：$SIVE 被视为 Aeva（以激光雷达知名）高置信度的 CW DFB 激光供应商。\n\n今天 Aeva 盘后大涨约 +18.26%：消息称其与一家光引擎玩家签了 JDA，将在某大型超大规模云于 2027H2 部署、2028 量产爬坡。\n\n「Optical Connectivity 将依托该基础，以及 Aeva 既有的高产量制造与代工供应链」用于：\n\n- ELSFP（类似 O-Net/Enablence + $SIVE），Sivers 很可能是 CW 激光 + 潜在放大器供应商\n- 片上集成光源（架构/集成侧大概是 $SIVE DFB + Aeva PIC）\n\nTLDR：Aeva 多了一块 CPO/NPO 新 TAM 与超大规模云项目，对上游如 $SIVE 读穿偏正。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HPAc0V_a4AAbbHv.jpg", "width": 2133, "height": 1239}, {"type": "photo", "url": "https://pbs.twimg.com/media/HPAoJZKbcAAkuKS.jpg", "width": 2139, "height": 1111}]}, {"id": "2085174977272360987", "url": "https://x.com/aleabitoreddit/status/2085174977272360987", "created_at": "Thu Aug 06 01:23:49 +0000 2026", "created_at_cst": "2026-08-06 09:23", "is_reply": false, "metrics": {"likes": 613, "retweets": 36, "replies": 73, "quotes": 6, "views": 169186, "bookmarks": 115}, "tickers": [{"symbol": "VIAV", "sentiment": "看好"}, {"symbol": "FORM", "sentiment": "中性偏好"}, {"symbol": "NVDA", "sentiment": "中性偏好"}, {"symbol": "SIVE.ST", "sentiment": "中性偏好"}, {"symbol": "AAOI", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute", "daily_sweep"], "text_en": "Funniest callout of the year from $VIAV on CPO timelines:\n\n\"Well, there's been a lot of industry talk [about delays], like, 'Oh, because the yield is going to be slower.' \n\nThat's all nonsense. CPO and all that thing is moving forward\"\n\nThey stated that Yes there's always issues, but the process is being improved and things are getting better. \n\nTo follow up on that, the CEO stated: \n\n- Viavi has POs for CPO-testing activity\n- “We’re already getting [CPO revenue] this quarter, and probably in December it will start accelerating.”\n\nOn a side note, they also stated, 1.6T is \"ramping very quickly\", should reach parity with 800g next year, and signaled longer tail for 800g demand. \n\nTLDR: Seeing CPO test revenues hit for $VIAV to $FORM around now. Nvidia also stated switch-side CPO for scale out and scale across has entered mass production earlier. \n\nAs for scale up timelines, early production should be H2 2027 for some players, with other CPO players Ayar stating 2028 is the volume inflection period. \n\nBasically, all the timelines seem to be the same as before and revenue is starting to hit testing players first.", "text_zh": "今年最好笑的点名来自 $VIAV 谈 CPO 时间表：\n\n「行业里有很多说法，像『哦因为良率会更慢』。\n\n那全是胡扯。CPO 那些东西都在往前走。」\n\n他们称问题总有，但工艺在改善、事情在变好。\n\n跟进一句，CEO 说：\n- Viavi 已有 CPO 测试相关订单（PO）\n- 「我们这个季度已经在拿（CPO 收入），大概到 12 月会开始加速。」\n\n附带：他们还称 1.6T「放量非常快」，明年应与 800G 持平，并暗示 800G 需求尾巴更长。\n\nTLDR：现在已看到 $VIAV 到 $FORM 一类测试端开始兑现 CPO 收入。英伟达也说过交换机侧 scale-out / scale-across 的 CPO 已更早进入量产。\n\n至于 scale-up 时间表，部分玩家早期生产约在 2027H2；其他如 Ayar 称 2028 是放量拐点。\n\n基本上时间表与此前一致，收入先打到测试设备商。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HPADszXboAAs1fl.jpg", "width": 2217, "height": 1511}, {"type": "photo", "url": "https://pbs.twimg.com/media/HPAGvBYawAAZeVl.jpg", "width": 1891, "height": 1660}]}]}, "20260807": {"date": "20260807", "date_label": "2026年8月7日", "tweet_count": 7, "tweets": [{"id": "2085711500875116887", "url": "https://x.com/aleabitoreddit/status/2085711500875116887", "created_at": "Fri Aug 07 12:55:47 +0000 2026", "created_at_cst": "2026-08-07 20:55", "is_reply": false, "metrics": {"likes": 972, "retweets": 68, "replies": 110, "quotes": 6, "views": 385836, "bookmarks": 205}, "tickers": [{"symbol": "AAOI", "sentiment": "看好"}, {"symbol": "MXL", "sentiment": "看好"}, {"symbol": "SMTC", "sentiment": "中性偏好"}, {"symbol": "MTSI", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "daily_sweep"], "text_en": "Some more TLDR takeaways from $AAOI ER:\n\n- They also flagged DSP and TIA bottlenecks, which is a positive industry read through for names like $MXL, then $SMTC and $MTSI. \n\n- For revenue growth, they're expecting more than $500 million revenue Q4, which is absurd growth. \n\nFor reference:\nQ2: $191.9M\nQ3: ~$255M-$290M\nQ4: $500M+\nBy mid-2027: ~$1.41B quarterly revenue run-rate\n\nAlways impressed by the revenue ramp from some of these optical players.", "text_zh": "再摘一些 $AAOI 财报 TLDR：\n\n- 他们也点名 DSP 与 TIA 瓶颈，对 $MXL，以及 $SMTC、$MTSI 等是正面行业读穿。\n- 收入增长上，预期 Q4 收入超 5 亿美元，增速离谱。\n\n对照：\nQ2：1.919 亿\nQ3：约 2.55–2.90 亿\nQ4：5 亿+\n到 2027 年中：单季收入年化跑速约 14.1 亿\n\n这些光学玩家的收入爬坡总是让人印象深刻。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HPHvF3jbMAAoaDE.jpg", "width": 1924, "height": 1479}]}, {"id": "2085649654059016387", "url": "https://x.com/aleabitoreddit/status/2085649654059016387", "created_at": "Fri Aug 07 08:50:01 +0000 2026", "created_at_cst": "2026-08-07 16:50", "is_reply": false, "metrics": {"likes": 315, "retweets": 21, "replies": 54, "quotes": 1, "views": 47814, "bookmarks": 58}, "tickers": [{"symbol": "AAOI", "sentiment": "中性偏好"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "AMD", "sentiment": "一般"}], "themes": ["cpo_optics", "memory", "macro_noise"], "text_en": "I usually make fun of sellside, but Rosenblatt has pretty goated channel checks on optical names, and their reports are one of the few I like talking about. \n\n$AAOI, $LITE, $SIVE, and the laser party has started to recover around the est. timing windows. \n\neg. last month: \"Multiple short sellers told them they will likely close their positions... late July and early August\". \n\nThey might have missed that they believed $AMD would be $AAOI's first CPO customer... since AAOI said they would be missing from first-gen CPO (maybe future gen?)\n\nBut lot of their talking points about China CPO laser positioning (eg. 2-3 years behind) got corroborated word-for-word from AAOI earnings today.", "text_zh": "我常嘲讽卖方，但 Rosenblatt 对光学名字的渠道核对相当顶，是我少数愿意聊的报告之一。\n\n$AAOI、$LITE、$SIVE 以及激光派对，已开始围绕其估计的时间窗口修复。\n\n例如上月：「多名空头告诉他们，可能会在 7 月底到 8 月初平仓……」\n\n他们可能错判了 $AMD 会是 $AAOI 的首个 CPO 客户——因为 AAOI 称自己会缺席第一代 CPO（或许是更后面的世代？）\n\n但他们关于中国 CPO 激光定位的许多说法（如落后 2–3 年）今天被 AAOI 财报逐字印证。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HPG1sDXaoAADgCa.jpg", "width": 1939, "height": 1611}, {"type": "photo", "url": "https://pbs.twimg.com/media/HPG2EeEbgAAyCJv.jpg", "width": 1956, "height": 1603}, {"type": "photo", "url": "https://pbs.twimg.com/media/HPG2TdXaYAAXqas.png", "width": 1963, "height": 707}]}, {"id": "2085644051446108223", "url": "https://x.com/aleabitoreddit/status/2085644051446108223", "created_at": "Fri Aug 07 08:27:45 +0000 2026", "created_at_cst": "2026-08-07 16:27", "is_reply": false, "metrics": {"likes": 238, "retweets": 16, "replies": 65, "quotes": 1, "views": 40378, "bookmarks": 51}, "tickers": [{"symbol": "CCXI", "sentiment": "中性偏好"}], "themes": ["humanoid"], "text_en": "Unitree, China's humanoid leader, is set to IPO this month at a $9B valuation! (~$6.2B originally per March filing). \n\nDerivative markets are pricing open at an implied $36.04B MC, roughly ~4X listing price. \n\n$CCXI / Agility Robotics, the first US publicly listed pure play humanoid leader, is also going public later in Q4, at a ~$2.5B pre-money valuation.\n\nIt will be interesting to see how markets price in America vs. Chinese Humanoid leaders.", "text_zh": "中国人形龙头宇树本月拟以 90 亿美元估值 IPO！（3 月文件原约 62 亿）。\n\n衍生品市场隐含开盘市值约 360.4 亿美元，大约是上市价的 4 倍。\n\n美国首家上市纯人形龙头 $CCXI / Agility Robotics 也计划 Q4 晚些时候上市，投前估值约 25 亿美元。\n\n看市场怎么给美中人形龙头定价，会很有意思。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HPGxv_va8AAFQ5O.jpg", "width": 1415, "height": 1026}]}, {"id": "2085628664528662818", "url": "https://x.com/aleabitoreddit/status/2085628664528662818", "created_at": "Fri Aug 07 07:26:37 +0000 2026", "created_at_cst": "2026-08-07 15:26", "is_reply": false, "metrics": {"likes": 365, "retweets": 31, "replies": 59, "quotes": 4, "views": 86877, "bookmarks": 76}, "tickers": [{"symbol": "POET", "sentiment": "看好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "Lumilens", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute", "humanoid", "memory", "daily_sweep"], "text_en": "Earlier today, optical interconnect company Lumilens \"emerges from stealth\" at a $5.5B valuation, after raising $700m.\n\nJust as a recap from $POET / $SIVE Linkedin OSINT mapping I shared earlier, Lumilens was supplying a top 3 hyperscaler customer. \n\nSo we got confirmation of that a month later, along with the material figure that Lumilens has a \"multi-billion-dollar customer agreement\". \n\nAnd just for reference, $POET has existing contracts with Lumilens ($50m purchase order, up to $500m) + contracts with $SIVE (depending on product lines). \n\nI actually took tiny positions in POET again after reading this news, since it finally gives them visibility into extremely well funded hyperscaler suppliers (on top of Poet's really large balance sheet). \n\nBut TLDR: \n> Lumilens around similar (or even higher) valuations as Lightmatter/Ayar, bigger than markets thought with hyperscaler customers. \n> nice read through upstream on $POET (derisking) /  $SIVE.\n> Great for optical valuations in general, seeing a company go to $5.5B in 2 years.", "text_zh": "今天早些时候，光互联公司 Lumilens「走出隐身」，估值 55 亿美元，融资 7 亿美元。\n\n回顾我此前分享的 $POET / $SIVE LinkedIn OSINT 映射：Lumilens 在供货一家前三大超大规模云客户。\n\n一个月后得到确认，并给出实质数字：Lumilens 有「数十亿美元级客户协议」。\n\n参考：$POET 已与 Lumilens 有合同（5000 万美元采购订单、最高可达 5 亿美元）+ 与 $SIVE 有合同（视产品线而定）。\n\n看完新闻我其实又小仓位买回一点 POET——终于给它们接入资金极充裕的超大规模云供应商能见度（再加 POET 本身很大的资产负债表）。\n\n但 TLDR：\n> Lumilens 估值接近甚至高于 Lightmatter/Ayar，有超大规模云客户、比市场原先想的更大。\n> 对上游 $POET（去风险）/ $SIVE 读穿不错。\n> 对光学估值整体也好：两年做到 55 亿美元。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HPGkNbmawAA-M4D.jpg", "width": 1200, "height": 702}, {"type": "photo", "url": "https://pbs.twimg.com/media/HPGkNbka8AAoRr1.jpg", "width": 1200, "height": 816}, {"type": "photo", "url": "https://pbs.twimg.com/media/HPGkNbma8AEsjpH.jpg", "width": 1199, "height": 730}]}, {"id": "2085603590903902621", "url": "https://x.com/aleabitoreddit/status/2085603590903902621", "created_at": "Fri Aug 07 05:46:59 +0000 2026", "created_at_cst": "2026-08-07 13:46", "is_reply": false, "metrics": {"likes": 291, "retweets": 21, "replies": 41, "quotes": 2, "views": 45775, "bookmarks": 78}, "tickers": [{"symbol": "AAOI", "sentiment": "中性偏好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "AVGO", "sentiment": "中性偏好"}, {"symbol": "COHR", "sentiment": "看好"}, {"symbol": "AMD", "sentiment": "一般"}, {"symbol": "NVDA", "sentiment": "一般"}, {"symbol": "MTSI", "sentiment": "谨慎"}], "themes": ["cpo_optics", "ai_compute", "memory", "daily_sweep"], "text_en": "Wow, there's gem after gem in $AAOI earnings for $SIVE + other laser player readthrough.\n\n1. AAOI not meaningfully participating in CPO first-gen deployments.\n\n\"We just can’t make enough of them [CPO lasers] to be involved in their current first-generation [CPO] deployments because there’s just not enough capacity.   We have to prioritize our ability to make lasers for our own  transceivers first\"\n\nSo first-gen CPO laser deployments, might even be narrowed down further for Western players like $SIVE, $LITE, $AVGO, and $COHR.\n\nAnd independent CPO CW laser capacity became more valuable if $AAOI had to turn away more customers...\n\nAlso remember Trendforce was talking about $AMD singing CW LTAs? $COHR / $LITE have capacity signed with $NVDA ...\n\nI thought it would be $AAOI, but they might be out of the equation. $MTSI also doesn't look meaningful with early CPO participation (eg. no mention in ER aside from NPO, and removal from Ayar website).\n\nSo I wonder who players like $AMD is going to go with for Helios (eg. Sivers + Ayar more likely candidate now)?\n\nBtw, this is not bearish AAOI because they have too much demand for optical transceiver business. Just more bullish on the existing few qualified CPO laser names that have capacity. \n\n2. Demand imbalance and bottleneck for InP lasers / optical transceivers.\n\nAOI's CEO stated kinda supported that when they said: \"The customer demand is 20%-40% higher\" than expanded built out capacity.\n\n\"We are getting this kind of demand from several big customers almost every week. Lasers are the biggest bottleneck right now for the transceiver business\"\n\n3. China being years away from having CPO DWDM specification lasers.\n\nI covered this earlier when looking at CPO competition from channel checks.\n\nBut AAOI confirming that China is \"easily at least two, three years or even longer from having CPO lasers is incredible tread through on defensibility Western laser positioning in the CPO laser chokepoint.\n\nTLDR:\n\n- High demand imbalance for CW lasers and optical transceivers.\n\n- $AAOI not in first-gen CPO due to capacity constraints (not exactly bearish AAOI because they have too much demand for their optical transciver business, but even better news for the few independent players with capacity coming online like $SIVE)\n\n- China years behind in CPO lasers.", "text_zh": "哇，$AAOI 财报里全是给 $SIVE 及其他激光玩家的读穿宝石。\n\n1. AAOI 未实质参与第一代 CPO 部署。\n\n「我们就是造不够（CPO 激光），没法参与当前第一代（CPO）部署，因为产能不够。我们必须优先给自有收发器做激光。」\n\n因此第一代 CPO 激光部署，对西方玩家如 $SIVE、$LITE、$AVGO、$COHR 可能更集中。\n\n若 $AAOI 不得不更多婉拒客户，独立 CPO CW 激光产能更值钱……\n\n还记得 Trendforce 谈过 $AMD 签 CW LTA？$COHR/$LITE 产能已与 $NVDA 签约……\n\n我原以为会是 $AAOI，但它们可能出局。$MTSI 在早期 CPO 参与上也不显眼（财报几乎只提 NPO，且已从 Ayar 网站移除）。\n\n所以好奇 $AMD Helios 会找谁（现在更可能是 Sivers + Ayar）？\n\n顺便：这不是看空 AAOI——它们收发器业务需求太猛。只是更利好少数有产能的合格 CPO 激光名。\n\n2. InP 激光/光收发器需求失衡与瓶颈。\n\nAOI CEO 某种程度上印证：「客户需求比已扩建产能高约 20%–40%。」\n「几乎每周都从几家大客户收到这种需求。激光现在是收发器业务最大瓶颈。」\n\n3. 中国距离具备 CPO DWDM 规格激光还要好几年。\n\n渠道核对时我覆盖过 CPO 竞争。但 AAOI 确认中国「轻松至少两三年、甚至更久」才有 CPO 激光——对西方激光在 CPO 卡点上的可防御性是极强读穿。\n\nTLDR：\n- CW 激光与光收发器需求严重失衡\n- $AAOI 因产能约束不在第一代 CPO（对 AAOI 本身未必看空，因其收发器需求过旺；对 $SIVE 等少数独立有产能玩家更好）\n- 中国在 CPO 激光上落后数年", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HPGK8k-aUAAKysM.jpg", "width": 1793, "height": 712}, {"type": "photo", "url": "https://pbs.twimg.com/media/HPGK8i1b0AALg40.jpg", "width": 1859, "height": 1178}]}, {"id": "2085511646257332581", "url": "https://x.com/aleabitoreddit/status/2085511646257332581", "created_at": "Thu Aug 06 23:41:38 +0000 2026", "created_at_cst": "2026-08-07 07:41", "is_reply": false, "metrics": {"likes": 508, "retweets": 41, "replies": 82, "quotes": 2, "views": 142775, "bookmarks": 105}, "tickers": [{"symbol": "MTSI", "sentiment": "中性偏好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}], "themes": ["cpo_optics"], "text_en": "$MTSI earnings transcript: \n\n\"Customers are coming to us with urgency due to the general supply shortage of indium phosphide DFB lasers\"\n\nEmphasis on \"Urgency\", CW \"DFB lasers\", \"coming to us\".\n\nCW DFB names, such as like $SIVE and $LITE should be happy to hear about this laser bottleneck getting validated.", "text_zh": "$MTSI 财报电话会：\n\n「客户因磷化铟 DFB 激光普遍短缺，正带着紧迫感来找我们。」\n\n重点是「紧迫」「CW DFB 激光」「来找我们」。\n\n$SIVE、$LITE 这类 CW DFB 名字，听到激光瓶颈被验证应会高兴。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HPE4dHXbQAAZzgk.jpg", "width": 1597, "height": 866}]}, {"id": "2085499853099208716", "url": "https://x.com/aleabitoreddit/status/2085499853099208716", "created_at": "Thu Aug 06 22:54:46 +0000 2026", "created_at_cst": "2026-08-07 06:54", "is_reply": false, "metrics": {"likes": 1190, "retweets": 100, "replies": 110, "quotes": 16, "views": 193500, "bookmarks": 362}, "tickers": [{"symbol": "AAOI", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "JBL", "sentiment": "中性偏好"}, {"symbol": "COHR", "sentiment": "看好"}, {"symbol": "AVGO", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute", "memory", "daily_sweep"], "text_en": "Just some TLDR notes on $AAOI earnings:\n\n- Expects full qualification of 1.6T products by their hyperscaler customer within next couple of weeks \n\n(helpful revenue ramp #2, timelines)\n\n-  Continues to believe that AOI will have the largest AI DC transceiver production capacity in the US\n \n(reiterating ambitions during a time when their competitors might get banned)\n\n- Expects facilities toward InP capacity to come online in early 2027 \n\n(timeline FYI in terms of further ramp) \n\n- Total capacity is approaching 200,000/u per month, EOY 650,000/u per month of 800g/1.6t. EOY 2027, 930,000/u \n\n(this is the ramp i want to see)\n\n- \"increase our manufacturing capacity for our external light source or ELSFP. That's for co-packaged optics or CPO\". we anticipate ramping production later this year and into 2027, ultimately culminating in about 400,000 pieces per month in 2028\n\n(need some time to model this into revenue)\n\n- \"As we have mentioned before, we've been manufacturing lasers internally for many years. This has allowed us to avoid some of the shortages that  have affected others in the industry\"\n\n(vertical integration bull case during CW/EML laser shortages) \n\n- We believe that in the future, CPO will continue to drive increased demand for high-power lasers\n\n(thesis validation on CPO sector)\n\n- \"to our long-term objective of returning non-GAAP gross margins to around 40%\"\n\n-  \"We ended the second quarter with $508.8 million in total cash equivalents\"\n\nI need to double check if the ATM finished or not\n\n- \"our ability to deliver revenue in general, and specifically when it  comes to 800G products, is limited by our production capacity right now\" \"If we could produce more, we could ship more right now\"\n\nDemand > Supply validation. \n\n- \"Most of the increased capacity will be in U.S. Even so, let me say that, like I keep emphasizing, that is not good enough for the customer demand. The customer demand is 20%-40% higher.\"\n\nUnholy photonics demand validation across the whole sector, read through for $LITE, $SIVE / $JBL, and others is amazing. \n\n- \"Not in the next two, three years, especially the demand is so big. Okay?  Even combined AI, $LITE, $COHR, $AVGO all together, it's still very tough to meet the customer demand in the next few years\"\n\nMore optical sector demand validation. \n\n- CPO Timelines: \"If you're talking about really high volume manufacturer [for CPO market], I would say more like the late Q3 next year\" and \"We have been working very close with at least five customer\"\n\nIf you care about current earnings (which I'm not really looking at closely)\n\nRevenue: $191M vs. $190m \nEPS: $.06 vs. $.02\n\nTLDR: Extraordinary demand across the laser + optical sector read through. Kinda supporting Lumentum CEO statement that laser shortage is worse than memory shortages. \n\n2027 capacity ramp on track. To map inflection period with timelines, would be around early next year, as stated in their previous earnings call. \n\nAAOI has the customers now. Limitation is making enough lasers and transceivers.", "text_zh": "随便记一些 $AAOI 财报 TLDR：\n\n- 预期超大规模云客户将在未来几周内完成 1.6T 产品全面认证（有助于收入爬坡 #2、时间表）\n- 继续相信 AOI 将拥有美国最大的 AI 数据中心收发器产能（在竞争对手或被禁的背景下重申野心）\n- 预期 InP 相关产能设施 2027 年初上线（进一步放量时间表备忘）\n- 总产能接近每月 20 万只，年底 800G/1.6T 约每月 65 万只；2027 年底约每月 93 万只（这是我想看到的爬坡）\n- 「增加外置光源或 ELSFP 的制造产能，用于共封装光学或 CPO」。预期今年晚些到 2027 放量，最终 2028 年约每月 40 万件（还需建模进收入）\n- 「正如此前说过，我们内部制造激光已多年。这让我们避开了影响行业其他人的部分短缺」（CW/EML 短缺期的垂直整合多头案例）\n- 「我们相信未来 CPO 将继续推升高功率激光需求」（CPO 板块论点验证）\n- 「长期目标是把 non-GAAP 毛利率带回约 40%」\n- 「二季度末现金及等价物合计 5.088 亿美元」（需再核 ATM 是否结束）\n- 「总体交付能力、尤其是 800G，目前受产能限制。如果能造更多，现在就能出更多」（需求>供给验证）\n- 「大部分新增产能在美国。即便如此，仍不够客户需求。客户需求高出约 20%–40%。」\n全板块光子学需求验证，对 $LITE、$SIVE/$JBL 等读穿很强。\n- 「未来两三年，尤其需求这么大，即使把 AI、$LITE、$COHR、$AVGO 都合在一起，仍很难满足客户需求。」\n更多光学板块需求验证。\n- CPO 时间表：「若谈真正高量产，更像明年 Q3 末」；「至少与五家客户紧密合作」\n\n若你关心当季数字（我其实没太盯）：\n收入：1.91 亿 vs 1.90 亿；EPS：0.06 vs 0.02 美元\n\nTLDR：激光+光学板块需求极强的读穿，某种程度上支撑 Lumentum CEO「激光短缺比存储更严重」。2027 产能爬坡在轨；拐点映射约在明年初（与此前电话会一致）。AAOI 已有客户，限制是造不够激光和收发器。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HPEuJIwboAAeYCb.jpg", "width": 1825, "height": 1287}, {"type": "photo", "url": "https://pbs.twimg.com/media/HPEuNJdakAANLkb.jpg", "width": 1806, "height": 732}]}]}, "20260808": {"date": "20260808", "date_label": "2026年8月8日", "tweet_count": 2, "tweets": [{"id": "2085974141501612461", "url": "https://x.com/aleabitoreddit/status/2085974141501612461", "created_at": "Sat Aug 08 06:19:25 +0000 2026", "created_at_cst": "2026-08-08 14:19", "is_reply": false, "metrics": {"likes": 1848, "retweets": 112, "replies": 147, "quotes": 20, "views": 518140, "bookmarks": 545}, "tickers": [{"symbol": "NVDA", "sentiment": "一般"}, {"symbol": "MU", "sentiment": "一般"}, {"symbol": "CXMT", "sentiment": "一般"}, {"symbol": "SIVE.ST", "sentiment": "一般"}], "themes": ["cpo_optics", "ai_compute", "memory"], "text_en": "I've mapped the entire Wall Street bear playbook on AI names:\n\nHave your favorite institution/media insert one of these name down below:\n\n1. < ______ [GPUs, Transcivers, MLCC, Memory...] are a commodity set to crash> \n\n2. < ______ [YMTC, CXMT, Dongshan...] from China will flood the market > \n\n3. < ______ [Micron, Nvidia, ...] from unverifiable channel checks is facing issues > \n\n4. < ______ [Kospi, Sivers, ...] is a bubble like the ____ [2007, 2021] crash> \n\n5. <____ [1,2,3, ...] unexpected rate hikes this year>\n\n6. < _____ [Google, Nvidia, Deepseek ...] optimization removes the need of this!>  \n\nin a new headline, and it's ready to go!", "text_zh": "我把华尔街看空 AI 名字的整套剧本画出来了：\n\n请喜欢的机构/媒体在下方填空：\n\n1. 〈______【GPU、收发器、MLCC、存储…】是大宗商品、注定崩〉\n2. 〈______【长江存储、长鑫、东山精密…】中国货会淹没市场〉\n3. 〈______【美光、英伟达…】据不可核实渠道核对正出问题〉\n4. 〈______【KOSPI、Sivers…】是像____【2007、2021】那样的泡沫崩盘〉\n5. 〈今年意外加息____【1、2、3…】次〉\n6. 〈_____【谷歌、英伟达、DeepSeek…】优化后就不需要这个了！〉\n\n塞进新标题，稿子就齐了！", "media": []}, {"id": "2085823672569467005", "url": "https://x.com/aleabitoreddit/status/2085823672569467005", "created_at": "Fri Aug 07 20:21:30 +0000 2026", "created_at_cst": "2026-08-08 04:21", "is_reply": false, "metrics": {"likes": 1177, "retweets": 106, "replies": 126, "quotes": 16, "views": 313925, "bookmarks": 597}, "tickers": [{"symbol": "WWR", "sentiment": "一般"}, {"symbol": "SRL.AX", "sentiment": "一般"}, {"symbol": "FEAM", "sentiment": "一般"}, {"symbol": "HREE", "sentiment": "一般"}], "themes": ["cpo_optics", "daily_sweep"], "text_en": "There we go, White House finally invests in more breath in critical minerals/materials. Amazing policy move, as a TLDR:\n\n- $WWR receives $25M (graphite)\n- $SRL (ASX) receives $400M (Scandium)\n- $FEAM receives $8M (Boron)\n- $HREE receives $4.8M (magnet rare earths)\n\nout of the public companies. \n\nWith more private investments from $150 million into Niron Magnetics or $85 million into Standard Bauxite. \n\nIt's literally spare change to the US gov, for ENORMOUS amount of downstream applications. \n\nMore should be done with funding amounts to accelerate development and derisk supply chains (don't own any of the above, just support the policy move), but great announcement.", "text_zh": "来了，白宫终于在关键矿产/材料上投得更广。政策动作很赞，TLDR：\n\n- $WWR 获 2500 万美元（石墨）\n- $SRL（ASX）获 4 亿美元（钪）\n- $FEAM 获 800 万美元（硼）\n- $HREE 获 480 万美元（磁材稀土）\n\n以上为上市公司部分。\n\n还有更多私募：如 Niron Magnetics 1.5 亿、Standard Bauxite 8500 万。\n\n对美国政府简直是零花钱，下游应用却巨大。\n\n资助额还应加码以加速开发、降低供应链风险（以上我都不持仓，只支持政策动作），但公告很好。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HPJUPDAbEAADECd.png", "width": 1681, "height": 2151}, {"type": "photo", "url": "https://pbs.twimg.com/media/HPJUWyXbsAAEkTH.jpg", "width": 2031, "height": 2128}]}]}, "20260809": {"date": "20260809", "date_label": "2026年8月9日", "tweet_count": 4, "tweets": [{"id": "2086304269943419276", "url": "https://x.com/aleabitoreddit/status/2086304269943419276", "created_at": "Sun Aug 09 04:11:14 +0000 2026", "created_at_cst": "2026-08-09 12:11", "is_reply": false, "metrics": {"likes": 2408, "retweets": 84, "replies": 958, "quotes": 13, "views": 808131, "bookmarks": 1515}, "tickers": [], "themes": ["misc"], "text_en": "All right chat, it’s that time of the month again.\n\nWhat’s your #1 highest conviction stock and why? \n\nI actually learn a lot from reading these, so share some cool ideas.", "text_zh": "好了各位，又到每月这时候了。\n\n你最高信念的 #1 股票是什么？为什么？\n\n我其实从这些回复里学到很多，分享些酷想法吧。", "media": []}, {"id": "2086247069900300393", "url": "https://x.com/aleabitoreddit/status/2086247069900300393", "created_at": "Sun Aug 09 00:23:56 +0000 2026", "created_at_cst": "2026-08-09 08:23", "is_reply": false, "metrics": {"likes": 1290, "retweets": 89, "replies": 97, "quotes": 17, "views": 445667, "bookmarks": 320}, "tickers": [{"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "AAOI", "sentiment": "中性偏好"}, {"symbol": "MTSI", "sentiment": "一般"}, {"symbol": "300308.SZ", "sentiment": "谨慎"}, {"symbol": "300502.SZ", "sentiment": "谨慎"}], "themes": ["cpo_optics"], "text_en": "I think it’s a good time to revisit $SIVE ~$427m/yr midpoint capacity revenue modeled projections.\n\nGiven recent industry earnings:\n\n> $AAOI cited +20-40% demand imbalance for transceivers (with lasers as the bottleneck).\n\n> $MTSI saying many \"Customers are coming to us with urgency due to the general supply shortage of indium phosphide DFB lasers\" (in other product lines)\n\n> US proposal ban on new Chinese optical transceivers (Innolight/Eoptolink)\n\n> AOI no meaningful participation in first-gen CPO deployments due to lasers being allocated toward transceivers. \n\nThe read through is that it’s possible to apply the same capacity-demand absorption modeling applying to $AAOI, but for other laser players like Sivers too.\n\nGiven the widespread shortage and demand imbalance for InP CW DFB capacity.", "text_zh": "我觉得是时候重温 $SIVE 约 4.27 亿美元/年中枢产能收入模型了。\n\n鉴于近期行业财报：\n> $AAOI 称收发器需求失衡 +20–40%（激光为瓶颈）\n> $MTSI 称许多「客户因磷化铟 DFB 激光普遍短缺，正带着紧迫感来找我们」（其它产品线）\n> 美国拟禁新增中国光收发器（中际旭创/太辰光）\n> AOI 因激光优先自用收发器，未实质参与第一代 CPO\n\n读穿是：可以把套在 $AAOI 上的产能-需求吸收模型，同样用到 Sivers 等其它激光玩家。\n\n鉴于 InP CW DFB 产能普遍短缺与需求失衡。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HPPWpnhbUAA0kgU.jpg", "width": 1250, "height": 754}]}, {"id": "2086157318065168490", "url": "https://x.com/aleabitoreddit/status/2086157318065168490", "created_at": "Sat Aug 08 18:27:18 +0000 2026", "created_at_cst": "2026-08-09 02:27", "is_reply": false, "metrics": {"likes": 2636, "retweets": 141, "replies": 225, "quotes": 33, "views": 533034, "bookmarks": 784}, "tickers": [{"symbol": "NBIS", "sentiment": "看好"}, {"symbol": "GOOGL", "sentiment": "看好"}, {"symbol": "AMZN", "sentiment": "看好"}, {"symbol": "META", "sentiment": "看好"}, {"symbol": "NKE", "sentiment": "一般"}, {"symbol": "LULU", "sentiment": "一般"}], "themes": ["ai_compute"], "text_en": "Today I'm writing a weekend guide on how to do DD when shorting $NBIS:\n\nFirst, you look at hyperscaler earnings for AI cloud read through: \n\n> $GOOGL: reports record AI cloud demand + backlog + margin increases from earnings\n\n> $AMZN: reports record AI Cloud demand + backlog + margin increases from earnings\n\n> $META: reports higher than expected prices for available capacity from earnings.\n\nNow, time to look at Nebius:\n\n-> $NBIS: Growing hundreds of percent to $7-9B ARR by Q4. Growing margins, and guided 4GW+ contracted power. \n-> Sees Uber/Waymo splitting, putting more focus on Avride\n-> Sees Clickhouse growing rapidly every quarter. \n\nOkay looks bad! But next, you need a hedge?\n\n-> Wow! A $NIKE brand executive, after the stock dropped 75% over the past 5 years, went to $LULU to save that brand next? Lululemon seems good.\n\nConclusion: Short Nebius and go long on $LULU", "text_zh": "今天写篇周末指南：做空 $NBIS 该怎么做 DD：\n\n先看超大规模云财报对 AI 云的读穿：\n> $GOOGL：创纪录 AI 云需求 + backlog + 利润率提升\n> $AMZN：创纪录 AI 云需求 + backlog + 利润率提升\n> $META：可用产能报价高于预期\n\n再看 Nebius：\n→ $NBIS：增长数百百分点，Q4 ARR 约 70–90 亿；利润率升，指引签约电力 4GW+\n→ 看到 Uber/Waymo 拆伙，更聚焦 Avride\n→ 看到 ClickHouse 每季快速成长\n\n看起来不妙！那对冲呢？\n\n→ 哇！一位 $NIKE 品牌高管，在股价五年跌 75% 后，转投 $LULU 去救那个品牌？Lululemon 看起来不错。\n\n结论：做空 Nebius，做多 $LULU", "media": []}, {"id": "2086148557187461412", "url": "https://x.com/aleabitoreddit/status/2086148557187461412", "created_at": "Sat Aug 08 17:52:29 +0000 2026", "created_at_cst": "2026-08-09 01:52", "is_reply": false, "metrics": {"likes": 2959, "retweets": 226, "replies": 153, "quotes": 35, "views": 766695, "bookmarks": 806}, "tickers": [{"symbol": "MU", "sentiment": "看好"}, {"symbol": "005930.KS", "sentiment": "看好"}, {"symbol": "AXTI", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "COHR", "sentiment": "看好"}, {"symbol": "AAOI", "sentiment": "看好"}, {"symbol": "SPCX", "sentiment": "一般"}], "themes": ["cpo_optics", "ai_compute", "memory", "macro_noise"], "text_en": "Yes, I'm still bullish on memory like $MU / Samsung.\n\nAs I said earlier, markets tend to rotate from bottleneck to bottleneck.\n\nThis week it looks $AXTI to $LITE in the photonics sector is the focus again. \n\nThe thing is... the primary thing that changed are the stock prices, followed by some narratives + updates sprinkled in here and there.\n\nFor photonics:\n\n> We already knew $COHR / $LITE lasers were completely sold out for the next 2 years during July's drop. \n\n> We knew about demand imbalance from $AAOI from last quarter's earnings calls.\n\nNothing deteriorated fundamentally during July's crash, other than listed price after liquidations. \n\nYet tons of people called $AAOI a \"scam\" when it dropped to $75, or $AXTI a \"scam\" on its drop to $35... \n\nBut are bullish again at $140 or $80, when the transciver/InP substrate bottleneck hasn't changed at all, but maybe even got worse... (eg. draft for US ban on new china optical transceivers, scale up demand projections)\n\nFor Memory:\n\nI'm witnessing a lot of retail capitulation, but the same people I'm seeing were mega bullish after $MU signed 16 SCAs and gave exceptional projections a month ago. \n\nOr were celebrating Samsung having the highest operating profit in the world.\n\nThere's updates here and there eg. Rubin Ultra with memory optimizations (which Nvidia strives for every generation), with prices no longer being hiked way above expectations to the extreme. \n\nBut the operating income relative to MC is just absurd around current prices, especially memory becomes structural. \n\nAnd the demand imbalance should be even worse next year.  \n\nPeople tend to capitulate and follow narratives when a sector drops (eg. Helium/LNG back in Iran war), even if the bottleneck or fundamental situation hasn't really changed much (eg. $SPCX Elon earnings call reiterating memory tightness). \n\nI can't tell others what to to do: \n\nBut $AAOI at $140 and $AAOI at $75 are the same company.\n\nSamsung at a $1.5T MC and Samsung at a $980B MC are the same company. \n\nJust valuations and narratives (often noise) change, and markets rotate from sector to sector.", "text_zh": "是的，我仍看多存储如 $MU / 三星。\n\n如前所说，市场往往从一个瓶颈轮动到另一个瓶颈。\n\n这周焦点又回到光子学的 $AXTI 到 $LITE。\n\n变的主要是股价，再夹杂一些叙事与更新。\n\n光子学：\n> 我们在 7 月下跌时就知道 $COHR / $LITE 激光未来两年完全售罄。\n> 从上季电话会就知道 $AAOI 有需求失衡。\n\n7 月崩盘期间基本面并未恶化，变的只是清算后的挂牌价。\n\n却有一堆人在 $AAOI 跌到 75 美元、$AXTI 跌到 35 美元时喊「骗局」……\n\n现在 140 或 80 美元又变多头——收发器/InP 衬底瓶颈根本没变，甚至可能更糟（如拟禁新增中国光收发器、scale-up 需求预测）。\n\n存储：\n我看到很多散户投降，但同批人一个月前还在 $MU 签 16 份 SCA、给出惊人展望时超级多头，或庆祝三星全球营业利润第一。\n\n这里那里有更新，如 Rubin Ultra 带存储优化（英伟达每代都在做），涨价也不再极端超预期。\n\n但以当前市值看营业利润仍荒谬偏高，尤其存储变结构性。\n\n明年需求失衡应更严重。\n\n板块一跌，人们就爱投降、跟叙事（如伊朗战争时的氦气/LNG），即便瓶颈或基本面没怎么变（如 $SPCX 马斯克电话会再申存储紧张）。\n\n我不能指挥别人怎么做：\n\n但 140 美元的 $AAOI 与 75 美元的 $AAOI 是同一家公司。\n\n1.5 万亿市值的三星与 9800 亿市值的三星是同一家公司。\n\n变的是估值与叙事（常是噪音），市场在板块间轮动。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HPN5isfawAA4lXb.jpg", "width": 1320, "height": 711}]}]}, "20260810": {"date": "20260810", "date_label": "2026年8月10日", "tweet_count": 3, "tweets": [{"id": "2086840511164514742", "url": "https://x.com/aleabitoreddit/status/2086840511164514742", "created_at": "Mon Aug 10 15:42:04 +0000 2026", "created_at_cst": "2026-08-10 23:42", "is_reply": false, "metrics": {"likes": 917, "retweets": 37, "replies": 130, "quotes": 6, "views": 241448, "bookmarks": 101}, "tickers": [{"symbol": "AAOI", "sentiment": "一般"}], "themes": ["cpo_optics", "memory"], "text_en": "Be Barrons:\n\n- Wants to write about optical supply supply chains like $AAOI\n\n- Hiring DPT: who needs engineers to write about this something this simple?  Let’s find underpaid political philosophy backgrounds.\n\n- proceeds to find a new hire from nonprofit communication consulting\n\n- first day on job: gets paid to model revenue ramp/margins projections, CW laser bottlenecks, internal capacity\n\n- New hire: “I don’t understand this sht”, “looks like a memestock”\n\nBarrons: “Memestock? looks like our next article, I don’t understand either”.", "text_zh": "做 Barron’s 的一天：\n\n- 想写光学供应链如 $AAOI\n- 招聘部：这种简单东西还要工程师？找薪水低的政治哲学背景就行。\n- 于是招了非营利传播咨询出身的新人\n- 入职第一天：拿钱建模收入爬坡/利润率、CW 激光瓶颈、内部产能\n- 新人：「我看不懂这破玩意」「像 meme 股」\n- Barron’s：「Meme 股？听起来像下一篇稿，我也不懂。」", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HPXyYbsbwAAiZ1y.jpg", "width": 1231, "height": 567}, {"type": "photo", "url": "https://pbs.twimg.com/media/HPXyYbsaEAAm8bP.jpg", "width": 1228, "height": 764}]}, {"id": "2086730782425727183", "url": "https://x.com/aleabitoreddit/status/2086730782425727183", "created_at": "Mon Aug 10 08:26:02 +0000 2026", "created_at_cst": "2026-08-10 16:26", "is_reply": false, "metrics": {"likes": 399, "retweets": 20, "replies": 64, "quotes": 0, "views": 61276, "bookmarks": 64}, "tickers": [{"symbol": "SIVE.ST", "sentiment": "看好"}, {"symbol": "LITE", "sentiment": "看好"}, {"symbol": "COHR", "sentiment": "看好"}, {"symbol": "AAOI", "sentiment": "看好"}], "themes": ["cpo_optics", "ai_compute", "memory", "macro_noise"], "text_en": "Now that markets are hosting a laser party again from $SIVE, OE Solutions, $LITE, Coherent, to $AAOI.\n\nThere’s a pretty interesting study:\n\nBoth from Fidelity and a UC Berkeley research paper, that the best investors are the ones who either…\n\n- Anecdotally forgot about their account (Fidelity)\n- Didn’t actively trade/overtrade (18.5% return from infrequent traders vs. 11.4%).\n\nNot any advice, but some of these anecdotes might be helpful to retail to read in general…\n\nSince I witnessed a lot capitulation off memory, photonics, or thematic volatility, just for retail not have positions on a sharp recovery.\n\nHaving conviction also usually people in that “not overtrading” camp, since it helps to not overtrade in drops or see opportunities to cost average.", "text_zh": "既然市场又从 $SIVE、OE Solutions、$LITE、Coherent 到 $AAOI 办起激光派对。\n\n有个挺有意思的研究：\n\n富达与加州伯克利论文都指出，最好的投资者往往是……\n- 传闻式「忘了自己有账户」的人（富达）\n- 不频繁交易/不过度交易的人（低频交易者回报约 18.5% vs 11.4%）\n\n不是建议，但这些轶事对散户或许有帮助……\n\n因为我见到很多人在存储、光子学或主题波动里投降，结果急反弹时手里没仓。\n\n有信念的人也通常落在「不过度交易」那一营——有助于下跌时不乱动，或看到摊低成本的机会。", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HPWOfyQbkAAfRmQ.jpg", "width": 1024, "height": 809}, {"type": "photo", "url": "https://pbs.twimg.com/media/HPWOfv_boAAA8ID.jpg", "width": 833, "height": 1024}, {"type": "photo", "url": "https://pbs.twimg.com/media/HPWOfxWbYAASl59.jpg", "width": 1024, "height": 547}]}, {"id": "2086634510935118161", "url": "https://x.com/aleabitoreddit/status/2086634510935118161", "created_at": "Mon Aug 10 02:03:29 +0000 2026", "created_at_cst": "2026-08-10 10:03", "is_reply": false, "metrics": {"likes": 866, "retweets": 38, "replies": 117, "quotes": 6, "views": 189291, "bookmarks": 206}, "tickers": [{"symbol": "AMD", "sentiment": "中性偏好"}, {"symbol": "NVDA", "sentiment": "中性偏好"}, {"symbol": "ASTS", "sentiment": "一般"}, {"symbol": "RKLB", "sentiment": "一般"}, {"symbol": "LITE", "sentiment": "中性偏好"}, {"symbol": "NBIS", "sentiment": "中性偏好"}, {"symbol": "CCXI", "sentiment": "中性偏好"}], "themes": ["cpo_optics", "ai_compute", "humanoid"], "text_en": "Just some near term events:\n\n- OCP APAC tomorrow (Ayar, Lightmatter, $AMD, $NVDA) and your CPO players are giving announcements/updates.\n\nThis should be a catalyst for certain optical players.\n\n- Earnings week: with $ASTS, $RKLB reporting today (space), $LITE on Tuesday (photonics), $NBIS in the middle of plain": "机柜到机柜之间的互联。"}, "HVM": {"plain": "High Volume Manufacturing：大规模量产，不是样品或小批量试产。"}, "量产": {"plain": "大规模生产（HVM），不再是送样/试产。"}, "burn-in": {"plain": "老化测试：让芯片在出厂前「烤一烤/压一压」，把早期会坏的挑出来。"}, "Burn-in": {"plain": "老化测试：出厂前加压加热筛掉早期失效芯片。"}, "晶圆级老化": {"plain": "还没切成单颗芯片前，在整片晶圆上做老化测试，效率更高。"}, "wafer-level burn-in": {"plain": "晶圆级老化测试：在整片晶圆上筛芯片，而不是封装后才测。"}, "封装级 burn-in": {"plain": "芯片封装完成后的老化测试。"}, "package level burn-in": {"plain": "封装后老化测试。"}, "backlog": {"plain": "在手未完成订单/积压订单，能反映未来一段时间的收入能见度。"}, "Backlog": {"plain": "在手订单（还没交付完的订单）。"}, "LTA": {"plain": "Long-Term Agreement：长期供货/采购协议，锁定未来几年的量或合作关系。"}, "长期协议": {"plain": "LTA，长期采购/供货合同。"}, "design win": {"plain": "设计定案/打入客户方案：客户产品设计里选定了你的零部件，后续才可能放量。"}, "Design win": {"plain": "打入客户设计方案（design win）。"}, "打入设计": {"plain": "design win：被写进客户产品方案里。"}, "OSINT": {"plain": "开源情报：用公开网页、招聘、官网变更等信息做推理，不是内部小道消息。"}, "开源情报": {"plain": "用公开信息做研究判断（OSINT）。"}, "ADR": {"plain": "美国存托凭证：让外国公司股票能在美股交易的一种形式。"}, "P/E": {"plain": "市盈率：股价相对每股盈利的倍数，用来粗看贵不贵。"}, "远期 P/E": {"plain": "用未来某年预期利润算的市盈率，不是看去年已经实现的利润。"}, "ASP": {"plain": "Average Selling Price：平均售价。"}, "BOM": {"plain": "Bill of Materials：物料清单成本，把零部件加总看一台设备要花多少钱。"}, "TAM": {"plain": "Total Addressable Market：潜在总市场空间，也就是「饼能有多大」。"}, "指引": {"plain": "公司对未来业绩的官方展望（guide），市场很看重。"}, "guide": {"plain": "业绩指引：公司自己给出的未来收入/利润展望。"}, "CPI": {"plain": "消费者物价指数，衡量通胀的关键宏观数据，公布时常扰动风险资产。"}, "Mag7": {"plain": "美股七大科技巨头（微软、苹果、英伟达、亚马逊、Alphabet、Meta、特斯拉等口径）。"}, "前沿实验室": {"plain": "做最前沿大模型的 AI 实验室/公司（如 OpenAI、Anthropic 等）。"}, "frontier lab": {"plain": "前沿 AI 实验室/模型公司。"}, "主权 AI": {"plain": "国家/政府主导建设的本国 AI 算力与模型能力，不完全依赖美国云巨头。"}, "Sovereign AI": {"plain": "主权 AI：国家层面的 AI 算力与产业自主。"}, "LRO": {"plain": "与线性可插拔/光模块架构相关的技术路径讨论（语境中常和 1.6T 高速光互联一起出现）。"}, "1.6T": {"plain": "单端口/模块 1.6Tbps 量级的高速光互联世代，比 800G 更快一代。"}, "800G": {"plain": "单端口/模块 800Gbps 量级的高速光模块世代，当前数据中心主力升级方向之一。"}, "300mm": {"plain": "直径 300 毫米的大尺寸晶圆，是先进芯片主流生产规格。"}, "TGV": {"plain": "Through-Glass Via：玻璃通孔，玻璃基板先进封装里的关键工艺。"}, "玻璃基板": {"plain": "用玻璃做芯片封装基板的路线， const GLOSSARY = BOARD.glossary || {};
const glossKeys = Object.keys(GLOSSARY).sort((a,b) => b.length - a.length);
const glossByFirst = {};
glossKeys.forEach(k => { const f = k[0]; (glossByFirst[f] ||= []).push(k); });
function glossIsAscii(s) { return /^[A-Za-z0-9][A-Za-z0-9./+\-]*$/.test(s); }
function glossIsAlnum(ch) { return !!ch && /[A-Za-z0-9]/.test(ch); }
function splitGloss(text) {
  const parts = []; let buf = ''; let i = 0;
  const src = String(text || '');
  while (i < src.length) {
    const cands = glossByFirst[src[i]]; let matched = null;
    if (cands) {
      for (const term of cands) {
        if (!src.startsWith(term, i)) continue;
        if (glossIsAscii(term)) {
          const prev = i > 0 ? src[i-1] : '';
          const next = src[i + term.length] || '';
          if (glossIsAlnum(prev) || glossIsAlnum(next)) continue;
        }
        matched = term; break;
      }
    }
    if (matched) {
      if (buf) { parts.push({text: buf}); buf = ''; }
      parts.push({text: matched, term: matched});
      i += matched.length;
    } else { buf += src[i]; i++; }
  }
  if (buf) parts.push({text: buf});
  return parts;
}
function renderGlossHtml(text) {
  if (!text) return '';
  return splitGloss(text).map(p => {
    if (p.term && GLOSSARY[p.term]) {
      const plain = String(GLOSSARY[p.term].plain || '').replace(/"/g, '&quot;');
      return `<span class="gloss-term" tabindex="0" data-term="${escapeHtml(p.term)}" data-plain="${plain}">${escapeHtml(p.text)}</span>`;
    }
    return escapeHtml(p.text);
  }).join('');
}
const tip = document.getElementById('gloss-tip');
function showTip(el) {
  tip.textContent = el.dataset.plain || '';
  tip.classList.add('visible');
  positionTip(el);
}
function hideTip() { tip.classList.remove('visible'); }
function positionTip(el) {
  const r = el.getBoundingClientRect();
  const margin = 8, gap = 4;
  let top = r.bottom + gap;
  let left = r.left;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
  const tr = tip.getBoundingClientRect();
  if (tr.bottom > window.innerHeight - margin) top = r.top - tr.height - gap;
  if (tr.right > window.innerWidth - margin) left = Math.max(margin, window.innerWidth - tr.width - margin);
  tip.style.left = left + 'px';
  tip.style.top = Math.max(margin, top) + 'px';
}
document.addEventListener('mouseover', e => {
  const t = e.target.closest('.gloss-term');
  if (t) showTip(t);
});
document.addEventListener('mouseout', e => {
  const t = e.target.closest('.gloss-term');
  if (t && !e.relatedTarget?.closest?.('.gloss-term')) hideTip();
});
document.addEventListener('focusin', e => { if (e.target.classList?.contains('gloss-term')) showTip(e.target); });
document.addEventListener('focusout', e => { if (e.target.classList?.contains('gloss-term')) hideTip(); });

function formatSymbol(sym) {
  // 非美股（带市场后缀）或已含点号：原样展示；纯美股代码前加 $
  if (!sym) return "";
  if (/[.]/.test(sym) || /[^A-Za-z]/.test(sym)) return sym;
  return "$" + sym;
}
function tickerHtml(tickers) {
  if (!tickers || !tickers.length) return '<span class="muted">无明确可交易标的</span>';
  return tickers.map(t => {
    const c = SENT_COLOR[t.sentiment] || "#6b7280";
    return `<span class="ticker-pill" title="${t.sentiment}" style="color:${c}">${formatSymbol(t.symbol)}</span>`;
  }).join("");
}

function renderCalendar() {
  document.getElementById("monthLabel").textContent = `${viewYear}年${viewMonth+1}月`;
  const first = new Date(viewYear, viewMonth, 1);
  let startPad = (first.getDay() + 6) % 7; // Monday=0
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const avail = new Set(BOARD.calendar.available_dates);
  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";
  for (let i=0;i<startPad;i++) {
    const b=document.createElement("button"); b.className="cal-day"; b.disabled=true; b.textContent=""; grid.appendChild(b);
  }
  for (let d=1; d<=daysInMonth; d++) {
    const dk = `${viewYear}${String(viewMonth+1).padStart(2,"0")}${String(d).padStart(2,"0")}`;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cal-day" + (avail.has(dk) ? " has-data" : "") + (dk===selectedDate ? " selected" : "");
    btn.textContent = d;
    if (avail.has(dk)) btn.onclick = () => { selectedDate = dk; renderCalendar(); renderDay(); };
    grid.appendChild(btn);
  }
}

    document.getElementById("cntReply").textContent = "";
    filterRoot.querySelectorAll(".filter-tab").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.filter === postFilter);
    });
    return;
  }
  const all = day.tweets;
  const originals = all.filter(t => !t.is_reply);
  const replies = all.filter(t => t.is_reply);
  document.getElementById("cntAll").textContent = `(${all.length})`;
  document.getElementById("cntOrig").textContent = `(${originals.length})`;
  document.getElementById("cntReply").textContent = `(${replies.length})`;
  filterRoot.querySelectorAll(".filter-tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.filter === postFilter);
  });

  let shown = all;
  if (postFilter === "original") shown = originals;
  else if (postFilter === "reply") shown = replies;

  const filterLabel = postFilter === "original" ? "原创/主帖" : postFilter === "reply" ? "回复" : "全部";
  document.getElementById("dayTitle").textContent = `${day.date_label} · ${filterLabel} ${shown.length}/${day.tweet_count}`;

  if (!shown.length) {
    document.getElementById("dayTweets").innerHTML = `<p class="muted">该日没有「${filterLabel}」推文，可切换上方筛选。</p>`;
    return;
  }

  document.getElementById("dayTweets").innerHTML = shown.map(t => `
    <article class="tweet-card" id="tw-${t.id}">
      <div class="tweet-meta">
        <strong>${t.created_at_cst}</strong>
        ${t.is_reply ? '<span class="pill j-info">回复</span>' : '<span class="pill j-success">原创/主帖</span>'}
        <span class="muted">❤ ${t.metrics.likes||0} · 🔁 ${t.metrics.retweets||0} · 💬 ${t.metrics.replies||0}</span>
        <a href="${t.url}" target="_blank" rel="noopener">打开原推</a>
      </div>
      <div style="margin-bottom:8px">${tickerHtml(t.tickers)}</div>
      <div class="bilingual">
        <div class="col-zh">
          <div class="col-label">中文翻译</div>
          <div class="col-body">${renderGlossHtml(t.text_zh)}</div>
        </div>
        <div class="col-en">
          <div class="col-label">ENGLISH ORIGINAL</div>
          <div class="col-body">${renderGlossHtml(t.text_en)}</div>
        </div>
      </div>
    </article>
  `).join("");
}

function escapeHtml(s) {
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function renderThemes() {
  const root = document.getElementById("themeWall");
  root.innerHTML = BOARD.themes.map((th) => `
    <div class="theme-block" data-id="${th.id}">
      <button type="button" class="theme-head" onclick="this.parentElement.classList.toggle('open')">
        <span><strong>${th.name_zh}</strong> <span class="pill ${SENT_CLASS[th.stance]||"j-info"}">${th.stance}</span>
        <span style="margin-left:6px">${tickerHtml(th.tickers)}</span></span>
        <span class="muted">${th.entries.length} 条</span>
      </button>
      <div class="theme-body">
        ${th.entries.map(e => `
          <div class="entry">
            <div class="tweet-meta">
              <span class="pill">${e.date}</span>
              <span class="pill ${SENT_CLASS[e.judgment]||"j-info"}">${e.judgment}</span>
              ${tickerHtml(e.tickers)}
              <button class="theme-toggle" style="padding:2px 8px;font-size:.75rem" type="button"
                onclick="selectedDate='${e.date}';renderCalendar();renderDay();document.getElementById('tw-${e.tweet_id}')?.scrollIntoView({behavior:'smooth',block:'start'})">查看推文</button>
            </div>
            <div class="entry-summary">${renderGlossHtml(e.bullet)}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");
}

document.getElementById("prevMonth").onclick = () => {
  viewMonth--; if (viewMonth<0) { viewMonth=11; viewYear--; } renderCalendar();
};
document.getElementById("nextMonth").onclick = () => {
  viewMonth++; if (viewMonth>11) { viewMonth=0; viewYear++; } renderCalendar();
};
document.getElementById("themeBtn").onclick = () => {
  const root = document.documentElement;
  const cur = root.getAttribute("data-theme");
  root.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
};
document.getElementById("postFilter").addEventListener("click", (e) => {
  const btn = e.target.closest(".filter-tab");
  if (!btn) return;
  postFilter = btn.dataset.filter || "all";
  renderDay();
});

renderStats();
renderCalendar();
renderDay();
renderThemes();
</script>
</body>
</html>
